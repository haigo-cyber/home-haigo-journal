  const o = ws3d.opt;
  return `<div class="ws3d-root${ws3d.full?" full":""}" id="ws3dRoot"><div class="ws3d-bar">
    <button class="ws-addbtn ws3d-back" id="ws3dBack" title="Vollbild beenden (Esc)">← Zurück zur App</button>
    <select id="ws3dDoc" class="ws-in"><option value="">Alle Dokumente</option>${wsDocs.map(d=>`<option value="${esc(d.id)}"${o.doc===d.id?" selected":""}>${esc(d.title||"(ohne Titel)")}</option>`).join("")}</select>
    <select id="ws3dHead" class="ws-in" title="Nur die Einträge unter einer bestimmten Überschrift zeigen">${ws3dHeadOpts()}</select>
    <input id="ws3dQ" class="ws-in" type="search" placeholder="Suchen" value="${esc(o.q)}">
    <select id="ws3dLay" class="ws-in" title="Anordnung"><option value="tree"${o.layout==="tree"?" selected":""}>Baum (geordnet)</option><option value="net"${o.layout==="net"?" selected":""}>Netz (frei)</option></select>
    <label class="ws3d-ck"><input type="checkbox" id="ws3dDone"${o.showDone?" checked":""}> Erledigte</label>
    <label class="ws3d-ck"><input type="checkbox" id="ws3dTags"${o.tags?" checked":""}> Tags als Knoten</label>
    <label class="ws3d-ck"><input type="checkbox" id="ws3dLab"${o.labels?" checked":""}> Beschriftung</label>
    <label class="ws3d-ck"><input type="checkbox" id="ws3dFloor"${o.floor?" checked":""}> Boden</label>
    <label class="ws3d-ck" title="Ein Klick auf einen Eintrag öffnet ihn sofort zum Bearbeiten"><input type="checkbox" id="ws3dEdit"${o.edit?" checked":""}> Klick bearbeitet</label>
    <label class="ws3d-ck"><input type="checkbox" id="ws3dSpin"${o.spin?" checked":""}> Drehen</label>
    <button class="ws-addbtn" id="ws3dReset">Ansicht zurücksetzen</button>
    <button class="ws-addbtn" id="ws3dShake">Neu ordnen</button>
    <button class="ws-addbtn" id="ws3dFull" title="3D-Ansicht im Vollbild zeigen">⛶ Vollbild</button>
  </div>
  <div class="ws3d-wrap" id="ws3dWrap"><canvas id="ws3dCv" aria-label="3D-Übersicht der Dokumente, Punkte, Anhänge und Tags"></canvas>
    <div class="ws3d-zoom"><button type="button" id="ws3dZin" title="Vergrößern" aria-label="Vergrößern">+</button><button type="button" id="ws3dZout" title="Verkleinern" aria-label="Verkleinern">-</button></div>
    <div class="ws3d-hint">Ziehen: drehen · Mausrad oder zwei Finger: zoomen · Umschalt+Ziehen oder zwei Finger ziehen: verschieben · Klick auf Knoten: Details · Doppelklick: öffnen</div></div>
  <div class="ws3d-info" id="ws3dInfo"></div></div>`;
}
/* Vollbild: die 3D-Ansicht legt sich über die ganze Seite; die App darunter bleibt unverändert und offen */
function ws3dSetFull(on, keepBrowserFs){
  ws3d.full = !!on;
  document.body.classList.toggle("ws3d-fs", ws3d.full);
  const root = document.getElementById("ws3dRoot"); if(root) root.classList.toggle("full", ws3d.full);
  try{
    if(ws3d.full && !document.fullscreenElement && document.documentElement.requestFullscreen){ ws3d.fsOwn = true; const p = document.documentElement.requestFullscreen(); if(p && p.catch) p.catch(()=>{ ws3d.fsOwn = false; }); }
    else if(!ws3d.full && !keepBrowserFs && document.fullscreenElement && ws3d.fsOwn){ ws3d.fsOwn = false; const p = document.exitFullscreen(); if(p && p.catch) p.catch(()=>{}); }
  }catch(e){ ws3d.fsOwn = false; }
  requestAnimationFrame(()=>{ ws3dResize(); if(ws3d.opt && ws3d.g && ws3d.g.nodes.length && !ws3d.userCam) ws3dFit(); ws3dKick(); });
}
document.addEventListener("fullscreenchange", ()=>{ if(!document.fullscreenElement && ws3d.full && ws3d.fsOwn){ ws3d.fsOwn = false; ws3dSetFull(false, true); } });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && ws3d.full && !e.__wsEsc && !document.getElementById("modalBg") && !document.getElementById("wsFv")) ws3dSetFull(false); });
function ws3dHue(t){ let h = 0; const k = (wsTagList(t)[0]||"").toLowerCase(); for(let i=0;i<k.length;i++) h = (h*31 + k.charCodeAt(i))%360; return h; }
function ws3dColor(n){ return n.eff ? `hsl(${ws3dHue(n.eff)},48%,60%)` : "#8b93a1"; }
function ws3dColorHi(n){ return n.eff ? `hsl(${ws3dHue(n.eff)},55%,84%)` : "#d3d8e0"; }
/* Geordnetes Layout: Dokumente verteilt im Raum, Unterpunkte in Kegeln nach außen, Tags im Schwerpunkt ihrer Elemente */
function ws3dTreeLayout(){
  const g = ws3d.g, kids = new Map(g.nodes.map(n=>[n.id, []])), leaves = new Map();
  g.links.forEach(l=>{ if(l.kind==="tree") kids.get(l.a).push(l.b); });
  const cnt = id=>{ if(leaves.has(id)) return leaves.get(id); const k = kids.get(id); const v = k.length ? k.reduce((s,x)=>s+cnt(x),0) : 1; leaves.set(id, v); return v; };
  const norm = v=>{ const m = Math.hypot(v[0],v[1],v[2])||1; return [v[0]/m,v[1]/m,v[2]/m]; };
  const cross = (a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
  const set = (id,x,y,z)=>ws3d.pos.set(id, {x,y,z,vx:0,vy:0,vz:0});
  const roots = g.nodes.filter(n=>n.kind==="doc"); roots.forEach(r=>cnt(r.id));
  const place = (id, x, y, z, u, depth, cap)=>{
    set(id, x, y, z); const k = kids.get(id); if(!k.length) return;
    const v1 = norm(cross(u, Math.abs(u[2])<0.9 ? [0,0,1] : [1,0,0])), v2 = cross(u, v1);
    k.forEach((c,i)=>{
      let p; if(k.length===1 && depth>0) p = [0,0,1];
      else{ const ct = 1-(i+0.5)/k.length*(1-cap), st = Math.sqrt(Math.max(0,1-ct*ct)), ph = i*2.399963; p = [st*Math.cos(ph), st*Math.sin(ph), ct]; }
      const d = norm([v1[0]*p[0]+v2[0]*p[1]+u[0]*p[2], v1[1]*p[0]+v2[1]*p[1]+u[1]*p[2], v1[2]*p[0]+v2[2]*p[1]+u[2]*p[2]]);
      const len = (depth===0 ? 150 : 95) + 14*Math.sqrt(leaves.get(c));
      place(c, x+d[0]*len, y+d[1]*len, z+d[2]*len, d, depth+1, -0.25);
    });
  };
  const R = roots.length>1 ? 220+70*Math.sqrt(roots.length) : 0;
  roots.forEach((r,i)=>{
    if(roots.length===1){ place(r.id, 0, 0, 0, [0,0,1], 0, -1); return; }
    const ct = 1-(i+0.5)/roots.length*2, st = Math.sqrt(1-ct*ct), ph = i*2.399963, u = [st*Math.cos(ph), st*Math.sin(ph), ct];
    place(r.id, u[0]*R, u[1]*R, u[2]*R, u, 0, -0.25);
  });
  g.nodes.forEach(n=>{
    if(n.kind!=="tag") return;
    let sx=0, sy=0, sz=0, c=0;
    g.links.forEach(l=>{ if(l.kind==="tag" && l.b===n.id){ const p = ws3d.pos.get(l.a); if(p){ sx+=p.x; sy+=p.y; sz+=p.z; c++; } } });
    if(c) set(n.id, sx/c*1.12, sy/c*1.12, sz/c*1.12);
  });
  g.nodes.forEach(n=>{ if(!ws3d.pos.has(n.id)) set(n.id, (Math.random()-.5)*400, (Math.random()-.5)*400, (Math.random()-.5)*400); });
}
function ws3dBuild(){
  const o = ws3d.opt;
  const g = wsGraph(wsDocs, {doc:o.doc, head:o.head, showDone:o.showDone, tags:o.tags, max:1000});
  ws3d.g = g; ws3d.byId = new Map(g.nodes.map(n=>[n.id, n]));
  ws3d.nb = new Map(g.nodes.map(n=>[n.id, new Set()]));
  const parentOf = new Map();
  g.links.forEach(l=>{ ws3d.nb.get(l.a).add(l.b); ws3d.nb.get(l.b).add(l.a); if(!parentOf.has(l.b)) parentOf.set(l.b, l.a); });
  let fresh = 0; const R = ()=>(Math.random()-.5);
  g.nodes.forEach(n=>{
    if(ws3d.pos.has(n.id)) return;
    fresh++;
    const p = ws3d.pos.get(parentOf.get(n.id));
    if(p) ws3d.pos.set(n.id, {x:p.x+R()*80, y:p.y+R()*80, z:p.z+R()*80, vx:0, vy:0, vz:0});
    else ws3d.pos.set(n.id, {x:R()*500, y:R()*500, z:R()*500, vx:0, vy:0, vz:0});
  });
  for(const id of [...ws3d.pos.keys()]) if(!ws3d.byId.has(id)) ws3d.pos.delete(id);
  if(ws3d.sel && !ws3d.byId.has(ws3d.sel)) ws3d.sel = "";
  if(fresh){
    const all = fresh===g.nodes.length;
    if(all && ws3d.opt.layout==="tree") ws3dTreeLayout();
    ws3d.refit = false;
    ws3d.alpha = all ? (ws3d.opt.layout==="tree" ? 0.3 : 1) : 0.5;
    if(g.nodes.length<=400){ while(ws3d.alpha>0.05) ws3dStep(); }       // kleine Graphen sofort fertig anordnen
    if(!ws3d.fitted && g.nodes.length){ ws3d.fitted = true; ws3dFit(); }
  }
}
function ws3dStep(){
  const ns = ws3d.g.nodes, n = ns.length, P = ns.map(x=>ws3d.pos.get(x.id)), a = ws3d.alpha;
  const REP = 15000;
  for(let i=0;i<n;i++){
    const p = P[i];
    for(let j=i+1;j<n;j++){
      const q = P[j]; let dx = p.x-q.x, dy = p.y-q.y, dz = p.z-q.z;
      const d2 = dx*dx+dy*dy+dz*dz+30; if(d2>1000000) continue;
      const f = REP/d2/Math.sqrt(d2)*a;
      dx*=f; dy*=f; dz*=f; p.vx+=dx; p.vy+=dy; p.vz+=dz; q.vx-=dx; q.vy-=dy; q.vz-=dz;
    }
    p.vx -= p.x*0.0025*a; p.vy -= p.y*0.0025*a; p.vz -= p.z*0.0025*a;
  }
  const idx = new Map(ns.map((x,i)=>[x.id,i]));
  ws3d.g.links.forEach(l=>{
    const p = P[idx.get(l.a)], q = P[idx.get(l.b)]; if(!p || !q) return;
    const dx = q.x-p.x, dy = q.y-p.y, dz = q.z-p.z, d = Math.sqrt(dx*dx+dy*dy+dz*dz)+0.01;
    const L = l.kind==="tag" ? 230 : 120, f = (d-L)/d*0.06*a;
    p.vx+=dx*f; p.vy+=dy*f; p.vz+=dz*f; q.vx-=dx*f; q.vy-=dy*f; q.vz-=dz*f;
  });
  P.forEach(p=>{
    p.vx*=0.82; p.vy*=0.82; p.vz*=0.82;
    const m = Math.max(Math.abs(p.vx),Math.abs(p.vy),Math.abs(p.vz)); if(m>30){ const k = 30/m; p.vx*=k; p.vy*=k; p.vz*=k; }
    p.x+=p.vx; p.y+=p.vy; p.z+=p.vz;
  });
  ws3d.alpha *= 0.985;
}
/* Zoom so wählen, dass alle Knoten ins Bild passen */
function ws3dFit(){
  const ns = ws3d.g.nodes; if(!ns.length) return;
  const cam = ws3d.cam;
  const pct = (a, q)=>{ const b = a.slice().sort((x,y)=>x-y); return b[Math.min(b.length-1, Math.floor(b.length*q))]; };
  const q = ns.length>=30 ? 0.97 : 1;      // einzelne Ausreißer dürfen am Rand liegen (herauszoomen zeigt sie)
  let cx=0, cy=0, cz=0; ns.forEach(n=>{ const p = ws3d.pos.get(n.id); cx+=p.x; cy+=p.y; cz+=p.z; }); cx/=ns.length; cy/=ns.length; cz/=ns.length;
  const R = Math.max(100, pct(ns.map(n=>{ const p = ws3d.pos.get(n.id); return Math.hypot(p.x-cx, p.y-cy, p.z-cz); }), q));
  // Kamera relativ nah: starke Perspektive (nahe Knoten groß, ferne klein). Brennweite so, dass fast alles ins Bild passt.
  const dist = Math.max(300, Math.min(3500, (R+60)*1.9));
  const W = ws3d.w||700, H = ws3d.h||600;
  const cy_ = Math.cos(cam.yaw), sy_ = Math.sin(cam.yaw), cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const ex = [], ey = [];
  ns.forEach(n=>{ const p = ws3d.pos.get(n.id); const x = p.x-cx, y = p.y-cy, z = p.z-cz;
    const x1 = x*cy_ + z*sy_, z1 = -x*sy_ + z*cy_, y2 = y*cp - z1*sp, z2 = Math.max(80, y*sp + z1*cp + dist);
    ex.push(Math.abs(x1)/z2); ey.push(Math.abs(y2)/z2); });
  const mx = Math.max(0.01, pct(ex, q)), my = Math.max(0.01, pct(ey, q));
  const F = Math.min((W/2-60)/mx, (H/2-50)/my);
  ws3d.userCam = false;
  Object.assign(cam, {tx:cx, ty:cy, tz:cz, ox:0, oy:0, dist, F:Math.max(250, Math.min(2500, F))});
}
function ws3dVisible(){
  const g = ws3d.g, q = ws3d.opt.q.trim().toLowerCase();
  let vis = new Set(g.nodes.map(n=>n.id));
  if(ws3d.opt.focus && ws3d.sel && vis.has(ws3d.sel)){
    vis = new Set([ws3d.sel]); let fr = [ws3d.sel];
    for(let d=0; d<2; d++){ const nx = []; fr.forEach(id=>ws3d.nb.get(id).forEach(x=>{ if(!vis.has(x)){ vis.add(x); nx.push(x); } })); fr = nx; }
  }
  const hit = q ? new Set(g.nodes.filter(n=>n.label.toLowerCase().includes(q) || (n.eff||"").toLowerCase().includes(q)).map(n=>n.id)) : null;
  return {vis, hit};
}
function ws3dThumb(n){
  const o = {fileId:n.fileId, mime:n.mime, name:n.label};
  if(!n.fileId || !(wsIsImg(o) || wsIsPdf(o))) return null;
  const d = wsThumbDone.get(n.fileId);
  if(d) return d==="err" ? null : d.c;
  wsThumb(o).then(()=>ws3dKick());

  cv.onpointermove = e=>{
    const p = ws3d.ptr.get(e.pointerId);
    if(!p){ const r = rect(), id = ws3dHit(e.clientX-r.left, e.clientY-r.top); if(id!==ws3d.hover){ ws3d.hover = id; cv.style.cursor = id?"pointer":"grab"; ws3dKick(); } return; }
    const dx = e.clientX-p.x, dy = e.clientY-p.y;
    if(Math.abs(e.clientX-p.sx)+Math.abs(e.clientY-p.sy)>5) ws3d.moved = true;
    if(ws3d.ptr.size===2){
      const o = [...ws3d.ptr.entries()].find(([id])=>id!==e.pointerId)[1];
      const d0 = Math.hypot(p.x-o.x, p.y-o.y), d1 = Math.hypot(e.clientX-o.x, e.clientY-o.y);
      if(d0>10 && d1>10) ws3d.cam.dist = Math.max(250, Math.min(4000, ws3d.cam.dist*d0/d1));
      ws3d.cam.ox += dx/2; ws3d.cam.oy += dy/2;
    }else if(p.pan){ ws3d.cam.ox += dx; ws3d.cam.oy += dy; }
    else{ ws3d.cam.yaw -= dx*0.006; ws3d.cam.pitch = Math.max(-1.5, Math.min(1.5, ws3d.cam.pitch + dy*0.006)); }
    p.x = e.clientX; p.y = e.clientY; ws3dKick();
  };
  const up = e=>{
    const p = ws3d.ptr.get(e.pointerId); ws3d.ptr.delete(e.pointerId);
    if(p && !ws3d.moved && ws3d.ptr.size===0 && e.type==="pointerup"){ const r = rect(), id = ws3dHit(e.clientX-r.left, e.clientY-r.top); ws3dSelect(id);
      const n = id && ws3d.byId.get(id);
      if(n && ws3d.opt.edit && !document.getElementById("modalBg")){ if(n.kind==="att" && n.type==="file") ws3dAct("view"); else if(n.kind==="node" || n.kind==="att") ws3dAct("edit"); else if(n.kind==="doc" || n.kind==="block") ws3dAct("goto"); } }
  };
  cv.onpointerup = up; cv.onpointercancel = up;
  cv.ondblclick = e=>{ const r = rect(), id = ws3dHit(e.clientX-r.left, e.clientY-r.top); if(!id) return; ws3dSelect(id);
    const n = ws3d.byId.get(id);
    if(n.kind==="tag") ws3dAct("center");
    else if(n.kind==="att" && n.type==="file") ws3dAct("view");
    else if(n.kind==="att" && n.type==="link" && n.url) ws3dAct("url");
    else ws3dAct("goto"); };
  cv.onwheel = e=>{ e.preventDefault(); ws3d.userCam = true; ws3d.cam.dist = Math.max(250, Math.min(4000, ws3d.cam.dist*Math.exp(e.deltaY*0.0012))); ws3dKick(); };
  cv.oncontextmenu = e=>e.preventDefault();
  cv.style.cursor = "grab"; cv.style.touchAction = "none";
  if(window.ResizeObserver){ if(ws3d.ro) ws3d.ro.disconnect(); ws3d.ro = new ResizeObserver(()=>ws3dResize()); ws3d.ro.observe(cv.parentElement); }
  ws3dKick();
}

/* ---- Nacharbeiten nach dem Rendern ---- */
function wsAutosizeEl(el){ el.style.height = "auto"; el.style.height = (el.scrollHeight+2)+"px"; }
function wsAfterRender(){
  document.querySelectorAll(".ws-ta,.ws-nta").forEach(wsAutosizeEl);
  if(view==="notes" && wsTab==="gantt") wsGanttDraw();
  if(view==="notes" && wsTab==="3d") ws3dMount(); else if(document.body.classList.contains("ws3d-fs")){ ws3d.full = false; document.body.classList.remove("ws3d-fs"); }
  wsHydrateFiles();
  if(wsFocusSel){
    const el = document.querySelector(wsFocusSel); wsFocusSel = null;
    if(el){ el.focus(); try{ const n = el.value.length; el.setSelectionRange(n, n); }catch(e){} }
  }
}
function wsRerender(docId){
  if(wsF.tag && view==="notes" && wsTab==="docs"){ render(); return; }
  const doc = wsGet(docId);
  const mounts = document.querySelectorAll('.ws-mount[data-doc="'+docId+'"]');
  if(!doc || !mounts.length){ render(); return; }
  let gone = false;
  mounts.forEach(m=>{
    if(m.dataset.mode==="focus"){ const h = wsFocusInner(doc, m.dataset.fid, m.dataset.fkind); if(h===null || !wsFocusHas(doc, m.dataset.fid)) gone = true; else m.innerHTML = h; }
    else m.innerHTML = m.dataset.mode==="today" ? wsTodayInner(doc) : wsEditorHtml(doc, "tab");
  });
  if(gone){ render(); return; }
  wsAfterRender();
}

/* ---- Eingaben ---- */
/* Tabelle eines Eingabefelds: Anhang-Tabelle oder Tabellenblock */
function wsTableOf(doc, el){
  const ae = el.closest(".ws-att");
  if(ae) return wsFindAny(doc, ae.dataset.aid);
  const be = el.closest(".ws-block"); return be ? wsBlock(doc, be.dataset.bid) : null;
}
main.addEventListener("input", e=>{
  const el = e.target, f = el.dataset && el.dataset.wsf; if(!f) return;
  const docEl = el.closest(".ws-doc"); if(!docEl) return;
  const doc = wsGet(docEl.dataset.doc); if(!doc) return;
  if(f==="title") doc.title = el.value;
  else if(f==="text"){ const b = wsBlock(doc, el.closest(".ws-block").dataset.bid); if(b) b.text = el.value; if(el.tagName==="TEXTAREA") wsAutosizeEl(el); }
  else if(f==="node"){
    if(/[\r\n]/.test(el.value)){ const p = el.selectionStart; el.value = el.value.replace(/\s*[\r\n]+\s*/g, " "); try{ el.setSelectionRange(p, p); }catch(_){} }
    const r = wsFindNode(doc, el.closest(".ws-node").dataset.nid); if(r) r.node.text = el.value; wsAutosizeEl(el);
  }
  else if(f==="atitle"){ const a = wsFindAny(doc, el.closest(".ws-att").dataset.aid); if(a) a.title = el.value; }
  else if(f==="aurl"){
    const a = wsFindAny(doc, el.closest(".ws-att").dataset.aid); if(a) a.url = el.value.trim();
    const go = el.closest(".ws-att").querySelector(".ws-lnkgo"), nu = wsNormUrl(el.value);
    if(go){ go.href = nu || "#"; go.style.display = nu ? "" : "none"; }
  }
  else if(f==="atext"){ const a = wsFindAny(doc, el.closest(".ws-att").dataset.aid); if(a) a.text = el.value; if(el.tagName==="TEXTAREA") wsAutosizeEl(el); }
  else if(f==="col"){ const b = wsTableOf(doc, el); if(b) b.cols[+el.dataset.ci] = el.value; }
  else if(f==="cell"){ const b = wsTableOf(doc, el); if(b && b.rows[+el.dataset.ri]) b.rows[+el.dataset.ri][+el.dataset.ci] = el.value; }
  wsTouch(doc);
});

    const a = doc ? wsFindAny(doc, el.closest(".ws-att").dataset.aid) : null;

main.addEventListener("keydown", e=>{
  const el = e.target, f = el.dataset && el.dataset.wsf; if(!f) return;
  const docEl = el.closest(".ws-doc"); if(!docEl) return;
  const doc = wsGet(docEl.dataset.doc); if(!doc) return;
  if(f==="node"){
    const nid = el.closest(".ws-node").dataset.nid;
    if(e.key==="Enter"){
      e.preventDefault();
      const n = wsAddSibling(doc, nid);
      if(n){ wsTouch(doc); wsFocusSel = `.ws-doc[data-doc="${doc.id}"] [data-nid="${n.id}"] > .ws-nrow .ws-nin`; wsRerender(doc.id); }
    }else if(e.key==="Tab"){
      e.preventDefault();
      if(e.shiftKey ? wsOutdent(doc, nid) : wsIndent(doc, nid)){
        wsTouch(doc); wsFocusSel = `.ws-doc[data-doc="${doc.id}"] [data-nid="${nid}"] > .ws-nrow .ws-nin`; wsRerender(doc.id);
      }
    }else if(e.key==="Backspace" && el.value===""){
      const r = wsFindNode(doc, nid);
      if(r && r.node.children.length===0 && !r.node.link){
        e.preventDefault();
        const all = [...docEl.querySelectorAll(".ws-nin")]; const i = all.indexOf(el);
        const prev = i>0 ? all[i-1].closest(".ws-node").dataset.nid : null;
        wsDeleteNode(doc, nid); wsTouch(doc);
        if(prev) wsFocusSel = `.ws-doc[data-doc="${doc.id}"] [data-nid="${prev}"] > .ws-nrow .ws-nin`;
        wsRerender(doc.id);
      }
    }else if((e.key==="ArrowUp" || e.key==="ArrowDown") && !e.shiftKey && !e.altKey && !e.ctrlKey && (e.key==="ArrowUp" ? el.selectionStart===0 : el.selectionStart===el.value.length)){
      const all = [...docEl.querySelectorAll(".ws-nin")]; const i = all.indexOf(el);
      const t = all[i + (e.key==="ArrowUp"?-1:1)];
      if(t){ e.preventDefault(); t.focus(); }
    }
  }else if(f==="cell" && e.key==="Enter"){
    e.preventDefault();
    const b = wsTableOf(doc, el); if(!b) return;
    const ri = +el.dataset.ri, ci = +el.dataset.ci;
    if(ri>=b.rows.length-1){ wsAddRow(b); wsTouch(doc); }
    wsFocusSel = `.ws-doc[data-doc="${doc.id}"] [data-${wsIsAtt(b)?"aid":"bid"}="${b.id}"] input[data-wsf="cell"][data-ri="${ri+1}"][data-ci="${ci}"]`;
    wsRerender(doc.id);
  }
});

/* ---- Klicks ---- */
main.addEventListener("click", e=>{
  const bk = e.target.closest("[data-wsback]");
  if(bk){ wsBack = null; if(ws3d.resumeFull){ ws3d.resumeFull = false; ws3d.full = true; } wsTab = "3d"; localStorage.setItem("wsTab", "3d"); render(); return; }
  const tab = e.target.closest("[data-wstab]");
  if(tab){ wsBack = null; wsTab = tab.dataset.wstab; localStorage.setItem("wsTab", wsTab); render(); return; }
  const a = e.target.closest("[data-wsact]"); if(!a) return;
  const act = a.dataset.wsact;
  const mount = a.closest(".ws-mount");
  const docEl = a.closest(".ws-doc");
  const docId = docEl ? docEl.dataset.doc : (mount ? mount.dataset.doc : null);
  const doc = docId ? wsGet(docId) : null;

  if(act==="today-toggle"){
    wsTodayExpanded = !wsTodayExpanded; localStorage.setItem("wsTodayExp", wsTodayExpanded?"1":"0");
    if(doc) wsRerender(doc.id); return;
  }
  if((act==="fold-all" || act==="unfold-all") && doc){
    wsSetAllFolds(doc, act==="fold-all"); wsTouch(doc); wsRerender(doc.id); return;
  }
  if(act==="item-menu" && doc){
    wsOpenItemMenu(doc.id, a.dataset.kind, a.dataset.id, a.closest(".ws-nrow")||a.closest(".ws-arow")||a.closest(".ws-block")); return;
  }
  if(act==="more" && doc){
    const id = a.dataset.mid; if(wsMore.has(id)) wsMore.delete(id); else wsMore.add(id);
    wsRerender(doc.id); return;
  }
  if(act==="task-focus" || act==="task-meta"){
    if(!wsLoaded){ toast("Arbeitsbereich noch nicht geladen"); return; }
    const hit = wsEnsureTaskNode(a.dataset.kind, a.dataset.ref);
    if(!hit){ toast("Eintrag nicht gefunden"); return; }
    if(act==="task-focus"){
      const on = wsFocusToggle(hit.doc, hit.node.id);
      if(on===null){ toast("Erledigte Einträge können keinen Fokus bekommen"); return; }
      render(); toast(on ? "Fokus: erscheint in Heute" : "Fokus aufgehoben"); return;
    }
    hit.node.meta = !hit.node.meta; wsTouch(hit.doc); render();
    toast(hit.node.meta ? "Meta-Projekt: erscheint in Heute unter Metaprojekten und im Gantt" : "Kein Meta-Projekt mehr"); return;
  }
  if(act==="focus" && doc){
    const on = wsFocusToggle(doc, a.dataset.fid);
    if(on===null){ toast("Erledigte Einträge können keinen Fokus bekommen"); return; }
    if(view==="today") render(); else wsRerender(doc.id);
    toast(on ? "Fokus: erscheint in Heute" : "Fokus aufgehoben"); return;
  }
  if(act==="focus-open" && doc){
    const h = wsFindNode(doc, a.dataset.fid);
    wsOpenDocId = doc.id; try{ localStorage.setItem("wsOpenDoc", doc.id); localStorage.setItem("wsTab","docs"); }catch(e){}
    wsTab = "docs"; view = "notes"; render(); return;
  }
  if(act==="unhide-all" && doc){
    const hs = wsAllNodes(doc).filter(n=>n.hid);
    if(!hs.length){ toast("In diesem Dokument ist nichts ausgeblendet"); return; }
    hs.forEach(n=>{ n.hid = false; }); wsTouch(doc); wsRerender(doc.id);
    toast(hs.length+(hs.length===1?" Punkt":" Punkte")+" wieder eingeblendet"); return;
  }
  if(act==="plus" && doc){ wsOpenPlusMenu(doc.id, a.dataset.kind, a.dataset.id); return; }
  if(act==="lean-toggle"){ wsLean = !wsLean; try{ localStorage.setItem("wsLean", wsLean?"1":"0"); }catch(err){} render(); return; }
  if(act==="f-open"){ wsFOpen = !wsFOpen; try{ localStorage.setItem("wsFOpen", wsFOpen?"1":"0"); }catch(err){} render(); return; }
  if(act==="tag-bar-toggle"){ wsTagOpen = !wsTagOpen; try{ localStorage.setItem("wsTagOpen", wsTagOpen?"1":"0"); }catch(err){} if(!wsTagOpen && wsF.tag){ wsF = wsFNorm({...wsF, tag:""}); wsFSave(); } render(); return; }
  if(act==="tag-sel"){ wsF = wsFNorm({...wsF, tag:(wsF.tag===a.dataset.t)?"":a.dataset.t}); wsFSave(); render(); return; }
  if(act==="f-reset"){ wsF = wsFNorm(null); wsFSave(); render(); return; }
  if(act==="f-preset"){
    const p = a.dataset.p, keep = {showHid:wsF.showHid, tag:wsF.tag, manual:wsF.manual};
    if(p==="all") wsF = wsFNorm(keep);
    else if(p==="over") wsF = wsFNorm({...keep, lvl:1, hideDone:true, noAtt:true});
    else if(p==="today") wsF = wsFNorm({...keep, due:"today", hideDone:true});
    else if(p==="week") wsF = wsFNorm({...keep, due:"week", hideDone:true});
    else if(p==="meta") wsF = wsFNorm({...keep, meta:true, hideDone:true});
    wsFSave(); render(); return;
  }
  if(act==="f-set"){
    const k = a.dataset.k, v = a.dataset.v, nf = {...wsF};
    if(k==="lvl") nf.lvl = +v;
    else if(k==="due") nf.due = (nf.due===v)?"":v;
    else if(k==="manual") nf.manual = v==="1";
    else if(k==="notes" || k==="noTab"){ nf[k] = !nf[k]; wsOpenMap.clear(); }
    else nf[k] = !nf[k];
    wsF = wsFNorm(nf); wsFSave(); render(); return;
  }
  if(act==="retry-load"){ setSync("busy"); loadWorkspace().then(()=>{ setSync("on"); render(); }); return; }
  if(act==="open-trash"){ wsOpenTrash(); return; }
  if(act==="new-doc"){
    if(!wsLoaded){ toast("Arbeitsbereich nicht geladen"); return; }
    const d = wsNewDoc("Neues Dokument"); wsDocs.push(d); wsOpenDocId = d.id; localStorage.setItem("wsOpenDoc", d.id);
    wsTouch(d); wsFocusSel = `.ws-doc[data-doc="${d.id}"] .ws-doctitle`; render();
    const t = document.querySelector(".ws-doctitle"); if(t) t.select();
    return;
  }
  if(act==="dl-edit" || act==="meta-edit"){ wsEditNode(a.dataset.nid); return; }
  if(act==="meta-open"){
    const hit = wsMetaNodes().find(h=>h.node.id===a.dataset.nid); if(!hit) return;
    wsOpenDocId = hit.doc.id; localStorage.setItem("wsOpenDoc", wsOpenDocId);
    wsTab = "docs"; localStorage.setItem("wsTab", wsTab); view = "notes"; render(); return;
  }
  if(act==="meta-done"){
    const hit = wsMetaNodes().find(h=>h.node.id===a.dataset.nid); if(!hit) return;
    hit.node.done = true; wsFocusDrop(hit.doc, hit.node.id); wsTouch(hit.doc); render();
    if(hit.node.link) wsLinkRun(()=>wsPushDone(hit.doc, hit.node));
    return;
  }
  if(act==="dl-open"){
    if(!wsGet(a.dataset.did)) return;
    wsOpenDocId = a.dataset.did; localStorage.setItem("wsOpenDoc", wsOpenDocId);
    wsTab = "docs"; localStorage.setItem("wsTab", wsTab); view = "notes"; render(); return;
  }
  if(act==="dl-done"){
    const d = wsGet(a.dataset.did), r0 = d ? wsFindNode(d, a.dataset.nid) : null;
    const hb = (d && !r0) ? d.blocks.find(x=>x.id===a.dataset.nid && x.type==="heading") : null;
    if(hb){ hb.done = true; wsFocusDrop(d, hb.id); wsTouch(d); render(); return; }
    const r = r0; if(!r) return;
    r.node.done = true; wsTouch(d); render();
    if(r.node.link){ const node = r.node; wsLinkRun(()=>wsPushDone(d, node)); }
    return;
  }
  if(act==="gs-go"){
    const res = wsSearchAll(wsGQ, 60), r = res[+a.dataset.i]; if(!r) return;
    if(r.kind==="doc"){ wsOpenDocId = r.docId; try{ localStorage.setItem("wsOpenDoc", r.docId); }catch(err){} render(); return; }
    wsGoToItem(r.docId, r.kind, r.ref, false); return;
  }
  if(act==="open-doc"){ wsOpenDocId = a.dataset.id; localStorage.setItem("wsOpenDoc", wsOpenDocId); render(); return; }
  if(!doc) return;

  if(act==="tag-doc"){ wsOpenTagMenu(doc.id, "doc", doc.id); return; }
  if(act==="pin"){
    const was = doc.pinned;
    wsDocs.forEach(d=>{ if(d.pinned){ d.pinned = false; wsTouch(d); } });
    doc.pinned = !was; wsTouch(doc); render(); return;
  }
  if(act==="del-doc"){ wsDeleteDocFlow(doc); return; }
  if(act==="add-block"){
    const b = wsNewBlock(a.dataset.type); if(!b) return;
    if(b.type==="heading" && (a.dataset.lvl==="2" || a.dataset.lvl==="3")) b.lvl = +a.dataset.lvl;
    wsOpenMap.set(b.id, true);
    doc.blocks.push(b); wsTouch(doc);
    wsFocusSel = `.ws-doc[data-doc="${doc.id}"] [data-bid="${b.id}"] .ws-in`; wsRerender(doc.id); return;
  }
  const blockEl = a.closest(".ws-block");
  const block = blockEl ? wsBlock(doc, blockEl.dataset.bid) : null;
  if(act==="fold" && block && !a.closest(".ws-att") && !a.closest(".ws-node")){
    wsOpenMap.set(block.id, !wsFoldOpen(block.id, block.type)); wsRerender(doc.id); return;
  }
  if(act==="head-set" && block && block.type==="heading"){
    const k = +a.dataset.k;
    if(k===wsHLvl(block)){ toast("Das ist schon Ebene "+k); return; }
    const ok = k===3 ? !!wsDemoteHeading(doc, block.id, null) : wsSetHeadLvl(doc, block.id, k);
    if(!ok){ alert("Das geht an dieser Stelle nicht."); return; }
    wsTouch(doc); wsRerender(doc.id); return;
  }
  if(act==="head-lvl" && block && block.type==="heading"){
    wsOpenLevelMenu(doc.id, "head", block.id); return;
  }
  if(act==="f-done"){ wsF = wsFNorm({...wsF, hideDone:a.dataset.v==="1"}); wsFSave(); render(); toast(wsF.hideDone ? "Erledigte sind ausgeblendet" : "Erledigte werden angezeigt"); return; }
  if(act==="head-menu" && block && block.type==="heading"){ wsOpenHeadMenu(doc.id, block.id); return; }
  if(act==="move-head" && block && block.type==="heading"){ wsOpenMoveHead(doc.id, block.id); return; }
  if(act==="hdone" && block && block.type==="heading"){ wsToggleHeadDone(doc, block); return; }
  if(act==="hfold" && block && block.type==="heading"){
    const nc = !wsHeadClosed(block);
    if(wsFiltered()) wsColl.set(block.id, nc); else { block.collapsed = nc; wsTouch(doc); }
    wsRerender(doc.id); return;
  }
  if(act==="tag-block" && block){ wsOpenTagMenu(doc.id, "block", block.id); return; }
  if(act==="del-block" && block){
    wsDeleteBlockFlow(doc, block); return;
  }
  if(act==="import-root" && block){ wsOpenImport({docId:doc.id, blockId:block.id}); return; }
  if(act==="add-root-node" && block){
    const n = wsNewNode(""); block.items.push(n); wsTouch(doc);
    wsFocusSel = `.ws-doc[data-doc="${doc.id}"] [data-nid="${n.id}"] > .ws-nrow .ws-nin`; wsRerender(doc.id); return;
  }
  const attEl = a.closest(".ws-att");
  if(attEl){
    const att = wsFindAny(doc, attEl.dataset.aid); if(!att) return;
    if(act==="fold"){ wsOpenMap.set(att.id, !wsFoldOpen(att.id, att.type)); wsRerender(doc.id); return; }
    if(act==="done"){
      att.done = !att.done; if(att.done) wsFocusDrop(doc, att.id); wsTouch(doc); wsRerender(doc.id);
      if(att.link) wsLinkRun(()=>wsPushDone(doc, att));
      return;
    }
    if(act==="link-menu"){ wsOpenLinkMenu(doc.id, att.id); return; }
    if(act==="tag-att"){ wsOpenTagMenu(doc.id, "att", att.id); return; }
    if(act==="file-view"){ wsOpenFileView(att); return; }
    if(act==="del-att"){ wsDeleteAttFlow(doc, att); return; }
    if(act==="move-att"){ wsOpenMove(doc.id, att.id); return; }
    if(att.type==="table" && wsTableAct(doc, att, `[data-aid="${att.id}"]`, act, a)) return;
    return;
  }
  const nodeEl = a.closest(".ws-node");
  if(nodeEl){
    const nid = nodeEl.dataset.nid, r = wsFindNode(doc, nid); if(!r) return;
    if(act==="toggle"){
      const all = !!e.shiftKey;
      const setSub = (node, closed)=>{ node.children.forEach(k=>{ if(k.children.length){ k.collapsed = closed; wsColl.set(k.id, closed); } if(k.att.length) k.aopen = !closed; setSub(k, closed); }); };
      if(r.node.children.length){
        let depth = 0, p = nodeEl.parentElement; while(p){ if(p.classList && p.classList.contains("ws-node")) depth++; p = p.parentElement; }
        const nc = !wsEffCollapsed(r.node, depth);
        if(wsFiltered()) wsColl.set(nid, nc); else { r.node.collapsed = nc; }
        if(all){ setSub(r.node, nc); if(r.node.att.length) r.node.aopen = !nc; }
        if(!wsFiltered() || all) wsTouch(doc);
        wsRerender(doc.id);
      }else if(r.node.att.length){
        r.node.aopen = !r.node.aopen; wsTouch(doc); wsRerender(doc.id);
      }
      return;
    }
    if(act==="node-lvl"){ wsOpenLevelMenu(doc.id, "node", nid); return; }
    if(act==="node-set"){
      const k = +a.dataset.k, c = +nodeEl.dataset.lvl, base = +nodeEl.dataset.base || 3;
      if(k===c){ toast("Dieser Punkt ist schon Ebene "+k); return; }
      if(k<=2){
        let rel = null;
        if(r.node.link){
          if(!confirm("Dieser Punkt ist mit einem ToDo oder Ziel verknüpft. Zum Umwandeln in eine Überschrift wird die Verknüpfung gelöst (das ToDo bzw. Ziel bleibt bestehen). Fortfahren?")) return;
          rel = Object.assign({}, r.node.link); r.node.link = null;
        }
        const rr = wsPromoteNode(doc, nid, k);
        if(rr.err){ if(rel) r.node.link = rel; alert(rr.err); return; }
        if(rel) wsLinkRun(()=>wsReleaseLinks([rel], false));
      }else{
        const need = Math.max(0, 3-base); let d = c-base, guard = 0;
        while(d>need && guard++<10){ if(!wsOutdent(doc, nid)) break; d--; }
        while(d<need && guard++<10){ if(!wsIndent(doc, nid)) break; d++; }
        if(d!==need){ alert("Das geht hier nicht: Für Ebene 3 fehlt ein Punkt davor, unter den dieser Punkt rücken kann."); if(guard>0) { wsTouch(doc); wsRerender(doc.id); } return; }
      }
      wsTouch(doc); wsRerender(doc.id); return;
    }
    if(act==="tag-node"){ wsOpenTagMenu(doc.id, "node", nid); return; }
    if(act==="hide-node"){
      r.node.hid = !r.node.hid; wsTouch(doc); wsRerender(doc.id);
      if(r.node.hid && !wsF.showHid) toast("Ausgeblendet. Unter Ansicht kannst du es wieder einblenden.");
      return;
    }
    if(act==="done"){
      r.node.done = !r.node.done; if(r.node.done) wsFocusDrop(doc, r.node.id); wsTouch(doc); wsRerender(doc.id);
      if(r.node.link){ const node = r.node; wsLinkRun(()=>wsPushDone(doc, node)); }
      return;
    }
    if(act==="link-menu"){ wsOpenLinkMenu(doc.id, nid); return; }
    if(act==="add-file"){ wsAddFiles(doc, r.node); return; }
    if(act==="att-toggle"){
      const hidden = r.node.children.length>0 && r.node.collapsed;                    // eingeklappter Punkt: Anhänge sind nicht zu sehen
      r.node.aopen = hidden ? true : !r.node.aopen;
      if(hidden) r.node.collapsed = false;                                           // Anhänge zeigen heißt: Punkt aufklappen
      if(hidden || r.node.aopen) wsColl.set(nid, false);
      wsTouch(doc); wsRerender(doc.id); return;
    }
    if(act==="add-att"){
      const at = wsNewAtt(a.dataset.type); if(!at) return;
      wsOpenMap.set(at.id, true);
      r.node.att.push(at); r.node.aopen = true; wsTouch(doc);
      wsFocusSel = `.ws-doc[data-doc="${doc.id}"] [data-aid="${at.id}"] .ws-abody .ws-in`; wsRerender(doc.id); return;
    }
    if(act==="add-child"){
      const n = wsAddChild(doc, nid); wsTouch(doc); wsColl.set(nid, false);
      wsFocusSel = `.ws-doc[data-doc="${doc.id}"] [data-nid="${n.id}"] > .ws-nrow .ws-nin`; wsRerender(doc.id); return;
    }
    if(act==="del-node"){ wsDeleteNodeFlow(doc, nid); return; }
    if(act==="move-node"){ wsOpenMove(doc.id, nid); return; }
  }
  if(block && block.type==="table"){ if(wsTableAct(doc, block, `[data-bid="${block.id}"]`, act, a)) return; }
});
function wsTableAct(doc, tbl, scope, act, a){
  if(act==="add-row"){ const i = wsAddRow(tbl); wsTouch(doc); wsFocusSel = `.ws-doc[data-doc="${doc.id}"] ${scope} input[data-wsf="cell"][data-ri="${i}"][data-ci="0"]`; wsRerender(doc.id); return true; }
  if(act==="del-row"){
    const ri = +a.dataset.ri;
    if(tbl.rows[ri] && tbl.rows[ri].some(c=>c) && !confirm("Zeile mit Inhalt löschen?")) return true;
    tbl.rows.splice(ri, 1); wsTouch(doc); wsRerender(doc.id); return true;
  }
  if(act==="add-col"){ wsAddCol(tbl); wsTouch(doc); wsRerender(doc.id); return true; }
  if(act==="del-col"){
    const ci = +a.dataset.ci;
    if(tbl.rows.some(r=>r[ci]) && !confirm("Spalte mit Inhalt löschen?")) return true;
    if(wsDelCol(tbl, ci)){ wsTouch(doc); wsRerender(doc.id); } return true;
  }
  return false;
}

/* ---- Menü "Ebene ändern" (Ebene 1 und 2 = Überschriften, Ebene 3 und tiefer = Punkte) ---- */
/* Plus-Menü: überall dort, wo etwas hinzugefügt werden kann (Punkt, Überschrift, Text, Tabelle, Block, Dokumentende) */
function wsOpenPlusMenu(docId, kind, id){
  if(document.getElementById("modalBg")) return;
  const doc = wsGet(docId); if(!doc) return;
  let title = "Hinzufügen", items = [];
  const BL = [["t-text","Text / Notiz"],["t-table","Tabelle"],["t-h1","Überschrift Ebene 1"],["t-h2","Überschrift Ebene 2"]];
  if(kind==="node"){
    const r = wsFindNode(doc, id); if(!r) return;
    title = "Zu „"+(r.node.text||"(ohne Text)").slice(0,30)+"“ hinzufügen";
    items = [["n-sib","Punkt darunter (gleiche Ebene)"],["n-kid","Unterpunkt (eine Ebene tiefer)"],["n-h1","Überschrift Ebene 1 darunter"],["n-h2","Überschrift Ebene 2 darunter"],
      ["a-text","Anhang: Text / Notiz"],["a-table","Anhang: Tabelle"],["a-link","Anhang: Link"],["a-file","Anhang: Bild / PDF"],["i-kid","ToDo / Ziel aus der App als Unterpunkt einfügen"]];
  }else if(kind==="block"){
    const b = wsBlock(doc, id); if(!b) return;
    title = b.type==="heading" ? "Unter „"+(b.text||"Überschrift").slice(0,30)+"“ hinzufügen" : "Danach hinzufügen";
    items = [["b-pt","Punkt"]].concat(BL, [["i-doc","ToDo / Ziel aus der App einfügen"]]);
  }else{
    items = [["e-pt","Punkt"]].concat(BL, [["i-doc","ToDo / Ziel aus der App einfügen"]]);
  }
  document.body.insertAdjacentHTML("beforeend", `<div class="modal-bg" id="modalBg"><div class="modal"><h2>${esc(title)}</h2>
    <div class="ws-implist">${items.map(i=>`<button class="ws-addbtn" style="display:block;width:100%;text-align:left;margin-bottom:6px" data-pl="${i[0]}">${esc(i[1])}</button>`).join("")}</div>
    <div class="modal-actions"><button class="btn-primary" id="wsl_close">Abbrechen</button></div></div></div>`);
  const close = ()=>{ const m = document.getElementById("modalBg"); if(m) m.remove(); };
  document.getElementById("wsl_close").onclick = close;
  document.getElementById("modalBg").onclick = e=>{
    if(e.target.id==="modalBg"){ close(); return; }
    const bt = e.target.closest("[data-pl]"); if(!bt) return;
    const a = bt.dataset.pl; close();
    const focusNode = n=>{ wsFocusSel = `.ws-doc[data-doc="${doc.id}"] [data-nid="${n.id}"] > .ws-nrow .ws-nin`; };
    // Block-Position: Überschrift = hinter ihrem Abschnitt, sonst direkt dahinter; Ende = ganz hinten
    let idx = doc.blocks.length;
    if(kind==="block"){
      const i = doc.blocks.findIndex(b=>b.id===id); idx = i+1;
      if(a==="t-h1" || a==="t-h2"){ if(doc.blocks[i].type==="heading") idx = wsSecEnd(doc.blocks, i); }
    }
    const addPoint = pos=>{
      const nb = doc.blocks[pos];
      if(kind==="end" && pos>0 && doc.blocks[pos-1].type==="outline"){ const n = wsNewNode(""); doc.blocks[pos-1].items.push(n); return n; }
      if(kind==="block" && nb && nb.type==="outline"){ const n = wsNewNode(""); nb.items.unshift(n); return n; }
      const ob = wsNewBlock("outline"); doc.blocks.splice(pos, 0, ob); return ob.items[0];
    };
    if(a==="i-kid"){ wsOpenImport({docId:doc.id, parent:id}); return; }
    if(a==="i-doc"){ wsOpenImport({docId:doc.id}); return; }
    if(a==="n-sib" || a==="n-kid" || a==="n-h1" || a==="n-h2"){
      const n = a==="n-kid" ? wsAddChild(doc, id) : wsAddSibling(doc, id); if(!n) return;
      if(a==="n-kid") wsColl.set(id, false);
      if(a==="n-h1" || a==="n-h2"){
        const rr = wsPromoteNode(doc, n.id, a==="n-h1"?1:2);
        if(rr.err){ wsDeleteNode(doc, n.id); alert(rr.err); wsRerender(doc.id); return; }
      }else focusNode(n);
    }else if(a.startsWith("a-")){
      const r = wsFindNode(doc, id); if(!r) return;
      if(a==="a-file"){ wsAddFiles(doc, r.node); return; }
      const at = wsNewAtt(a.slice(2)); if(!at) return;
      wsOpenMap.set(at.id, true); r.node.att.push(at); r.node.aopen = true; wsColl.set(id, false);
      wsFocusSel = `.ws-doc[data-doc="${doc.id}"] [data-aid="${at.id}"] .ws-abody .ws-in`;
    }else if(a==="b-pt" || a==="e-pt"){
      focusNode(addPoint(idx));
    }else if(a.startsWith("t-")){
      const ty = a==="t-text"?"text":a==="t-table"?"table":"heading";
      const b = wsNewBlock(ty); if(a==="t-h2") b.lvl = 2;
      wsOpenMap.set(b.id, true); doc.blocks.splice(idx, 0, b);
      wsFocusSel = `.ws-doc[data-doc="${doc.id}"] [data-bid="${b.id}"] .ws-in`;
    }
    wsTouch(doc); wsRerender(doc.id);
  };
}
function wsOpenLevelMenu(docId, kind, id){
  if(document.getElementById("modalBg")) return;
  const doc = wsGet(docId); if(!doc) return;
  let items = [], title = "";
  if(kind==="head"){
    const b = wsBlock(doc, id); if(!b) return;
    const L = wsHLvl(b); title = "Ebene ändern: "+(b.text||"(ohne Text)").slice(0,40);
    items = [["l1","Ebene 1 (große Überschrift)"+(L===1?" ✓":"")],["l2","Ebene 2 (Zwischenüberschrift)"+(L===2?" ✓":"")],["pt","Zum Punkt machen (samt allem darunter)"]];
  }else{
    const r = wsFindNode(doc, id); if(!r) return;
    let d = 0, p = r.parent; while(p){ d++; const q = wsFindNode(doc, p.id); p = q && q.parent; }
    title = "Ebene ändern: "+(r.node.text||"(ohne Text)").slice(0,40);
    items = [["h1","Zu Ebene 1 machen (große Überschrift)"],["h2","Zu Ebene 2 machen (Zwischenüberschrift)"]];
    if(r.index>0) items.push(["in","Eine Ebene tiefer (Unterpunkt des Punkts darüber)"]);
    if(r.parent) items.push(["out","Eine Ebene höher"]);
  }
  document.body.insertAdjacentHTML("beforeend", `<div class="modal-bg" id="modalBg"><div class="modal"><h2>${esc(title)}</h2>
    <div class="ws-implist">${items.map(i=>`<button class="ws-addbtn" style="display:block;width:100%;text-align:left;margin-bottom:6px" data-lv="${i[0]}">${esc(i[1])}</button>`).join("")}</div>
    <div class="modal-actions"><button class="btn-primary" id="wsl_close">Abbrechen</button></div></div></div>`);
  const close = ()=>{ const m = document.getElementById("modalBg"); if(m) m.remove(); };
  document.getElementById("wsl_close").onclick = close;
  document.getElementById("modalBg").onclick = e=>{
    if(e.target.id==="modalBg"){ close(); return; }
    const b = e.target.closest("[data-lv]"); if(!b) return;
    const a = b.dataset.lv; let ok = true, msg = "";
    if(a==="l1" || a==="l2") ok = wsSetHeadLvl(doc, id, a==="l1"?1:2);
    else if(a==="pt") ok = !!wsDemoteHeading(doc, id, null);
    else if(a==="h1" || a==="h2"){ const r = wsPromoteNode(doc, id, a==="h1"?1:2); ok = !r.err; msg = r.err||""; }
    else if(a==="in") ok = wsIndent(doc, id);
    else if(a==="out") ok = wsOutdent(doc, id);
    close();
    if(!ok){ toast(msg||"Das geht an dieser Stelle nicht"); return; }
    wsTouch(doc); wsRerender(doc.id);
  };
}

/* ---- Ziehen und Ablegen mit der Maus ---- */
function wsClearDropMarks(){
  document.querySelectorAll(".ws-drop-before,.ws-drop-after,.ws-drop-into").forEach(el=>el.classList.remove("ws-drop-before","ws-drop-after","ws-drop-into"));
}
function wsDragEnd(){
  wsClearDropMarks();
  document.querySelectorAll(".ws-dragging").forEach(el=>el.classList.remove("ws-dragging"));
  wsDrag = null; wsDrop = null;
}
function wsDropTarget(e){
  if(!wsDrag || !e.target.closest) return null;
  const docEl = e.target.closest(".ws-doc");
  if(!docEl || docEl.dataset.doc!==wsDrag.docId) return null;
  if(wsDrag.kind==="block"){
    const doc = wsGet(wsDrag.docId), own = new Set();
    if(wsDrag.head && doc){ const i = doc.blocks.findIndex(b=>b.id===wsDrag.bid); if(i>=0) doc.blocks.slice(i, wsSecEnd(doc.blocks, i)).forEach(b=>own.add(b.id)); }
    if(wsDrag.head){                                                         // Überschrift auf einen Punkt: wird zum Punkt
      const row = e.target.closest(".ws-nrow");
      if(row && row.parentElement && !own.has((row.closest(".ws-block")||{dataset:{}}).dataset.bid)){
        const r = row.getBoundingClientRect(), y = (e.clientY - r.top) / (r.height||1);
        return {el:row, kind:"node", pos: y<0.3 ? "before" : (y>0.7 ? "after" : "into"), nid:row.parentElement.dataset.nid};
      }
    }
    const el = e.target.closest(".ws-block"); if(!el || el.dataset.bid===wsDrag.bid || own.has(el.dataset.bid)) return null;
    const r = el.getBoundingClientRect(), y = (e.clientY - r.top) / (r.height||1);
    if(wsDrag.head && el.dataset.kind==="heading") return {el, kind:"block", pos: y<0.3 ? "before" : (y>0.7 ? "after" : "into"), bid:el.dataset.bid};
    return {el, kind:"block", pos:(y<0.5) ? "before" : "after", bid:el.dataset.bid};
  }
  if(wsDrag.kind==="node"){
    const row = e.target.closest(".ws-nrow");
    if(row){
      const li = row.parentElement; if(!li || li.dataset.nid===wsDrag.nid) return null;
      if(wsDrag.el.contains(li)) return null;                                  // nie in den eigenen Teilbaum
      const r = row.getBoundingClientRect(), y = (e.clientY - r.top) / (r.height||1);
      return {el:row, kind:"node", pos: y<0.3 ? "before" : (y>0.7 ? "after" : "into"), nid:li.dataset.nid};
    }
    const el = e.target.closest(".ws-block"); if(!el) return null;
    const r = el.getBoundingClientRect(), y = (e.clientY - r.top) / (r.height||1);
    if(el.dataset.kind==="heading") return {el, kind:"block", pos: y<0.3 ? "before" : "into", bid:el.dataset.bid};
    return {el, kind:"block", pos:(y<0.5) ? "before" : "after", bid:el.dataset.bid};
  }
  if(wsDrag.kind==="row"){
    const tr = e.target.closest("tbody tr"); if(!tr || tr===wsDrag.el) return null;
    if(tr.closest(".ws-block")!==wsDrag.el.closest(".ws-block")) return null;
    const r = tr.getBoundingClientRect();
    return {el:tr, pos:(e.clientY < r.top + r.height/2) ? "before" : "after", ri:+tr.dataset.ri};
  }
  return null;
}
main.addEventListener("dragstart", e=>{
  const h = e.target.closest && e.target.closest("[data-wsdrag]"); if(!h) return;
  const docEl = h.closest(".ws-doc"); if(!docEl) return;
  const kind = h.dataset.wsdrag;
  const src = kind==="block" ? h.closest(".ws-block") : kind==="node" ? h.closest(".ws-node") : h.closest("tr");
  if(!src) return;
  wsDrag = {kind, docId:docEl.dataset.doc, el:src,
    bid: (h.closest(".ws-block")||{dataset:{}}).dataset.bid, head: kind==="block" && src.dataset.kind==="heading", nid: kind==="node" ? src.dataset.nid : null, ri: kind==="row" ? +src.dataset.ri : null};
  e.dataTransfer.effectAllowed = "move";
  try{
    e.dataTransfer.setData("text/plain", "ws");
    e.dataTransfer.setDragImage(kind==="node" ? src.querySelector(".ws-nrow") : src, 12, 12);
  }catch(_){}
  setTimeout(()=>{ if(wsDrag) src.classList.add("ws-dragging"); }, 0);
});
main.addEventListener("dragover", e=>{
  if(!wsDrag) return;
  const t = wsDropTarget(e);
  if(!t){ wsClearDropMarks(); wsDrop = null; return; }
  e.preventDefault(); e.dataTransfer.dropEffect = "move";
  wsClearDropMarks(); t.el.classList.add("ws-drop-"+t.pos); wsDrop = t;
});
main.addEventListener("drop", e=>{
  if(!wsDrag) return;
  e.preventDefault();
  const t = wsDropTarget(e) || wsDrop, d = wsDrag;
  const doc = wsGet(d.docId); let ok = false;
  if(doc && t){
    if(d.kind==="block"){
      if(t.kind==="node") ok = !!wsDemoteHeading(doc, d.bid, {nid:t.nid, pos:t.pos});
      else if(d.head) ok = wsDropSection(doc, d.bid, t);
      else ok = wsMoveBlock(doc, d.bid, t.bid, t.pos);
    }
    else if(d.kind==="node"){
      if(t.kind==="block") ok = wsDropNodeOnBlock(doc, d.nid, t);
      else ok = wsMoveNode(doc, d.nid, t.nid, t.pos);
    }
    else { const b = wsBlock(doc, d.bid); if(b) ok = wsMoveRow(b, d.ri, t.ri, t.pos); }
  }
  wsDragEnd();
  if(ok){ wsTouch(doc); wsRerender(doc.id); }
});
main.addEventListener("dragend", wsDragEnd);
/* Überschrift (samt Abschnitt) auf einen Block ziehen: davor oder dahinter, auf eine andere Überschrift gezogen auch mit deren Ebene bzw. als Unterebene */
function wsDropSection(doc, bid, t){
  const tb = wsBlock(doc, t.bid), h = wsBlock(doc, bid); if(!tb || !h) return false;
  if(tb.type==="heading"){
    if(t.pos==="into"){
      if(wsHLvl(tb)===1){ wsSetHeadLvl(doc, bid, 2); return wsMoveIntoSectionEnd(doc, bid, t.bid); }
      return !!wsDemoteHeading(doc, bid, {headId:t.bid});                      // unter Ebene 2 gibt es nur noch Punkte
    }
    wsSetHeadLvl(doc, bid, wsHLvl(tb));                                         // Geschwister: gleiche Ebene
  }
  return wsMoveSection(doc, bid, t.bid, t.pos);
}
/* Nach einem "hinter die Überschrift"-Verschieben ans Ende des Abschnitts der Ziel-Überschrift rücken */
function wsMoveIntoSectionEnd(doc, bid, headId){
  const i = doc.blocks.findIndex(b=>b.id===bid); if(i<0) return false;
  const se = wsSecEnd(doc.blocks, i);
  const slice = doc.blocks.splice(i, se-i);
  const hi = doc.blocks.findIndex(b=>b.id===headId); if(hi<0){ doc.blocks.splice(i, 0, ...slice); return false; }
  const e2 = wsSecEnd(doc.blocks, hi);
  doc.blocks.splice(e2, 0, ...slice);
  return true;
}
/* Punkt auf einen Block ziehen: auf eine Überschrift = Punkt in deren Abschnitt, zwischen andere Blöcke = wird zur Überschrift */
function wsDropNodeOnBlock(doc, nid, t){
  const tb = wsBlock(doc, t.bid); if(!tb) return false;
  if(tb.type==="heading" && t.pos==="into") return wsNodeToSection(doc, nid, tb.id);
  let lvl = 1;
  if(tb.type==="heading") lvl = wsHLvl(tb);                                     // vor einer Überschrift: Geschwister
  else{
    let cur = null;                                                              // sonst: eine Stufe unter der Überschrift, in deren Abschnitt der Punkt landet
    for(const b of doc.blocks){ if(b.id===tb.id) break; if(b.type==="heading") cur = b; }
    lvl = cur ? 2 : 1;
  }
  const r = wsPromoteNode(doc, nid, lvl, {bid:t.bid, pos:t.pos});
  if(r.err){ toast(r.err); return false; }
  return true;
}

/* ---- Speichern beim Verlassen, Aktualisieren beim Zurückkehren ---- */
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState==="hidden"){ if(wsDirty.size || wsDeleted.size) wsFlush(); }
  else wsRefreshIfIdle();
});
window.addEventListener("pagehide", ()=>{ if(wsDirty.size || wsDeleted.size) wsFlush(); });

/* ============ GANTT (aus den Dokumenten des Arbeitsbereichs) ============ */
/* Zeilen: Punkte mit Zeitraum (Start + Laufzeit oder Deadline). Meta-Projekte bilden die oberste Ebene. */
let ganttSel = localStorage.getItem("ganttSel") || "meta";
function gGanttHtml(rows, boxW, today){
  const dayMs = 86400000, D = s=>new Date(s+"T00:00:00");
  const dated = rows.filter(r=>r.start);
  if(!dated.length) return `<div class="empty">Keine Punkte mit Zeitraum. Im Menü 📅 eines Punkts legst du Start, Laufzeit und Deadline fest.</div>`;
  const allT = [];
  dated.forEach(r=>{ allT.push(D(r.start).getTime(), D(r.end).getTime()); if(r.dl) allT.push(D(r.dl).getTime()); });
  const minD = Math.min(...allT), maxD = Math.max(...allT);
  const rangeDays = Math.round((maxD-minD)/dayMs) + 1;
  const titleW = boxW<480 ? 118 : 220;
  const px = Math.max(6, (Math.max(boxW, 320) - titleW - 10) / rangeDays);
  const chartW = Math.round(px*rangeDays);
  const fmt = (d)=>d.getDate()+"."+(d.getMonth()+1)+".";
  const weekStep = Math.max(1, Math.ceil(46/(px*7)));
  let ticks = "", wk = 0;
  for(let i=0;i<rangeDays;i++){
    const d = new Date(minD + i*dayMs);
    if(d.getDay()===1){
      const lab = (wk % weekStep===0) ? `<span>${fmt(d)}</span>` : "";
      ticks += `<div class="g-tick" style="left:${Math.round(i*px)}px">${lab}</div>`;
      wk++;
    }
  }
  let todayLine = "";
  if(today){
    const t = Math.round((new Date(today.getFullYear(), today.getMonth(), today.getDate()).getTime()-minD)/dayMs);
    if(t>=0 && t<rangeDays) todayLine = `<div class="g-today" style="left:${Math.round(t*px)}px"></div>`;
  }
  let h = `<div class="g-wrap"><div class="g-inner" style="width:${titleW+chartW+10}px">`;
  h += `<div class="g-row g-headrow"><div class="g-title" style="width:${titleW}px">Punkt</div><div class="g-chart" style="width:${chartW}px">${ticks}</div></div>`;
  rows.forEach(it=>{
    const pad = 6 + it.level*10;
    const tt = it.start ? `${it.title} · ${D(it.start).toLocaleDateString("de-DE")} bis ${D(it.end).toLocaleDateString("de-DE")}${it.dl?" · Deadline "+D(it.dl).toLocaleDateString("de-DE"):""}` : it.title;
    let bar = "";
    if(it.start){
      const off = (D(it.start).getTime()-minD)/dayMs, dur = (D(it.end).getTime()-D(it.start).getTime())/dayMs + 1;
      const bw = Math.max(8, Math.round(dur*px)), bl = Math.round(off*px);
      const cls = "g-bar"+(it.meta?" meta":"")+(it.agg?" agg":"")+(it.late?" late":"");
      bar = `<div class="${cls}" data-gnid="${esc(it.id)}" style="left:${bl}px;width:${bw}px" title="${esc(tt)} (Klick: bearbeiten)">${bw>70?esc(it.title.slice(0,Math.floor(bw/7))):""}</div>`;
    }
    let dl = "";
    if(it.dl){ const o = Math.round((D(it.dl).getTime()-minD)/dayMs); dl = `<div class="g-dl" style="left:${Math.round((o+1)*px)-2}px" title="Deadline ${esc(D(it.dl).toLocaleDateString("de-DE"))}"></div>`; }
    h += `<div class="g-row${it.meta?" g-metarow":""}"><div class="g-title" data-gnid="${esc(it.id)}" style="width:${titleW}px;padding-left:${pad}px;cursor:pointer" title="${esc(tt)} (Klick: bearbeiten)">${it.meta?"★ ":""}${esc(it.title)}${it.tag?` <span class="g-tg">🏷 ${esc(it.tag)}</span>`:""}</div>
      <div class="g-chart" style="width:${chartW}px">${todayLine}${bar}${dl}</div></div>`;
  });
  return h + `</div></div>`;
}

/* Jeder Punkt der Gliederung kann ein Datum tragen und als ToDo (Zeile im Tabellenblatt Tasks) oder Tages-Ziel (Google Task)
   angelegt werden. Titel, Datum und Erledigt-Status werden in beide Richtungen abgeglichen; Kalender ist optional (Standard: aus). */
const GOAL_MAX = 6;                                   // Tages-Ziele pro Tag
let wsLinkQueue = Promise.resolve();
function wsLinkRun(fn){
  const run = wsLinkQueue.then(fn);
  wsLinkQueue = run.catch(e=>{ console.error("❌ Verknüpfung:", e && e.message); toast("Verknüpfung: Abgleich fehlgeschlagen"); });
  return wsLinkQueue;
}
function wsGoalCount(date){
  if(date===todayKey()) return goalTasks.length;
  return allOpenGoals.filter(g=>g.due===date).length;
}
/* Oberfläche nach Hintergrundarbeit auffrischen, ohne Eingaben zu stören */
function wsRefreshDoc(doc){
  if(!document.querySelector('.ws-mount[data-doc="'+doc.id+'"]')) return;
  const ae = document.activeElement;
  if(ae && ae.classList && ae.classList.contains("ws-nin")){

function wsRenderIfSafe(){

  if(document.getElementById("modalBg")) return;

/* ---- Kalendertermin, den ein verknüpftes Tages-Ziel selbst besitzt ---- */
async function wsGoalEvent(L, title, date, want){
  const calId = L.calId || defaultCalId || "primary";
  try{
    if(want){
      const body = JSON.stringify({summary:title, start:{date}, end:{date:nextDayKey(date)}});
      if(L.evId) await api(`${calUrl(calId)}/${L.evId}`, {method:"PUT", body});
      else{ const ev = await api(calUrl(calId), {method:"POST", body}); L.evId = ev.id; L.calId = calId; }
      L.cal = true;
    }else{
      if(L.evId) await api(`${calUrl(calId)}/${L.evId}`, {method:"DELETE"});
      L.evId = ""; L.cal = false;
    }
  }catch(e){
    console.warn("Kalendertermin (Ziel) fehlgeschlagen:", e);
    toast("Kalender-Eintrag fehlgeschlagen");
    L.cal = !!L.evId;
  }
}

/* ---- Punkt -> Eintrag: Titel, Datum, Kalender übertragen ---- */
async function wsSyncItem(doc, node, wantCal){
  const L = node.link; if(!L) return;
  const title = wsTitleOf(node);
  if(L.kind==="todo"){
    const t = tasks.find(x=>x.id===L.ref);
    if(!t){ node.link = null; wsTouch(doc); wsRefreshDoc(doc); return; }
    if(title) t.title = title;
    t.startDate = wsLinkDay(node);
    const wd = parseDate(t.startDate); t.weekday = wd ? String(wd.getDay()) : "";
    t.syncCalendar = !!wantCal;
    await syncCalendar(t);
    L.cal = !!t.syncCalendar && !!t.calendarEventId;
    await saveTasks();
  }else{
    const listId = defaultGTaskListId || "@default";
    const body = {notes:GOAL_MARKER}; if(title) body.title = title; if(wsLinkDay(node)) body.due = wsLinkDay(node)+"T12:00:00.000Z";
    try{
      await api(`${GTASKS}/lists/${encodeURIComponent(listId)}/tasks/${encodeURIComponent(L.ref)}`, {method:"PATCH", body:JSON.stringify(body)});
    }catch(e){
      if(/404/.test(e.message||"")){ node.link = null; wsTouch(doc); wsRefreshDoc(doc); toast("Das verknüpfte Tages-Ziel existiert nicht mehr"); return; }
      throw e;
    }
    await wsGoalEvent(L, title || "Ziel", wsLinkDay(node), !!wantCal);
    await loadGTasks();
  }
  wsTouch(doc);
  wsRenderIfSafe();
}
/* ---- Punkt abgehakt -> Eintrag erledigt (und zurück) ---- */
async function wsPushDone(doc, node){
  const L = node.link; if(!L) return;
  const done = node.done;
  if(L.kind==="todo"){
    const t = tasks.find(x=>x.id===L.ref);
    if(!t){ node.link = null; wsTouch(doc); wsRefreshDoc(doc); return; }
    if(done){ if(!isEverDone(t.id)) logs.push({itemId:t.id, date:todayKey(), doneAt:new Date().toISOString()}); }
    else logs = logs.filter(l=>l.itemId!==t.id);
    await saveLogs();
  }else{
    const listId = defaultGTaskListId || "@default";
    try{
      await api(`${GTASKS}/lists/${encodeURIComponent(listId)}/tasks/${encodeURIComponent(L.ref)}`,
        {method:"PATCH", body:JSON.stringify(done ? {status:"completed"} : {status:"needsAction", completed:null})});
    }catch(e){
      if(/404/.test(e.message||"")){ node.link = null; wsTouch(doc); wsRefreshDoc(doc); toast("Das verknüpfte Tages-Ziel existiert nicht mehr"); return; }
      throw e;
    }
    if(done && !logs.some(l=>l.itemId===L.ref)){ logs.push({itemId:L.ref, date:todayKey(), doneAt:new Date().toISOString()}); await saveLogs(); }
    await loadGTasks();
  }
  wsRenderIfSafe();
}
/* ---- Neuen Eintrag aus einem Punkt anlegen ---- */
async function wsCreateItem(doc, node, kind, cal){
  if(node.link) return;
  const title = wsTitleOf(node);
  if(kind==="todo"){
    const wd = parseDate(wsLinkDay(node));
    const t = {id:uid(), type:"todo", title, scheduleType:"once", startDate:wsLinkDay(node), weekday:wd?String(wd.getDay()):"",
      syncCalendar:!!cal, calendarEventId:"", notes:"", createdAt:new Date().toISOString(), archived:false,
      calendarId:"", startTime:"", projectId:"", tag:""};
    tasks.push(t);
    if(t.syncCalendar) await syncCalendar(t);
    await saveTasks();
    node.link = {kind:"todo", ref:t.id, cal:!!t.syncCalendar && !!t.calendarEventId, evId:"", calId:""};
  }else{
    if(!defaultGTaskListId) await loadGTasks();
    if(!defaultGTaskListId){ toast("Google Tasks nicht erreichbar"); return; }
    const res = await api(`${GTASKS}/lists/${encodeURIComponent(defaultGTaskListId)}/tasks`,
      {method:"POST", body:JSON.stringify({title, notes:GOAL_MARKER, due:wsLinkDay(node)+"T12:00:00.000Z"})});
    node.link = {kind:"goal", ref:res.id, cal:false, evId:"", calId:""};
    if(cal) await wsGoalEvent(node.link, title, wsLinkDay(node), true);
    await loadGTasks();
  }
  wsTouch(doc);
  if(node.done) await wsPushDone(doc, node);
  toast(kind==="goal" ? "Als Tages-Ziel angelegt" : "Als ToDo angelegt");
  wsRenderIfSafe();
}
async function wsApplyMenu(docId, nid, o){
  const doc = wsGet(docId), n = doc && wsFindAny(doc, nid); if(!n) return;
  const wasDone = n.done;
  if(o.text!==undefined){ const t = wsIsAtt(n) ? String(o.text).trim() : String(o.text).replace(/\s*[\r\n]+\s*/g, " ").trim(); if(wsTitleOfRaw(n)!==t){ wsSetTitle(n, t); } }
  if(o.tag!==undefined) n.tag = wsNormTag(o.tag);
  if(o.done!==undefined) n.done = !!o.done;
  if(o.hid!==undefined && !wsIsAtt(n)) n.hid = !!o.hid;
  wsTouch(doc);
  await wsApplyMenuCore(docId, nid, o);
  if(o.convert && n.link && n.link.kind!==o.convert) await wsLinkRun(()=>wsConvertLink(doc, n, o.convert, !!o.cal));
  else if(n.link && n.done!==wasDone) wsLinkRun(()=>wsPushDone(doc, n));
  if(!(view==="notes" && wsTab==="docs")) render();
}
function wsTitleOfRaw(x){ return wsIsAtt(x) ? (x.title||"") : (x.text||""); }
async function wsApplyMenuCore(docId, nid, o){
  const doc = wsGet(docId), n = doc && wsFindAny(doc, nid); if(!n) return;
  const L = n.link, today = todayKey();
  const date0 = wsIsDate(o.date) ? o.date : "";
  const setFields = ()=>{
    if(wsIsAtt(n)) return;
    const dur = parseInt(o.dur, 10);
    n.dur = (dur>0 && dur<=3660) ? dur : 0;
    n.dl = wsIsDate(o.dl) ? o.dl : "";
    n.meta = !!o.meta;
  };
  const newDl = wsIsAtt(n) ? "" : (wsIsDate(o.dl) ? o.dl : "");
  const place = (day)=>{ if(newDl){ n.date = date0; n.ld = day; } else { n.date = day; n.ld = ""; } };
  if(!L){
    if(!o.kind){ n.date = date0; setFields(); wsTouch(doc); wsRefreshDoc(doc); return; }
    if(!wsTitleOf(n)){ toast(wsIsAtt(n) ? "Erst einen Titel oder Text eingeben" : "Erst einen Text eingeben"); return; }
    const day = wsPlanDay(n, date0, newDl, false, today);
    if(o.kind==="goal"){
      if(day<today){ toast("Ein Tages-Ziel braucht ein heutiges oder späteres Datum"); return; }
      if(wsGoalCount(day)>=GOAL_MAX){ toast("Maximal "+GOAL_MAX+" Tages-Ziele pro Tag am "+wsShortDate(day)); return; }
    }
    setFields(); place(day); wsTouch(doc); wsRefreshDoc(doc);
    await wsLinkRun(()=>wsCreateItem(doc, n, o.kind, !!o.cal));
    return;
  }
  const oldLd = wsLinkDay(n);
  const day = wsPlanDay(n, date0, newDl, true, today);
  if(L.kind==="goal"){
    if(!day){ toast("Ein Tages-Ziel braucht ein Datum"); return; }
    if(day!==oldLd){
      if(day<today){ toast("Ein Tages-Ziel braucht ein heutiges oder späteres Datum"); return; }
      if(wsGoalCount(day)>=GOAL_MAX){ toast("Maximal "+GOAL_MAX+" Tages-Ziele pro Tag am "+wsShortDate(day)); return; }
    }
  }
  setFields(); place(day); wsTouch(doc); wsRefreshDoc(doc);
  await wsLinkRun(()=>wsSyncItem(doc, n, !!o.cal));
}
async function wsUnlink(docId, nid){
  const doc = wsGet(docId), nn = doc && wsFindAny(doc, nid); if(!nn || !nn.link) return;
  const L = nn.link; nn.link = null; wsTouch(doc); wsRefreshDoc(doc);
  if(L.kind==="goal" && L.evId) await wsLinkRun(()=>wsGoalEvent(L, "", "", false));
  toast("Verknüpfung gelöst, "+(L.kind==="goal"?"das Ziel":"das ToDo")+" bleibt bestehen");
}

/* ---- Menü je Punkt: Datum, ToDo, Tages-Ziel, Kalender ---- */

function wsOpenTagMenu(docId, kind, id){
  const doc = wsGet(docId); if(!doc || document.getElementById("modalBg")) return;
  let obj = null;
  if(kind==="doc") obj = doc;
  else if(kind==="block") obj = wsBlock(doc, id);
  else if(kind==="att") obj = wsFindAny(doc, id);
  else { const r = wsFindNode(doc, id); obj = r ? r.node : null; }
  if(!obj) return;
  const known = []; const seen = new Set();
  wsAllTags(wsDocs).concat(["Privat","Job","Projekt"]).forEach(t=>{ const k = wsTagKey(t); if(!seen.has(k)){ seen.add(k); known.push(t); } });
  const what = kind==="doc" ? "das ganze Dokument" : kind==="att" ? "diesen Anhang" : kind==="block" ? (obj.type==="heading" ? "diese Überschrift und alle Blöcke bis zur nächsten Überschrift" : "diesen Block und alles darin") : "diesen Punkt samt allen Unterpunkten und Anhängen";
  /* Einträge darunter mit eigenen Tags: auf Wunsch zurücksetzen */
  const own = [];
  const grabNodes = nodes=>nodes.forEach(n=>{ if(n!==obj && n.tag) own.push(n); (n.att||[]).forEach(x=>{ if(x!==obj && x.tag) own.push(x); }); });
  const grab = blocks=>blocks.forEach(b=>{ if(b!==obj && b.tag) own.push(b); if(b.type==="outline") grabNodes(wsAllNodes({blocks:[b]})); });
  if(kind==="doc") grab(doc.blocks);
  else if(kind==="block"){
    if(obj.type==="heading"){ const i = doc.blocks.indexOf(obj); const rest = []; for(let k=i+1;k<doc.blocks.length && doc.blocks[k].type!=="heading";k++) rest.push(doc.blocks[k]); grab(rest); }
    else if(obj.type==="outline") grabNodes(wsAllNodes({blocks:[obj]}));
  }
  else if(kind==="node") grabNodes([obj].concat(wsAllNodes({blocks:[{type:"outline", items:obj.children}]})));
  const ownKeys = new Set(wsTagList(obj.tag).map(t=>t.toLowerCase()));
  const effAll = kind==="doc" ? wsNormTag(doc.tag) : kind==="block" ? (wsBlockTags(doc)[obj.id]||"") : kind==="att" ? wsTagUnion((wsAttOwner(doc, obj.id) ? wsEffMap().get(wsAttOwner(doc, obj.id).id) : "")||"", obj.tag) : (wsEffMap().get(obj.id)||"");
  const inh = wsTagList(effAll).filter(t=>!ownKeys.has(t.toLowerCase())).join(", ");
  document.body.insertAdjacentHTML("beforeend",
    `<div class="modal-bg" id="modalBg"><div class="modal">
      <h2>Tags</h2>
      <p class="muted" style="font-size:13px;margin-bottom:10px">Die Tags gelten für ${what}. Mehrere Tags trennst du mit Komma oder tippst sie unten an. Sie kommen zu den geerbten Tags dazu.${inh?` Geerbt: ${esc(inh)}.`:""}</p>
      <input type="text" id="wst_in" maxlength="140" value="${esc(obj.tag||"")}" placeholder="z. B. Job, Projekt" style="width:100%;background:#101216;border:1px solid #30343b;color:var(--text);border-radius:8px;padding:10px;font-size:16px;font-family:inherit;margin-bottom:10px">
      <div class="ws-frow" style="margin-bottom:12px">${known.map(t=>`<button class="ws-fc" data-v="${esc(t)}">${esc(t)}</button>`).join("")}</div>
      ${own.length?`<div class="toggle-row"><div><div style="font-size:14px">Eigene Tags darunter entfernen</div>
        <div class="muted" style="font-size:12px">${own.length} ${own.length===1?"Eintrag hat":"Einträge haben"} eigene Tags. Aus: sie behalten sie. An: sie werden gelöscht, die Einträge erben nur noch von hier.</div></div>
        <button class="switch" id="wst_over"></button></div>`:""}
      <div class="modal-actions">
        <button class="btn-ghost" id="wst_cancel">Abbrechen</button>
        ${obj.tag?`<button class="btn-ghost" id="wst_clear">Alle entfernen</button>`:""}
        <button class="btn-primary" id="wst_ok">OK</button>
      </div></div></div>`);
  const close = ()=>{ const mb = $("modalBg"); if(mb) mb.remove(); };
  const apply = v=>{
    const over = $("wst_over") && $("wst_over").classList.contains("on");
    obj.tag = wsNormTag(v);
    if(over) own.forEach(o=>{ o.tag = ""; });
    wsTouch(doc); close(); render();
  };
  const mark = ()=>{ const have = new Set(wsTagList($("wst_in").value).map(t=>t.toLowerCase())); document.querySelectorAll("#modalBg .ws-fc").forEach(b=>b.classList.toggle("on", have.has(b.dataset.v.toLowerCase()))); };
  $("wst_cancel").onclick = close;
  $("modalBg").onclick = e=>{ if(e.target.id==="modalBg") close(); };
  document.querySelectorAll("#modalBg .ws-fc").forEach(b=>{ b.onclick = ()=>{
    const l = wsTagList($("wst_in").value), k = b.dataset.v.toLowerCase(), i = l.findIndex(t=>t.toLowerCase()===k);
    if(i>=0) l.splice(i,1); else l.push(b.dataset.v);
    $("wst_in").value = l.join(", "); mark();
  }; });
  $("wst_in").addEventListener("input", mark); mark();
  if($("wst_over")) $("wst_over").onclick = ()=>$("wst_over").classList.toggle("on");
  if($("wst_clear")) $("wst_clear").onclick = ()=>apply("");
  $("wst_ok").onclick = ()=>apply($("wst_in").value);
  $("wst_in").addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); apply($("wst_in").value); } });
  $("wst_in").focus();
}
/* wirksame Tags aller Punkte (zwischengespeichert, solange sich nichts ändert) */
let _wsEmRev = -1, _wsEmDocs = null, _wsEm = null;
function wsEffMap(){

function wsFindNodeAnyDoc(nid){

let wsBack = null;      // "3d": Rücksprung zur 3D-Ansicht, solange man von dort aus geöffnet hat
function wsNodePath(items, id, path){
  for(const n of items){ if(n.id===id) return path; const r = wsNodePath(n.children, id, path.concat(n)); if(r) return r; }
  return null;
}
/* Eintrag im Dokument öffnen: Dokument wählen, Zweige aufklappen, hinscrollen und kurz hervorheben */
function wsGoToItem(docId, kind, ref, from3d){
  const doc = wsGet(docId); if(!doc) return;
  wsBack = from3d ? "3d" : null;
  wsOpenDocId = docId; try{ localStorage.setItem("wsOpenDoc", docId); }catch(e){}
  if(wsF.tag){ wsF = wsFNorm({...wsF, tag:""}); wsFSave(); }
  let sel = `.ws-doc[data-doc="${docId}"] .ws-doctitle`;
  if(kind==="node" || kind==="att"){
    const owner = kind==="att" ? wsAttOwner(doc, ref) : null, nid = kind==="att" ? (owner && owner.id) : ref;
    let path = null; for(const b of doc.blocks){ if(b.type==="outline"){ path = wsNodePath(b.items, nid, []); if(path) break; } }
    if(path){
      let ch = false;
      path.forEach(p=>{ if(wsFiltered()) wsColl.set(p.id, false); else if(p.collapsed){ p.collapsed = false; ch = true; } });
      if(ch) wsTouch(doc);
    }
    const tn = kind==="att" ? owner : wsFindAny(doc, nid);
    if(kind==="att" && tn){ if(!tn.aopen){ tn.aopen = true; wsTouch(doc); } wsOpenMap.set(ref, true); }
    sel = kind==="att" ? `.ws-doc[data-doc="${docId}"] [data-aid="${ref}"]` : `.ws-doc[data-doc="${docId}"] [data-nid="${ref}"] > .ws-nrow`;
  }else if(kind==="block") sel = `.ws-doc[data-doc="${docId}"] [data-bid="${ref}"]`;
  {
    let tb = null;
    if(kind==="block") tb = ref;
    else if(kind==="node" || kind==="att"){
      const nid2 = kind==="att" ? (wsAttOwner(doc, ref)||{}).id : ref;
      const bb = doc.blocks.find(b=>b.type==="outline" && wsNodePath(b.items, nid2, [])); tb = bb && bb.id;
    }
    (tb ? wsHeadChain(doc, tb) : []).forEach(hd=>{
      if(wsFiltered()) wsColl.set(hd.id, false); else if(hd.collapsed){ hd.collapsed = false; wsTouch(doc); }
    });
  }
  wsTab = "docs"; try{ localStorage.setItem("wsTab", "docs"); }catch(e){}
  view = "notes"; render();
  let tries = 0;
  const seek = ()=>{
    const el = document.querySelector(sel);
    if(!el){ if(++tries<15) setTimeout(seek, 70); else toast("Der Eintrag ist durch einen aktiven Filter ausgeblendet."); return; }
    el.scrollIntoView({block:"center", behavior:"smooth"});
    el.classList.add("ws-flash"); setTimeout(()=>el.classList.remove("ws-flash"), 2600);
  };
  setTimeout(seek, 60);
}

/* ---- ToDo <-> Tages-Ziel umwandeln (verknüpfter Punkt) ---- */
async function wsConvertLink(doc, n, toKind, cal){
  const old = n.link; if(!old || old.kind===toKind) return;
  if(!wsLinkDay(n)) n.date = todayKey();
  const day = wsLinkDay(n), today = todayKey();
  if(toKind==="goal"){
    if(day<today){ toast("Ein Tages-Ziel braucht ein heutiges oder späteres Datum"); return; }
    if(wsGoalCount(day)>=GOAL_MAX){ toast("Maximal "+GOAL_MAX+" Tages-Ziele pro Tag am "+wsShortDate(day)); return; }
  }
  const oldCopy = Object.assign({}, old);
  n.link = null;
  try{ await wsCreateItem(doc, n, toKind, !!cal); }
  catch(e){ console.warn("Umwandeln fehlgeschlagen:", e); }
  if(!n.link){ n.link = old; wsTouch(doc); toast("Umwandeln fehlgeschlagen, der alte Eintrag bleibt"); wsRenderIfSafe(); return; }
  await wsReleaseLinks([oldCopy], true);
  wsTouch(doc);
  toast(toKind==="goal" ? "In Tages-Ziel umgewandelt" : "In ToDo umgewandelt");
  wsRenderIfSafe();
}

/* ---- ToDos und Tages-Ziele der ToDo-App als verknüpfte Punkte in ein Dokument einfügen ---- */
const WS_TAGLBL = {privat:"Privat", job:"Job", projekt:"Projekt"};
function wsImportCandidates(){
  const linked = wsWkLinkedSet(), out = [];
  tasks.forEach(t=>{
    if(!t || t.type!=="todo" || t.archived || t.scheduleType==="weekly" || isEverDone(t.id) || !(t.title||"").trim() || linked.has("todo:"+t.id)) return;
    out.push({kind:"todo", id:t.id, title:t.title, day:wsIsDate(t.startDate)?t.startDate:"", cal:!!t.calendarEventId,
      tag:String(t.tag||"").split(",").map(x=>WS_TAGLBL[x.trim()]).filter(Boolean).join(", ")});
  });
  const seen = new Set();
  allOpenGoals.concat(goalTasks).forEach(g=>{
    if(!g || !g.id || seen.has(g.id)) return; seen.add(g.id);
    if(g.completed || !(g.title||"").trim() || g.title==="(ohne Titel)" || linked.has("goal:"+g.id)) return;
    out.push({kind:"goal", id:g.id, title:g.title, day:wsIsDate(g.due)?g.due:"", cal:false, tag:""});
  });
  out.sort((a,b)=>(a.day?0:1)-(b.day?0:1) || (a.day<b.day?-1:a.day>b.day?1:0) || a.title.localeCompare(b.title, "de"));
  return out;
}
/* ---- Fokus und Meta-Projekt für ToDos und Tages-Ziele der ToDo-App (über den verknüpften Punkt im Arbeitsbereich) ---- */
function wsTaskBtns(kind, ref){
  if(!wsLoaded) return "";
  const hit = wsFindByLink(wsDocs, kind, ref);
  const fo = !!hit && wsFocusHas(hit.doc, hit.node.id), me = !!hit && !!hit.node.meta;
  return `<button class="mini${fo?" on":""}" data-wsact="task-focus" data-kind="${kind}" data-ref="${esc(ref)}" title="${fo?"Fokus aufheben":"In Heute als Fokus anzeigen"}" style="${fo?"color:#b45309;font-weight:700":""}">📌</button>`
       + `<button class="mini${me?" on":""}" data-wsact="task-meta" data-kind="${kind}" data-ref="${esc(ref)}" title="${me?"Nicht mehr Meta-Projekt":"Als Meta-Projekt kennzeichnen"}" style="${me?"color:#b45309;font-weight:700":""}">${me?"★":"☆"}</button>`;
}
/* verknüpften Punkt holen; gibt es ihn noch nicht, wird er im Auto-Eingang angelegt */
function wsEnsureTaskNode(kind, ref){
  let hit = wsFindByLink(wsDocs, kind, ref); if(hit) return hit;
  let x = null;
  if(kind==="todo"){
    const t = tasks.find(q=>q.id===ref);
    if(t) x = {kind, id:t.id, title:t.title, day:wsIsDate(t.startDate)?t.startDate:"", cal:!!t.calendarEventId, tag:String(t.tag||"").split(",").map(q=>WS_TAGLBL[q.trim()]).filter(Boolean).join(", ")};
  }else{
    const g = allOpenGoals.concat(goalTasks).find(q=>q && q.id===ref);
    if(g) x = {kind, id:g.id, title:g.title, day:wsIsDate(g.due)?g.due:"", cal:false, tag:""};
  }
  if(!x) return null;
  let doc = wsDocs.find(d=>d.inbox);
  if(!doc){
    doc = wsNewDoc("ToDo-Eingang"); doc.inbox = true; doc.seen = [];
    const ol = wsNewBlock("outline"); ol.items = []; doc.blocks.push(ol); wsDocs.push(doc);
    try{ localStorage.setItem("wsInboxMade", "1"); }catch(e){}
  }
  wsInsertLinked(doc, [x], null, null);
  if(!doc.seen.includes(kind+":"+ref)) doc.seen.push(kind+":"+ref);
  wsTouch(doc);
  return wsFindByLink(wsDocs, kind, ref);
}
/* ---- Auto-Eingang: jedes neue ToDo und Tagesziel landet als verknüpfter Punkt im Dokument "ToDo-Eingang" ---- */
function wsInboxOn(){ try{ return localStorage.getItem("wsInboxOff")!=="1"; }catch(e){ return true; } }   // immer an; nur die Tests schalten es über wsInboxOff ab
let wsInboxTimer = null;
function wsInboxKick(){
  if(!wsLoaded || !wsInboxOn()) return;
  clearTimeout(wsInboxTimer); wsInboxTimer = setTimeout(wsInboxSync, 400);
}
function wsInboxSync(){
  try{
    if(!wsLoaded || !wsInboxOn() || !Array.isArray(tasks)) return;
    let doc = wsDocs.find(d=>d.inbox);
    let made = false;
    try{ made = localStorage.getItem("wsInboxMade")==="1"; }catch(e){}
    if(!doc && made) return;                                   // wurde bewusst gelöscht: nicht neu anlegen
    const cands = wsImportCandidates().filter(x=>!doc || !doc.seen.includes(x.kind+":"+x.id));
    if(!doc){
      if(!cands.length) return;
      doc = wsNewDoc("ToDo-Eingang"); doc.inbox = true; doc.seen = [];
      const tx = wsNewBlock("text"); tx.text = "Hier landen automatisch alle neuen ToDos und Tagesziele. Mit „Verschieben“ ordnest du sie anderen Dokumenten oder Überschriften zu, die Verknüpfung bleibt erhalten.";
      doc.blocks.push(tx);
      const ol = wsNewBlock("outline"); ol.items = []; doc.blocks.push(ol);
      wsDocs.push(doc);
      try{ localStorage.setItem("wsInboxMade", "1"); }catch(e){}
    }
    if(!cands.length) return;
    wsInsertLinked(doc, cands, null, null);
    cands.forEach(x=>doc.seen.push(x.kind+":"+x.id));
    if(doc.seen.length>3000) doc.seen = doc.seen.slice(-3000);
    wsTouch(doc);
    wsRefreshChips();
    if(view==="notes") render();
  }catch(e){ console.error("wsInboxSync:", e); }
}
function wsInsertLinked(doc, items, blockId, parentNid){
  let list = null;
  if(parentNid){ const r = wsFindNode(doc, parentNid); if(r){ list = r.node.children; r.node.collapsed = false; } }
  if(!list){
    let block = blockId ? wsBlock(doc, blockId) : doc.blocks.find(b=>b.type==="outline");
    if(!block || block.type!=="outline"){ block = wsNewBlock("outline"); block.items = []; doc.blocks.push(block); }
    list = block.items;
  }
  items.forEach(x=>{
    const n = wsNewNode(x.title); n.date = x.day||""; n.tag = wsNormTag(x.tag);
    n.link = {kind:x.kind, ref:x.id, cal:!!x.cal, evId:"", calId:""};
    list.push(n);
  });
  wsTouch(doc);
  return items.length;
}
/* o: {docId?, parent?, blockId?, pick?:{kind,id}} - ohne docId wählt man Dokument und Stelle im Dialog */

  document.body.insertAdjacentHTML("beforeend",

      <div class="modal-actions"><button class="btn-ghost" id="wsm_cancel">Abbrechen</button><button class="btn-primary" id="wsm_ok">Verschieben</button></div>
    </div></div>`);
  const fillPar = ()=>{ const d = wsGet($("wsm_doc").value); $("wsm_par").innerHTML = d ? parOpts(d, +$("wsm_sec").value) : ""; };
  $("wsm_sec").value = String(curSec); fillPar();
  $("wsm_doc").onchange = ()=>{ const d = wsGet($("wsm_doc").value); $("wsm_sec").innerHTML = d ? secOpts(d) : ""; fillPar(); };
  $("wsm_sec").onchange = fillPar;
  $("wsm_cancel").onclick = ()=>$("modalBg").remove();

  $("wsm_ok").onclick = ()=>{

    const sec = wsSections(dst)[+$("wsm_sec").value], v = $("wsm_par").value;
    if(!sec || (!v && isAtt) || (!v && !isAtt)){ toast("Dort ist kein Ziel auswählbar"); return; }
    const tgt = {block:sec.id, headId:sec.headId};
    if(isAtt) Object.assign(tgt, {mode:"child", parent:v});
    else if(v.startsWith("c:")) Object.assign(tgt, {mode:"child", parent:v.slice(2)});
    else tgt.mode = v;
    const ok = wsMoveTo(doc, dst, id, tgt);
    if(!ok){ toast(isAtt ? "Dort liegt der Anhang schon" : "Dorthin lässt sich der Punkt nicht verschieben"); return; }
    wsTouch(doc); if(dst!==doc) wsTouch(dst);
    $("modalBg").remove(); toast("Verschoben nach „"+(dst.title||"(ohne Titel)")+"“ · "+sec.label); render();
  };
}

/* ---- Überschrift (E1/E2): erledigen mit Warnung, verschieben ---- */
function wsHeadOpenInfo(doc, bid){
  const i = doc.blocks.findIndex(b=>b.id===bid); if(i<0) return {nodes:0, heads:0, list:[], subs:[]};
  const end = wsSecEnd(doc.blocks, i), list = [], subs = [];
  let nodes = 0, heads = 0;
  const walk = items=>items.forEach(n=>{ if(!n.done){ nodes++; list.push(n); } walk(n.children); });
  doc.blocks.slice(i+1, end).forEach(b=>{
    if(b.type==="outline"){
      const all = []; const w2 = items=>items.forEach(n=>{ all.push(n); w2(n.children); }); w2(b.items);
      all.forEach(n=>{ if(!n.done){ nodes++; list.push(n); } });
    }else if(b.type==="heading"){ subs.push(b); if(!b.done) heads++; }
  });
  return {nodes, heads, list, subs};
}
function wsAskHeadDone(title, info){
  return new Promise(resolve=>{
    if(document.getElementById("modalBg")){ resolve(null); return; }
    const parts = [];
    if(info.nodes) parts.push(info.nodes+(info.nodes===1?" offener Punkt":" offene Punkte"));
    if(info.heads) parts.push(info.heads+(info.heads===1?" offene Unterüberschrift":" offene Unterüberschriften"));
    document.body.insertAdjacentHTML("beforeend",
      `<div class="modal-bg" id="modalBg"><div class="modal">
        <h2>Darunter ist noch etwas offen</h2>
        <p style="font-size:14px;margin-bottom:12px">Unter „${esc((title||"Überschrift").slice(0,60))}“ ${info.nodes+info.heads===1?"ist":"sind"} noch ${esc(parts.join(" und "))}. Was soll geschehen?</p>
        <div class="modal-actions" style="flex-direction:column;align-items:stretch;gap:8px">
          <button class="btn-primary" id="wsh_all">Alles darunter ebenfalls erledigen</button>
          <button class="btn-ghost" id="wsh_head">Nur die Überschrift erledigen</button>
          <button class="btn-ghost" id="wsh_cancel">Abbrechen</button>
        </div></div></div>`);
    const done = v=>{ const m = $("modalBg"); if(m) m.remove(); resolve(v); };
    $("wsh_all").onclick = ()=>done("all");
    $("wsh_head").onclick = ()=>done("head");
