<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>ToDo</title>
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
<link rel="shortcut icon" href="favicon.ico?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<style>
  :root{
    --bg:#0f1115; --surface:#171a21; --surface2:#1f242e; --line:#2a303c;
    --text:#e7e9ee; --muted:#9aa3b2; --accent:#6366f1; --accent2:#4f46e5;
    --green:#22c55e; --red:#ef4444; --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  body{padding-bottom:env(safe-area-inset-bottom)}
  button{font-family:inherit}
  .app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

  header{position:sticky;top:0;z-index:5;background:var(--bg);
    display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
  header h1{font-size:18px;margin:0;flex:1;font-weight:600}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
  .dot.on{background:var(--green)} .dot.busy{background:#f59e0b}
  .icon-btn{background:var(--surface2);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:7px 11px;font-size:13px;cursor:pointer}

  main{flex:1;padding:14px 16px 90px}
  .muted{color:var(--muted)} .center{text-align:center}

  .signin{display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;padding:60px 24px;text-align:center}
  .signin p{color:var(--muted);max-width:320px;line-height:1.5}
  .btn-primary{background:var(--accent2);border:none;color:#fff;border-radius:12px;
    padding:13px 22px;font-size:15px;font-weight:600;cursor:pointer}
  .btn-primary:active{background:var(--accent)}

  .section-title{font-size:13px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--muted);margin:18px 2px 8px}
  .card{background:#ffe0cc;border:1px solid var(--line);border-radius:var(--radius);
    padding:13px 14px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
  .card .body{flex:1;min-width:0}
  .card .title{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;color:#000}
  .card .sub{font-size:12px;color:#000;margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .card.done .title{text-decoration:line-through;color:var(--muted)}
  .badge{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:11px}
  .badge.cal{color:#a5b4fc;border-color:#3b3f63}

  .check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);
    flex:none;cursor:pointer;display:flex;align-items:center;justify-content:center;background:transparent}
  .check.on{background:var(--green);border-color:var(--green)}
  .check svg{width:15px;height:15px;display:none} .check.on svg{display:block}

  .row-actions{display:flex;gap:6px}
  .mini{background:transparent;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:4px 6px}
  .mini:active{color:var(--text)}

  .streak{display:flex;gap:4px;margin-top:6px}
  .streak .d{width:16px;height:16px;border-radius:4px;background:var(--surface2);border:1px solid var(--line)}
  .streak .d.on{background:var(--green);border-color:var(--green)}

  .fab{position:fixed;right:calc(50% - 280px + 16px);bottom:calc(var(--navh,96px) + 14px);width:54px;height:54px;border-radius:50%;
    background:var(--accent2);color:#fff;border:none;font-size:28px;cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,.4);z-index:6}
  .fab-quick{position:fixed;right:calc(50% - 280px + 16px);bottom:calc(var(--navh,96px) + 78px);width:46px;height:46px;border-radius:50%;
    background:var(--green);color:#fff;border:none;font-size:20px;cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,.4);z-index:6}
  @media(max-width:592px){.fab{right:16px}.fab-quick{right:20px}}

  nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);
    border-top:1px solid var(--line);display:flex;max-width:560px;margin:0 auto;
    padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;background:none;border:none;color:var(--muted);padding:9px 1px 11px;
    font-size:10.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
  nav button.active{color:var(--text)}
  nav .nico{font-size:19px;line-height:1}

  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;
    align-items:flex-end;justify-content:center}
  .modal{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;
    padding:18px 18px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
  .modal h2{margin:0 0 14px;font-size:17px}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
  input[type=text],input[type=date],select,textarea{width:100%;background:var(--surface2);
    border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 12px;font-size:15px}
  textarea{resize:vertical;min-height:54px}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button{flex:1;min-width:90px;background:var(--surface2);border:1px solid var(--line);
    color:var(--text);border-radius:10px;padding:10px;font-size:13px;cursor:pointer}
  .seg button.sel{background:var(--accent2);border-color:var(--accent2);color:#fff}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;margin-top:16px;
    background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .switch{width:46px;height:27px;border-radius:14px;background:var(--line);border:none;position:relative;cursor:pointer;flex:none}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.15s}
  .switch.on{background:var(--green)} .switch.on::after{left:22px}
  .modal-actions{display:flex;gap:10px;margin-top:20px}
  .modal-actions .btn-primary{flex:1}
  .btn-ghost{flex:1;background:var(--surface2);border:1px solid var(--line);color:var(--text);
    border-radius:12px;padding:13px;font-size:15px;cursor:pointer}
  .empty{text-align:center;color:var(--muted);padding:36px 16px;font-size:14px}
  a{color:#a5b4fc}
  .pie-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;margin:14px 0 8px}
  .pie-pct{font-size:30px;font-weight:700;margin-top:8px}
  .pie-sub{color:var(--muted);font-size:13px}
  .legend{display:flex;gap:20px;margin-top:10px;font-size:13px;color:var(--muted)}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  .legend i.green{background:var(--green)} .legend i.red{background:var(--red)}
  .note-detail{margin-top:8px;cursor:pointer}
  .note-detail summary{font-size:13px;color:var(--muted);user-select:none}
  .note-detail[open] summary{color:var(--text)}
  .note-text{font-size:13px;color:var(--muted);margin-top:6px;white-space:pre-wrap;word-wrap:break-word;line-height:1.4}
  .toast{position:fixed;left:50%;bottom:calc(var(--navh,96px) + 16px);transform:translateX(-50%);background:#000;
    border:1px solid var(--line);color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;z-index:30;opacity:0;transition:.2s;pointer-events:none}
  .toast.show{opacity:1}

  /* ================= SCHWARZ / METALLICGRAU THEME + GAMIFICATION ================= */
  :root{
    --bg:#050506; --surface:#0e0f12; --surface2:#17191d; --line:#2c3037;
    --text:#e8eaee; --muted:#8c929d; --accent:#b7bdc8; --accent2:#454b55;
    --green:#34d27b; --red:#ff5a5f; --amber:#ffb020; --steel:#8fa0b8;
    --metal:repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px),
            linear-gradient(145deg,#2d3037 0%,#191b1f 48%,#25282d 100%);
    --metal-hi:linear-gradient(145deg,#555b66 0%,#2c3037 52%,#444a54 100%);
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  }
  html{background:#050506}
  body{background:radial-gradient(130% 55% at 50% 0%,#17191d 0%,#050506 62%) no-repeat #050506;min-height:100vh}
  header{background:rgba(5,5,6,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    padding-top:calc(12px + env(safe-area-inset-top));border-bottom:1px solid #2a2d33}
  header h1{letter-spacing:.04em;text-transform:uppercase;font-size:16px}
  main{padding:14px 14px calc(var(--navh,96px) + 16px)}
  a{color:#aab6c8}
  .badge.cal{color:#aab6c8;border-color:#3b4452}
  .icon-btn{background:var(--metal-hi);border-color:#4a505a;color:#fff}

  .section-title{display:flex;align-items:center;gap:10px;font-size:11.5px;letter-spacing:.16em;color:var(--muted);margin:22px 2px 10px}
  .section-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#3a3f47,transparent)}

  .card{border:1px solid #30343b;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 3px 10px rgba(0,0,0,.55)}
  .card:not([data-projcard]){background:var(--metal)!important}
  .card:not([data-projcard]) .title{color:var(--text)!important}
  .card:not([data-projcard]) .sub{color:var(--muted)}
  .card .note-text,.card .note-detail summary{color:var(--muted)!important}
  .card .note-detail[open] summary{color:var(--text)!important}
  .card .sub[style*="color:#000"],.card .sub[style*="color:#555"],.card [style*="color:#666"]{color:var(--muted)!important}
  .card.done .title{color:#6d737e!important}
  .card[style*="background:#ef4444"]{box-shadow:inset 0 0 0 1px rgba(255,90,95,.45),0 0 16px rgba(255,90,95,.22)}
  .card .body{min-width:0}

  .check{width:30px;height:30px;border-radius:9px;border:2px solid #5b6270;background:rgba(0,0,0,.4)}
  .check.on{background:linear-gradient(145deg,#4be08d,#1fa75c);border-color:#4be08d;box-shadow:0 0 12px rgba(52,210,123,.45)}
  .check:active{transform:scale(.92)}
  .mini{color:var(--accent);background:rgba(255,255,255,.045);border:1px solid #30343b;border-radius:8px;
    padding:7px 9px;min-height:34px;font-size:12.5px}
  .mini:active{background:rgba(255,255,255,.12);color:#fff}
  .streak .d{background:#101216}
  .streak .d.on{background:var(--amber);border-color:var(--amber);box-shadow:0 0 6px rgba(255,176,32,.5)}

  .btn-primary,.seg button.sel{background:var(--metal-hi);border:1px solid #7a818d;color:#fff;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 2px 8px rgba(0,0,0,.5)}
  .btn-primary:active{filter:brightness(1.25);background:var(--metal-hi)}
  .btn-ghost,.seg button{background:#14161a;border-color:#30343b}
  .fab{background:var(--metal-hi);border:1px solid #8a919d;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.25)}
  .fab-quick{background:linear-gradient(145deg,#ffd166,#e08a00);color:#1a1000;border:1px solid #ffe0a0;
    box-shadow:0 6px 18px rgba(0,0,0,.6),0 0 14px rgba(255,176,32,.3)}
  .modal{background:linear-gradient(180deg,#1b1d21,#0f1013);border-top:1px solid #3a3f47}
  input[type=text],input[type=date],select,textarea{background:#101216;border-color:#30343b}

  nav{background:linear-gradient(180deg,#1c1e23,#0a0b0d);border-top:1px solid #3a3f47;
    flex-wrap:wrap;justify-content:center;overflow:visible}
  nav button{flex:0 0 calc(100% / 6);min-width:0;max-width:calc(100% / 6);padding:7px 2px 7px;position:relative;
    gap:2px;font-size:10px;white-space:nowrap}
  nav button .nico{font-size:17px}
  nav button.active{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.09),transparent)}
  nav button.active::before{content:"";position:absolute;top:0;left:18%;right:18%;height:2px;border-radius:2px;
    background:linear-gradient(90deg,transparent,#e8eaee,transparent);box-shadow:0 0 8px rgba(232,234,238,.7)}

  .pie-pct{font-family:var(--mono);font-size:24px;margin-top:4px}
  .toast{background:#1a1c20;border-color:#4a505a}

  /* ---- HUD ---- */
  .lvpill{font:700 11px var(--mono);letter-spacing:.1em;padding:5px 9px;border-radius:999px;border:1px solid #5b6270;
    background:var(--metal-hi);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
  .hud{position:relative;border:1px solid #3d424b;border-radius:18px;padding:16px;margin-bottom:4px;overflow:hidden;
    background:radial-gradient(120% 90% at 0% 0%,rgba(255,255,255,.11),transparent 55%),var(--metal);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 10px 28px rgba(0,0,0,.65)}
  .hud::after{content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;transform:skewX(-20deg);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.10),transparent);animation:sheen 7s ease-in-out infinite}
  @keyframes sheen{0%,70%{left:-80px}100%{left:120%}}
  .hud-top{display:flex;align-items:center;gap:16px}
  .ring{position:relative;width:98px;height:98px;flex:none}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring circle.prog{transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 4px rgba(220,226,236,.55))}
  .ring .lv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
  .ring .lv small{font-size:9px;letter-spacing:.22em;color:var(--muted);margin-bottom:3px}
  .ring .lv b{font:800 32px/1 var(--mono);color:#fff;text-shadow:0 0 12px rgba(255,255,255,.35)}
  .hud-info{flex:1;min-width:0}
  .rank{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  .rankname{font-size:22px;font-weight:800;letter-spacing:.02em;margin-top:2px;
    background:linear-gradient(180deg,#ffffff,#9ea6b3);-webkit-background-clip:text;background-clip:text;color:transparent}
  .xpnum{font:600 13px var(--mono);color:var(--accent);margin-top:3px}
  .bar{height:11px;border-radius:7px;background:#08090b;border:1px solid #2a2e35;overflow:hidden;margin-top:9px;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.8)}
  .bar>i{display:block;height:100%;border-radius:7px;transition:width .7s cubic-bezier(.2,.8,.2,1);
    background:linear-gradient(180deg,#f6f8fb,#9aa2af 55%,#d3d8e0);box-shadow:0 0 10px rgba(220,226,236,.45)}
  .bar.quest>i{background:linear-gradient(180deg,#ffe08a,#ff9f1c);box-shadow:0 0 10px rgba(255,176,32,.5)}
  .bar.quest.done>i{background:linear-gradient(180deg,#7bf0ad,#1fa75c);box-shadow:0 0 12px rgba(52,210,123,.6)}
  .hud-sub{font-size:11px;color:var(--muted);margin-top:6px}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
  .tile{background:rgba(0,0,0,.38);border:1px solid #2c3037;border-radius:12px;padding:10px 4px 9px;text-align:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
  .tile b{display:block;font:800 21px var(--mono);color:#fff;line-height:1.1}
  .tile b.pos{color:var(--green)} .tile b.neg{color:var(--red)} .tile b.fire{color:var(--amber);text-shadow:0 0 10px rgba(255,176,32,.45)}
  .tile span{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px}
  .quest{margin-top:14px}
  .quest-head{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted)}
  .quest-head b{font:700 13px var(--mono);color:#fff;letter-spacing:.04em}
  .quest-done{color:var(--green)!important}

  .trophies{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .troph{background:var(--metal);border:1px solid #30343b;border-radius:12px;padding:12px 6px 10px;text-align:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
  .troph .ic{font-size:28px;line-height:1.1}
  .troph .nm{font-size:11.5px;font-weight:700;margin-top:5px;color:var(--text)}
  .troph .ds{font-size:10px;color:var(--muted);margin-top:2px;line-height:1.25}
  .troph.lock{opacity:.38;filter:grayscale(1)}

  .xpfloat{position:fixed;left:50%;bottom:calc(var(--navh,96px) + 60px);z-index:40;pointer-events:none;font:800 24px var(--mono);color:#fff;
    text-shadow:0 0 14px rgba(255,255,255,.65),0 2px 0 #000;white-space:nowrap;animation:xpup 1.2s ease-out forwards}
  @keyframes xpup{0%{opacity:0;transform:translate(-50%,12px) scale(.8)}18%{opacity:1;transform:translate(-50%,0) scale(1.12)}
    100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
  .levelup{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;background:rgba(0,0,0,.86);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);animation:fadein .25s}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .levelup small{font-size:12px;letter-spacing:.4em;color:var(--muted)}
  .levelup .big{font:800 clamp(56px,22vw,96px)/1 var(--mono);color:#fff;text-shadow:0 0 30px rgba(255,255,255,.5);
    animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
  .levelup .rk{font-size:22px;font-weight:800;letter-spacing:.08em;background:linear-gradient(180deg,#fff,#9ea6b3);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .levelup .tap{margin-top:22px;font-size:11px;letter-spacing:.2em;color:#6d737e}
  .rankchip{flex:none;min-width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    font:800 13px var(--mono)}

  @media(max-width:480px){
    .card:has(.row-actions > :nth-child(3)){flex-wrap:wrap}
    .card .row-actions:has(> :nth-child(3)){flex:1 0 100%;justify-content:flex-end}
    input[type=text],input[type=date],select,textarea{font-size:16px}
    .hud{padding:14px}
    .ring{width:88px;height:88px}
    .ring .lv b{font-size:28px}
    .rankname{font-size:20px}
  }
  @media(prefers-reduced-motion:reduce){
    *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  }

  /* ================= LAPTOP / BREITER BILDSCHIRM: Navigation als Seitenleiste links ================= */
  @media(min-width:900px){
    :root{--sbw:232px}
    body:has(#nav[style*="flex"]){padding-left:var(--sbw)}
    .app{max-width:780px}
    main{padding:18px 20px 40px}
    nav{left:0;top:0;bottom:0;right:auto;width:var(--sbw);max-width:none;margin:0;
      flex-direction:column;flex-wrap:nowrap;justify-content:flex-start;gap:2px;overflow-y:auto;
      padding:18px 10px calc(18px + env(safe-area-inset-bottom));
      background:linear-gradient(90deg,#1c1e23,#0a0b0d);border-top:0;border-right:1px solid #3a3f47}
    nav::before{content:"ToDo";display:block;padding:4px 14px 16px;font:800 13px var(--mono);letter-spacing:.3em;color:var(--muted)}
    nav button{flex:none;width:100%;max-width:none;flex-direction:row;justify-content:flex-start;gap:12px;
      padding:11px 14px;font-size:14px;border-radius:10px;text-align:left}
    nav button .nico{font-size:18px;width:24px;text-align:center}
    nav button:hover{background:rgba(255,255,255,.06);color:#fff}
    nav button.active{background:linear-gradient(90deg,rgba(255,255,255,.12),rgba(255,255,255,.03));font-weight:600}
    nav button.active::before{top:22%;bottom:22%;left:0;right:auto;width:3px;height:auto;
      background:linear-gradient(180deg,transparent,#e8eaee,transparent)}
    .fab{right:max(20px,calc(50% - 470px));bottom:24px}
    .fab-quick{left:calc(var(--sbw) / 2 - 23px);right:auto;bottom:24px;z-index:8}
    .toast,.xpfloat{left:calc(50% + var(--sbw) / 2)}
    .modal-bg{padding-left:var(--sbw);align-items:center}
    .modal{border-radius:18px;max-width:520px}
  }

  /* ================= ARBEITSBEREICH ================= */
  .ws-card{border:1px solid #3d424b;border-radius:16px;padding:12px;margin-bottom:12px;
    background:radial-gradient(120% 90% at 0% 0%,rgba(255,255,255,.07),transparent 55%),var(--metal);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 6px 18px rgba(0,0,0,.55)}
  .ws-head{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
  .ws-title{flex:1;min-width:0;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ws-caret{color:var(--muted);font-size:12px;flex:none}
  .ws-prev{margin:8px 0 0;padding:0;list-style:none;font-size:14px}

  .ws-prev.plain li::before{display:none}

  .ws-meta{font-size:11.5px;color:var(--muted);margin:6px 0 2px}

  .ws-toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:2px}

  .ws-bbody{flex:1;min-width:0}
  .ws-handle{flex:none;cursor:grab;color:#6d737e;user-select:none;font-size:15px;line-height:1;padding:7px 3px;touch-action:none}
  .ws-handle:active{cursor:grabbing}
  .ws-handle:hover{color:#fff}
  .ws-handle.sm{font-size:14px;padding:6px 2px}
  .ws-x,.ws-mini{background:transparent;border:none;color:#6d737e;cursor:pointer;font-size:13px;padding:5px 6px;border-radius:6px;flex:none}
  .ws-x:hover,.ws-mini:hover{color:#fff;background:rgba(255,255,255,.08)}
  .ws-ta{width:100%;resize:none;overflow:hidden;line-height:1.45;min-height:36px}
  .ws-h{width:100%;font-size:17px;font-weight:700}
  .ws-tree{list-style:none;margin:0;padding:0}
  .ws-sub{margin-left:18px;border-left:1px solid #2c3037;padding-left:6px}
  .ws-nrow{display:flex;flex-wrap:wrap;align-items:center;gap:3px;padding:2px 0;border-radius:8px}
  .ws-nin{flex:1 1 220px;min-width:0;padding:6px 8px;font-size:14px}
  .ws-nta{resize:none;overflow:hidden;line-height:1.35;min-height:34px;font-family:inherit;overflow-wrap:anywhere;display:block}
  .ws-nright{display:contents}
  .ws-node.hid > .ws-nrow{opacity:.5}
  .ws-eye{opacity:.7}
  .ws-fbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0}
  .ws-fhint{font:600 11px var(--mono);color:var(--muted)}
  .ws-fpanel{background:#101216;border:1px solid #2c3037;border-radius:10px;padding:8px;margin-bottom:8px;display:flex;flex-direction:column;gap:8px}
  .ws-frow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .ws-fl{flex:0 0 84px;font:600 11px var(--mono);color:var(--muted)}
  .ws-frow .ws-in{flex:1 1 160px;padding:8px;font-size:16px}
  .ws-fc{background:#14161a;border:1px solid #30343b;color:var(--text);border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer}
  .ws-fc.on{background:var(--metal-hi);border-color:#7a818d;color:#fff}
  .ws-node.done > .ws-nrow .ws-nin{text-decoration:line-through;color:#6d737e}
  .ws-tog{flex:none;width:22px;background:none;border:none;color:#9aa3b2;cursor:pointer;font-size:14px;padding:4px 0}
  .ws-chk{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid #5b6270;background:rgba(0,0,0,.4);color:#04210f;font-size:13px;font-weight:800;cursor:pointer;padding:0;line-height:1}
  .ws-chk.on{background:linear-gradient(145deg,#4be08d,#1fa75c);border-color:#4be08d}
  .ws-cnt,.ws-hcnt{flex:none;font:600 11px var(--mono);color:var(--muted);background:#101216;border:1px solid #2c3037;border-radius:999px;padding:2px 7px}
  .ws-date{flex:none;background:#101216;border:1px solid #3a3f47;color:#c9d0db;border-radius:999px;padding:3px 8px;font:600 11px var(--mono);cursor:pointer;white-space:nowrap}
  .ws-date:hover{border-color:#7a818d;color:#fff}
  .ws-date.over{border-color:var(--red);color:var(--red)}
  .ws-node.done > .ws-nrow .ws-date{opacity:.5}
  .ws-lnk{flex:none;background:rgba(255,176,32,.12);border:1px solid rgba(255,176,32,.45);color:var(--amber);border-radius:8px;padding:2px 6px;font-size:12px;cursor:pointer;white-space:nowrap}
  .ws-lnk:hover{background:rgba(255,176,32,.22)}
  .ws-pd{font:600 11px var(--mono);color:var(--muted);white-space:nowrap}
  .ws-pd.over{color:var(--red)}
  .g-bar.meta{background:#f59e0b;color:#1a1200}
  .g-bar.agg{opacity:.55}
  .g-bar.late{outline:2px solid var(--red);outline-offset:-1px}
  .g-metarow{background:rgba(245,158,11,.07)}
  .g-metarow .g-title{font-weight:700}
  .g-dl{position:absolute;top:3px;bottom:3px;width:3px;background:var(--red);border-radius:2px;z-index:1}
  .ws-date.dl{border-color:#7a3b3b;color:#e8a0a0}
  .ws-date.dl.over{border-color:var(--red);color:var(--red)}
  .ws-metachip{color:#ffd37a}
  .ws-attbtn{flex:none;background:#14161a;border:1px solid #3a3f47;color:var(--text);border-radius:8px;padding:3px 8px;font-size:12px;cursor:pointer;white-space:nowrap}
  .ws-attbtn:hover{border-color:#7a818d;color:#fff}
  .ws-attbtn.has{color:var(--amber);border-color:rgba(255,176,32,.55)}
  .ws-atts{margin:4px 0 8px 52px;padding-left:8px;border-left:2px solid rgba(255,176,32,.35)}
  .ws-att{background:rgba(255,255,255,.03);border:1px solid #2c3037;border-radius:10px;padding:6px;margin-bottom:6px}
  .ws-att.done .ws-atitle{text-decoration:line-through;color:#6d737e}
  .ws-arow{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
  .ws-atitle{flex:1 1 120px;min-width:100px;font-weight:600}
  .ws-abody{margin-top:6px}
  .ws-addbtn{background:none;border:1px dashed #3a3f47;color:var(--muted);border-radius:8px;padding:6px 10px;font-size:12.5px;cursor:pointer;margin:6px 6px 0 0}
  .ws-addbtn:hover{color:#fff;border-color:#7a818d}
  .ws-add{display:flex;flex-wrap:wrap;align-items:center;margin-top:6px}
  .ws-empty{color:var(--muted);font-size:13px;padding:10px 2px}
  .ws-tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .ws-table{border-collapse:separate;border-spacing:3px;width:100%}
  .ws-table th,.ws-table td{padding:0;text-align:left;vertical-align:middle}
  .ws-table .ws-in{width:100%;min-width:90px}
  .ws-table th .ws-in{font-weight:700;background:#191c22}
  .ws-table .ws-rh{width:26px;min-width:26px;text-align:center}
  .ws-colhead{display:flex;align-items:center;gap:1px}
  .ws-dragging{opacity:.38}

  .ws-drop-after{box-shadow:0 3px 0 0 var(--amber)}

  tr.ws-drop-before td{box-shadow:0 -3px 0 0 var(--amber)}
  tr.ws-drop-after td{box-shadow:0 3px 0 0 var(--amber)}

  /* Gantt (nur Lesen) */

  .modal input[type=number]{width:100%;background:#101216;border:1px solid #30343b;color:var(--text);border-radius:8px;padding:10px;font-size:16px;font-family:inherit;margin-bottom:12px}

  .ws-wkbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 8px}

  .ws-wkhead.today{color:var(--amber)} .ws-wkhead.over{color:var(--red)}

  .ws-more.on{border-color:var(--amber);color:var(--amber)}

  .ws-lean.ws-inboxdoc .ws-node:not(.more) > .ws-nrow .ws-nright > :not(.ws-fobtn){display:none}

  /* Suche über alle Dokumente */
  .ws-gsearch{margin:4px 0 8px}

  .ws-gsres{margin-top:6px;max-height:50vh;overflow:auto;border:1px solid #30343b;border-radius:10px;background:#101216}

  .ws-gsw{font-size:11.5px;color:var(--muted,#8b93a1);text-decoration:none;display:inline-block}

  /* Fälligkeit, Deadline und Meta-Stern stehen immer sichtbar neben dem Text, auch in der schlanken Ansicht */
  .ws-dchips{display:inline-flex;gap:4px;align-items:center;flex:none;flex-wrap:wrap}
  .ws-dchips:empty{display:none}

  .ws-date.sub{border-style:dashed;color:#9aa3b2;cursor:default;opacity:.85}

  /* Menü statt 📅: der Kalender-Knopf bleibt unsichtbar im Hintergrund, alles liegt hinter ⋯ */
  .ws-nright > .ws-mini[data-wsact="link-menu"],.ws-block > .ws-x[data-wsact="head-menu"]{display:none !important}

@media(max-width:480px){.ws-block[data-kind="heading"]{flex-wrap:wrap}.ws-block[data-kind="heading"] > .ws-bbody{flex:1 1 calc(100% - 40px)}.ws-block[data-kind="heading"] > .ws-handle{order:0}.ws-block[data-kind="heading"] > .ws-plus,.ws-block[data-kind="heading"] > .ws-more,.ws-block[data-kind="heading"] > .ws-x{order:2}}

.navgrp button:hover{background:var(--hover)}
.navgrp .today-btn{border-left:1px solid var(--line);border-right:1px solid var(--line);padding:0 13px}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--muted);border-radius:50%;animation:sp .7s linear infinite;opacity:0;transition:opacity .2s}

.banner{background:#3a3115;color:#f5d98a;padding:7px 14px;font-size:calc(12.5px * var(--fs));border-bottom:1px solid #5b4b1b;display:none}

.view{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}

/* Woche / Tag */
.scroll{flex:1;overflow:auto;position:relative}
.wk-inner{min-width:var(--minw,0)}
.wk-sticky{position:sticky;top:0;z-index:6;background:var(--bg);border-bottom:1px solid var(--line)}

.dh{padding:6px 4px 6px 8px;border-left:1px solid var(--line2);display:flex;align-items:center;gap:6px;font-size:calc(12px * var(--fs));color:var(--muted)}
.dh .num{font-size:calc(20px * var(--fs));font-weight:300;color:var(--text);width:32px;height:32px;display:grid;place-items:center;border-radius:50%;cursor:pointer}
.dh.we .num,.dh.we{color:var(--muted)}

.hours{position:relative}
.hours span{position:absolute;right:8px;font-size:calc(10px * var(--fs));color:var(--muted);transform:translateY(-50%);background:var(--bg);padding:0 2px;white-space:nowrap}
.dcol{position:relative;border-left:1px solid var(--line2);
  background-image:linear-gradient(to bottom,var(--line) 1px,transparent 1px);background-size:100% var(--hour)}

.nowline{position:absolute;left:0;right:0;height:0;border-top:1.5px solid var(--red);z-index:4;pointer-events:none}

.nowlabel{position:absolute;right:6px;transform:translateY(-50%);background:var(--red);color:#fff;font-size:calc(10px * var(--fs));font-weight:600;padding:1px 4px;border-radius:4px;z-index:5;pointer-events:none}

.evt{position:absolute;border-radius:5px;padding:2px 5px 2px 7px;font-size:calc(11px * var(--fs));line-height:1.25;overflow:hidden;cursor:pointer;
  background:color-mix(in srgb,var(--c) var(--bg-pct),var(--bg-base));color:color-mix(in srgb,var(--c) var(--tx-pct),var(--tx-base));

.evt:hover{filter:brightness(.97)}

/* Monat */
.mhead{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line);flex:none}

/* Jahr */
.yscroll{flex:1;overflow:auto;padding:14px 18px 24px}
.ygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px 24px;max-width:1200px;margin:0 auto}

/* Popover */
.pop{position:fixed;z-index:60;width:300px;max-width:calc(100vw - 20px);background:var(--bg);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px 14px 18px;border-left:5px solid var(--c);display:none}

.pop .sub{color:var(--muted);font-size:calc(12.5px * var(--fs));margin-bottom:8px}
.pop .row{margin:6px 0;font-size:calc(13px * var(--fs));display:flex;gap:8px;align-items:baseline}
.pop .row .k{color:var(--muted);width:20px;flex:none;font-size:calc(11px * var(--fs))}
.pop .desc{white-space:pre-wrap;max-height:130px;overflow:auto;font-size:calc(12.5px * var(--fs));color:var(--text);opacity:.9}
.pop a{color:#0a84ff;text-decoration:none}
.pop a:hover{text-decoration:underline}
.pop .calname{display:flex;align-items:center;gap:6px;font-size:calc(12px * var(--fs));color:var(--muted);margin-top:8px}
.pop .calname i{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}

@media (min-width:801px){:host(.hide-side) .sidebar{display:none}}
.fsgrp button{min-width:30px}
.fsgrp .fsval{min-width:48px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
/* mobil */
.only-m{display:none}

}

const KAL_TPL=`<div class="app">

const MONTHS=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const MON_S=['JAN','FEB','MÄR','APR','MAI','JUN','JUL','AUG','SEP','OKT','NOV','DEZ'];
const DOW=['Mo','Di','Mi','Do','Fr','Sa','So'];
const DOW_L=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
let SH=null,HOST=null;
const $=s=>SH.querySelector(s);

/* Datumshilfen */
const sod=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const dow=d=>(d.getDay()+6)%7;
const startOfWeek=d=>addDays(sod(d),-dow(d));
const sameDay=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
const pad=n=>String(n).padStart(2,'0');
const fmtT=d=>pad(d.getHours())+':'+pad(d.getMinutes());
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/864e5+1)/7)}
function parseDate(s){const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* Zustand */
let view=localStorage.getItem('kal_view')||(innerWidth<800?'month':'week');
let cursor=sod(new Date());
let calendars=[];
let hidden=new Set(JSON.parse(localStorage.getItem('kal_hidden')||'null')||[]);
let hiddenInit=localStorage.getItem('kal_hidden')!==null;
let store=new Map();      // key calId|evId|start -> Event
let loaded=new Set();     // calId|from|to
let rid=0, firstScroll=true, calsLoaded=false, lastScroll={t:null,l:0};
let userMail='';
const FS_STEPS=[0.8,0.9,1,1.1,1.25,1.4,1.6,1.8];
let FS=parseFloat(localStorage.getItem('kal_fs'))||1;
const hourPx=()=>Math.round(48*FS);
function applyFS(){
  if(!HOST)return;
  HOST.style.setProperty('--fs',FS);HOST.style.setProperty('--hour',hourPx()+'px');
  const v=$('#fsVal');if(v)v.textContent=Math.round(FS*100)+' %';
}

/* Daten laden */
function normalize(e,cal){
  if(!e.start||!e.end)return null;
  if(e.status==='cancelled')return null;
  if(e.attendees){const me=e.attendees.find(a=>a.self);if(me&&me.responseStatus==='declined')return null}
  const allDay=!!e.start.date;
  const s=allDay?parseDate(e.start.date):new Date(e.start.dateTime);
  const en=allDay?parseDate(e.end.date):new Date(e.end.dateTime);
  return {id:e.id,calId:cal.id,title:e.summary||'(Ohne Titel)',allDay,start:s,end:en,color:cal.color,location:e.location||'',
    desc:e.description||'',link:e.htmlLink||'',meet:e.hangoutLink||'',calName:cal.name,tentative:e.attendees&&e.attendees.some(a=>a.self&&a.responseStatus==='tentative')};
}
async function loadCalendars(){
  const r=await api('https://www.googleapis.com/calendar/v3/users/me/calendarList?maxResults=250&fields=items(id,summary,summaryOverride,backgroundColor,selected,primary)');
  calendars=((r&&r.items)||[]).map(c=>({id:c.id,name:c.summaryOverride||c.summary||c.id,color:c.backgroundColor||'#007aff',selected:c.selected!==false,primary:!!c.primary}));
  if(!hiddenInit){calendars.forEach(c=>{if(!c.selected)hidden.add(c.id)});hiddenInit=true;saveHidden()}
  calsLoaded=true;
}
const saveHidden=()=>localStorage.setItem('kal_hidden',JSON.stringify([...hidden]));
function range(){
  if(view==='day'){const a=sod(cursor);return [a,addDays(a,1)]}
  if(view==='week'){const a=startOfWeek(cursor);return [a,addDays(a,7)]}
  if(view==='year'){return [new Date(cursor.getFullYear(),0,1),new Date(cursor.getFullYear()+1,0,1)]}
  const f=new Date(cursor.getFullYear(),cursor.getMonth(),1);const gs=startOfWeek(f);
  const last=new Date(cursor.getFullYear(),cursor.getMonth()+1,0);const rows=Math.ceil((dow(f)+last.getDate())/7);
  return [gs,addDays(gs,rows*7)];
}
async function ensureLoaded(from,to){
  const jobs=calendars.filter(c=>!hidden.has(c.id)).map(async c=>{
    const key=c.id+'|'+from.getTime()+'|'+to.getTime();
    if(loaded.has(key))return;
    let list=[];
    {
      let pt='';
      do{
        const u='https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(c.id)+'/events?singleEvents=true&orderBy=startTime&maxResults=2500&timeMin='+encodeURIComponent(from.toISOString())+'&timeMax='+encodeURIComponent(to.toISOString())+(pt?'&pageToken='+pt:'');
        const j=await api(u);
        (j.items||[]).forEach(e=>{const n=normalize(e,c);if(n)list.push(n)});
        pt=j.nextPageToken||'';
      }while(pt);
    }
    list.forEach(e=>store.set(c.id+'|'+e.id+'|'+e.start.getTime(),e));
    loaded.add(key);
  });
  await Promise.all(jobs);
}
function eventsOn(d){
  const d0=sod(d),d1=addDays(d0,1);const out=[];
  store.forEach(e=>{
    if(hidden.has(e.calId))return;
    if(e.start<d1&&(e.end>d0||(e.end.getTime()===e.start.getTime()&&e.start>=d0)))out.push(e);
  });
  return out;
}
const byTime=(a,b)=>a.start-b.start||b.end-a.end||a.title.localeCompare(b.title);

/* Rendering */
function setTitle(){
  const t=$('#title');
  if(view==='year'){t.innerHTML='<b>'+cursor.getFullYear()+'</b>';return}
  if(view==='day'){t.innerHTML='<b>'+cursor.getDate()+'. '+MONTHS[cursor.getMonth()]+'</b> '+cursor.getFullYear()+'<small>'+DOW_L[dow(cursor)]+'</small>';return}
  if(view==='week'){
    const a=startOfWeek(cursor),b=addDays(a,6);
    let s='<b>'+MONTHS[a.getMonth()]+'</b> '+a.getFullYear();
    if(a.getMonth()!==b.getMonth())s='<b>'+MON_S[a.getMonth()].charAt(0)+MON_S[a.getMonth()].slice(1).toLowerCase()+' / '+MONTHS[b.getMonth()]+'</b> '+b.getFullYear();
    t.innerHTML=s+'<small>KW '+isoWeek(addDays(a,3))+'</small>';return}
  t.innerHTML='<b>'+MONTHS[cursor.getMonth()]+'</b> '+cursor.getFullYear();
}
function drawMini(){
  const m=new Date(cursor.getFullYear(),cursor.getMonth(),1);const gs=startOfWeek(m);const today=sod(new Date());
  let h='<div class="mini-head"><span><b>'+MONTHS[m.getMonth()]+'</b> '+m.getFullYear()+'</span><span><button data-mn="-1">‹</button><button data-mn="1">›</button></span></div><div class="mini-grid"><span class="wd"></span>';
  ['M','D','M','D','F','S','S'].forEach(x=>h+='<span class="wd">'+x+'</span>');
  for(let r=0;r<6;r++){
    h+='<span class="kw">'+isoWeek(addDays(gs,r*7+3))+'</span>';
    for(let c=0;c<7;c++){
      const d=addDays(gs,r*7+c);
      const cls=['md'];if(d.getMonth()!==m.getMonth())cls.push('out');if(sameDay(d,today))cls.push('today');if(sameDay(d,cursor))cls.push('sel');
      h+='<button class="'+cls.join(' ')+'" data-d="'+d.getTime()+'">'+d.getDate()+'</button>';
    }
  }
  $('#mini').innerHTML=h+'</div>';
}
function drawCalList(){
  $('#calList').innerHTML=calendars.map(c=>'<button class="cal-row'+(hidden.has(c.id)?'':' on')+'" style="--c:'+esc(c.color)+'" data-c="'+esc(c.id)+'"><span class="box"></span><span class="n">'+esc(c.name)+'</span></button>').join('');
}
function evK(e){return 'data-k="'+esc(e.calId+'|'+e.id+'|'+e.start.getTime())+'"'}
function evAttr(e){return evK(e)+' style="--c:'+esc(e.color)+'"'}

function layoutCols(items){
  items.sort((a,b)=>a.s-b.s||b.e-a.e);
  const out=[];let cl=[],clEnd=0;
  const flush=()=>{const cols=[];cl.forEach(it=>{let i=cols.findIndex(end=>end<=it.s);if(i<0){i=cols.length;cols.push(0)}cols[i]=it.e;it.col=i});cl.forEach(it=>it.cols=cols.length);out.push(...cl);cl=[]};
  items.forEach(it=>{if(cl.length&&it.s>=clEnd){flush();clEnd=0}cl.push(it);clEnd=Math.max(clEnd,it.e)});
  if(cl.length)flush();
  return out;
}
function drawWeekDay(){
  const days=view==='day'?[sod(cursor)]:Array.from({length:7},(_,i)=>addDays(startOfWeek(cursor),i));
  const n=days.length,today=sod(new Date()),H=hourPx();

    });
    if(sameDay(d,now)){const y=(now.getHours()*60+now.getMinutes())/60*H;body+='<div class="nowline" style="top:'+y+'px"></div>'}
    body+='</div>';
  });

  body+='</div>';

  v.innerHTML='<div class="scroll"><div class="wk-inner" style="--minw:'+minw+'px"><div class="wk-sticky">'+head+'</div>'+body+'</div></div>';

}

    else break;
  }
  return n;
}

function parseDeadlineFromNotes(notes){
  if(!notes) return null;
  return null; // Deadlines kommen nur noch aus den Punkten des Arbeitsbereichs
}

function daysUntilDeadline(deadline){
  if(!deadline) return null;
  const today = new Date();
  today.setHours(0,0,0,0);
  const dl = new Date(deadline+"T00:00:00");
  const diff = Math.ceil((dl - today)/(1000*60*60*24));
  return diff;
}

function deadlineColor(days){
  if(days===null) return "#3b82f6"; // hellblau - keine deadline
  if(days<0) return "#ef4444";      // rot - überfällig
  if(days<=3) return "#ef4444";     // rot - ab 3 Tage vor Deadline
  if(days<=7) return "#f97316";     // orange - 4-7 Tage
  return "#4ade80";                 // grün - >7 tage
}

function deadlineLabel(days){
  if(days===null) return "–";
  if(days<0) return `überfällig ${Math.abs(days)}d`;
  if(days===0) return "heute";
  if(days===1) return "morgen";
  return `${days}d`;
}

function scheduleLabel(t){
  const timeStr=t.startTime?` · ${t.startTime} Uhr`:"";
  if(t.type==="habit") return "täglich";
  if(t.type==="duty"){
    return {daily:"täglich",every2days:"alle 2 Tage",weekly:"wöchentlich"}[t.scheduleType]||t.scheduleType
      + (t.startDate?` · ab ${t.startDate}`:"") + timeStr;
  }
  if(t.type==="todo"){
    if(t.scheduleType==="weekly"){ const wd=parseDate(t.startDate); return "jeden "+WEEKDAYS[wd?wd.getDay():0]+timeStr; }
    return (t.startDate||"")+timeStr;
  }
  return "";
}

/* ============ GOOGLE OAUTH ============ */
function initTokenClient(){
  try{
    console.log("🔧 Initialisiere tokenClient mit CLIENT_ID:", CLIENT_ID.slice(0,20)+"...");
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID, scope: SCOPES,
      callback: (resp)=>{
        console.log("📱 Token Callback:", resp);
        if(resp && resp.access_token){ accessToken=resp.access_token; if(tokenResolve) tokenResolve(resp); }
        else if(tokenReject) tokenReject(resp);
        tokenResolve=tokenReject=null;
      },
      error_callback: (err)=>{ console.error("❌ Token Fehler:", err); if(tokenReject) tokenReject(err); tokenResolve=tokenReject=null; }
    });
    console.log("✅ tokenClient initialisiert:", tokenClient);
  }catch(e){ console.error("❌ tokenClient init failed:", e); tokenClient=null; }
}
function requestToken(interactive){
  if(!tokenClient){ return Promise.reject(new Error("tokenClient not initialized")); }
  return new Promise((res,rej)=>{ tokenResolve=res; tokenReject=rej;
    // Kein erzwungenes "consent" mehr: Google zeigt den Zustimmungs-Bildschirm
    // nur beim ersten Mal. Danach meist lautlos oder mit kurzer Kontobestätigung.
    try{ tokenClient.requestAccessToken({prompt: ""}); }
    catch(e){ rej(e); } });
}

/* ============ GOOGLE-API-AUFRUFE ============ */
async function api(url, opts={}, retried=false){
  opts.headers = Object.assign({Authorization:"Bearer "+accessToken,"Content-Type":"application/json"}, opts.headers||{});
  const r = await fetch(url, opts);
  if(r.status===401 && !retried){
    console.log("🔄 Token abgelaufen, versuche zu erneuern...");
    try{ 
      await requestToken(false); // Erst silent
    }catch(e){ 
      console.log("  Silent fehlgeschlagen, frage interaktiv");
      toast("Bitte melden Sie sich erneut an");
      await requestToken(true); // Dann mit Popup
    }
    return api(url, opts, true);
  }
  if(!r.ok){ const txt=await r.text(); throw new Error("API "+r.status+": "+txt); }
  if(r.status===204) return null;
  return r.json();
}

async function loadTodayCalendarEvents(){
  try{
    const today = new Date();
    today.setHours(0,0,0,0);
    const tomorrow = new Date(today);
    tomorrow.setDate(tomorrow.getDate() + 1);
    
    const timeMin = today.toISOString();
    const timeMax = tomorrow.toISOString();
    
    const visibleIds = getVisibleCalendarIds();
    
    todayCalendarEvents = [];
    
    const sourceCalendars = (allCalendars && allCalendars.length) ? allCalendars : calendars;
    if(!sourceCalendars || sourceCalendars.length === 0){
      return;
    }
    
    for(const cal of sourceCalendars){
      const isAllowed = cal.primary || visibleIds.includes(cal.id);
      
      if(!isAllowed) continue;
      
      try{
        const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(cal.id)}/events?timeMin=${encodeURIComponent(timeMin)}&timeMax=${encodeURIComponent(timeMax)}&singleEvents=true&maxResults=100`;
        const res = await api(url);
        
        if(res.items){
          res.items.forEach(e => {
            todayCalendarEvents.push({
              id: e.id,
              title: e.summary || "(ohne Titel)",
              start: new Date(e.start.dateTime || e.start.date),
              end: new Date(e.end.dateTime || e.end.date),
              allDay: !e.start.dateTime,
              calendarName: cal.summary
            });
          });
        }
      }catch(err){
        console.warn("Event von Calendar", cal.summary, "nicht abrufbar", err);
      }
    }
    
    todayCalendarEvents.sort((a,b) => a.start - b.start);
    
  }catch(e){
    console.error("❌ Kalender laden:", e);
    todayCalendarEvents = [];
  }
}
async function loadGTasks(){
  try{
    const lists=await api(`${GTASKS}/users/@me/lists?maxResults=100`);
    const listItems=(lists && lists.items)||[];
    const defaultList=listItems[0]; // erste Liste = Standardliste "Meine Aufgaben"
    if(!defaultList){ gtasks=[]; goalTasks=[]; allOpenGoals=[]; allGTasks=[]; gtasksLoadedOk=false; return; }
    defaultGTaskListId=defaultList.id;
    const today=todayKey();
    // 1) Offene Aufgaben
    // Alle Seiten laden (Google liefert höchstens 100 pro Abruf), sonst fehlen bei vielen Aufgaben einzelne, z. B. Metaprojekte
    let openRaw=[], pageTok="";
    for(let pg=0; pg<10; pg++){
      const resOpen=await api(`${GTASKS}/lists/${encodeURIComponent(defaultGTaskListId)}/tasks?showCompleted=false&maxResults=100`+(pageTok?`&pageToken=${encodeURIComponent(pageTok)}`:""));
      openRaw=openRaw.concat((resOpen && resOpen.items)||[]);
      pageTok=(resOpen && resOpen.nextPageToken)||"";
      if(!pageTok) break;
    }
    const openItems=openRaw.filter(t=>t.status!=="completed");
    // 2) Heute erledigte Aufgaben (für die Ziel-Grafik)
    const startISO=new Date(today+"T00:00:00").toISOString();
    const resDone=await api(`${GTASKS}/lists/${encodeURIComponent(defaultGTaskListId)}/tasks?showCompleted=true&showHidden=true&completedMin=${encodeURIComponent(startISO)}&maxResults=100`);
    const doneItems=((resDone && resDone.items)||[]).filter(t=>t.status==="completed");
    // Grüne Sektion: offene, heute fällige oder überfällige (inkl. Ziele)
    gtasks=openItems.filter(t=>t.due && t.due.slice(0,10)<=today)
      .map(t=>{
        t.deadline=parseDeadlineFromNotes(t.notes);
        t.deadlineDays=t.deadline?daysUntilDeadline(t.deadline):null;
        return t;
      });
    
    // Alle offenen Tasks (für Deadlines-Rubrik)
    allGTasks=openItems.map(t=>{
      t.deadline=parseDeadlineFromNotes(t.notes);
      if(t.due) t.deadlineDays=t.deadline?daysUntilDeadline(t.deadline):null;
      return t;
    });
    // Ziele: ALLE mit Marker (offene + heute erledigte jeweils), aber filtern nur heute für Anzeige
    allOpenGoals=openItems.filter(t=>isGoalTask(t) && t.due)
      .map(t=>({id:t.id, title:t.title||"(ohne Titel)", completed:false, due:t.due.slice(0,10)}));
    const allDoneGoals=doneItems.filter(t=>isGoalTask(t) && t.due)
      .map(t=>({id:t.id, title:t.title||"(ohne Titel)", completed:true, due:t.due.slice(0,10)}));
    // Für Heute-Ansicht und Ziele-Tab: nur heutige Ziele
    const openGoalsToday=allOpenGoals.filter(t=>t.due===today);
    const doneGoalsToday=allDoneGoals.filter(t=>t.due===today);
    goalTasks=[...openGoalsToday, ...doneGoalsToday];
    console.log("  ✓ loadGTasks: grün",gtasks.length,"| Ziele heute",goalTasks.length,"(",doneGoalsToday.length,"erledigt)");
    gtasksLoadedOk=true;
  }catch(e){
    console.error("❌ loadGTasks Fehler:",e.message);
    gtasksLoadedOk=false;
    gtasks=[]; goalTasks=[]; allOpenGoals=[]; allGTasks=[];
  }
}

async function completeGTask(taskId){
  setSync("busy");
  try{
    const gt=gtasks.find(t=>t.id===taskId);
    const goal=gt?isGoalTask(gt):goalTasks.some(g=>g.id===taskId);
    const listId=defaultGTaskListId||"@default";
    await api(`${GTASKS}/lists/${encodeURIComponent(listId)}/tasks/${encodeURIComponent(taskId)}`, {
      method:"PATCH", body:JSON.stringify({status:"completed"})
    });
    // Normale Aufgaben zusätzlich als Schatten-Eintrag im Sheet anlegen (für Anzeige/Referenz)
    if(gt && !goal){
      const protoId="gt_"+taskId;
      const dueKey=gt.due?gt.due.slice(0,10):todayKey();
      if(!tasks.some(t=>t.id===protoId)){
        tasks.push({
          id:protoId, type:"todo", title:gt.title||"(ohne Titel)",
          scheduleType:"", startDate:dueKey, weekday:"",
          syncCalendar:false, calendarEventId:"",
          notes:(gt.notes||"")+(gt.notes?" ":"")+"[aus Google Tasks]",
          createdAt:new Date().toISOString(), archived:true,
          calendarId:"", startTime:"", projectId:""
        });
        await saveTasks();
      }
    }
    // Log-Eintrag für den Tageszähler: für ALLE erledigten Google Tasks, auch Tagesziele
    {
      const logItemId = (gt && !goal) ? "gt_"+taskId : taskId;
      if(!logs.some(l=>l.itemId===logItemId)){
        logs.push({itemId:logItemId, date:todayKey(), doneAt:new Date().toISOString()});
        await saveLogs();
      }
    }
    wsOnItemDone("goal", taskId, true);
    await loadGTasks();
    render(); setSync("on");
  }catch(e){
    console.error("❌ completeGTask Fehler:",e.message);
    alert("Abhaken fehlgeschlagen:\n"+e.message);
    setSync("on");
  }
}

function colLetter(n){ let s=""; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=(n-m-1)/26; } return s; }

  const values=tasks.map(t=>TASK_COLS.map(c=>{

  }));
  if(values.length) await api(`${SHEETS}/${spreadsheetId}/values/Tasks!A2?valueInputOption=RAW`,

let _saveLogsQueue = Promise.resolve();
function saveLogs(){
  // Alle Aufrufe strikt nacheinander ausführen, nie gleichzeitig, sonst können sich
  // parallele Speichervorgänge gegenseitig überschreiben (siehe Vorfall vom 12.09.2026).
  const run = _saveLogsQueue.then(()=>_saveLogsInner());
  _saveLogsQueue = run.catch(e=>{ console.error("❌ saveLogs (Warteschlange):",e.message); });
  return run;
}
async function _saveLogsInner(){
  const logKey = l => l.itemId+"|"+l.date;

  // 1) Aktuellen Serverstand holen, NICHT blind vom lokalen Speicher ausgehen
  let serverLogs = [];
  try{
    const res = await api(`${SHEETS}/${spreadsheetId}/values/Log!A2:C10000`);
    const rows = (res && res.values) || [];
    rows.forEach(row=>{
      const l={};
      LOG_COLS.forEach((col,i)=>l[col]=row[i]||"");
      if(l.itemId && l.date) serverLogs.push(l);
    });
  }catch(e){
    console.error("❌ saveLogs: Serverstand konnte nicht gelesen werden, breche ab um nichts zu überschreiben:",e.message);
    throw e;
  }

  // 2) Was hat sich seit dem letzten Laden LOKAL geändert?
  const snapshotKeys = new Set(logsSnapshotAtLoad.map(logKey));
  const currentKeys = new Set(logs.map(logKey));
  const addedLocally = logs.filter(l=>!snapshotKeys.has(logKey(l)));
  const removedLocally = logsSnapshotAtLoad.filter(l=>!currentKeys.has(logKey(l)));
  const removedKeys = new Set(removedLocally.map(logKey));

  // 3) Serverstand als Basis nehmen, lokale Änderungen darauf anwenden
  const merged = serverLogs.filter(l=>!removedKeys.has(logKey(l)));
  const mergedKeys = new Set(merged.map(logKey));
  addedLocally.forEach(l=>{ if(!mergedKeys.has(logKey(l))){ merged.push(l); mergedKeys.add(logKey(l)); } });

  // 4) Ergebnis schreiben und als neuen lokalen Stand übernehmen
  await api(`${SHEETS}/${spreadsheetId}/values/Log!A2:C10000:clear`,{method:"POST",body:"{}"});
  const values=merged.map(l=>LOG_COLS.map(c=>l[c]||""));
  if(values.length) await api(`${SHEETS}/${spreadsheetId}/values/Log!A2?valueInputOption=RAW`,
    {method:"PUT",body:JSON.stringify({values})});

  logs = merged;
  logsSnapshotAtLoad = merged.map(l=>({...l}));
}

async function loadLogs(){
  logs=[];
  try{
    const res=await api(`${SHEETS}/${spreadsheetId}/values/Log!A2:C10000`);
    const rows=(res && res.values)||[];

      if(l.itemId) logs.push(l);

    logsSnapshotAtLoad = logs.map(l=>({...l}));
  }catch(e){

  }
}

/* ============ KALENDER-SYNC ============ */
function rruleFor(t){
  if(t.type==="habit") return ["RRULE:FREQ=DAILY"];
  if(t.type==="duty"){
    if(t.scheduleType==="daily") return ["RRULE:FREQ=DAILY"];
    if(t.scheduleType==="every2days") return ["RRULE:FREQ=DAILY;INTERVAL=2"];
    if(t.scheduleType==="weekly") return ["RRULE:FREQ=WEEKLY"];
  }
  if(t.type==="todo" && t.scheduleType==="weekly") return ["RRULE:FREQ=WEEKLY"];
  return null; // einmalig
}
function nextDayKey(key){ const d=parseDate(key); d.setDate(d.getDate()+1); return dateKey(d); }
function eventBody(t){
  const start=t.startDate||todayKey();
  let body;
  if(t.startTime){
    const tz=Intl.DateTimeFormat().resolvedOptions().timeZone;
    const [h,m]=(t.startTime+"").split(":");
    const startHour=parseInt(h),startMin=parseInt(m);
    const endHour=startHour+1;
    let endDate=start,endHourStr=String(endHour).padStart(2,"0"),endMinStr=String(startMin).padStart(2,"0");
    if(endHour>=24){ 
      const d=new Date(parseDate(start)); d.setDate(d.getDate()+1);
      endDate=dateKey(d); endHourStr="00";
    }
    const startDT=start+"T"+t.startTime+":00", endDT=endDate+"T"+endHourStr+":"+endMinStr+":00";
    body={summary:t.title, start:{dateTime:startDT,timeZone:tz}, end:{dateTime:endDT,timeZone:tz}};
  }else{
    body={summary:t.title, start:{date:start}, end:{date:nextDayKey(start)}};
  }
  const rr=rruleFor(t); if(rr) body.recurrence=rr;
  return body;
}
async function syncCalendar(t){
  const url=calUrl(effectiveCalId(t));
  try{
    if(t.syncCalendar){
      if(t.calendarEventId){
        await api(`${url}/${t.calendarEventId}`,{method:"PUT",body:JSON.stringify(eventBody(t))});
      }else{
        const ev=await api(url,{method:"POST",body:JSON.stringify(eventBody(t))});
        t.calendarEventId=ev.id;
      }
    }else if(t.calendarEventId){
      await api(`${url}/${t.calendarEventId}`,{method:"DELETE"});
      t.calendarEventId="";
    }
  }catch(e){ console.warn("Kalender-Sync fehlgeschlagen:",e); alert("Kalender-Sync fehlgeschlagen:\n"+(e&&e.message?e.message:e)); }
}
async function deleteCalendar(t){
  if(t.calendarEventId){ try{ await api(`${calUrl(effectiveCalId(t))}/${t.calendarEventId}`,{method:"DELETE"}); }catch(e){} }
}

async function moveCalendarIfNeeded(t, oldCalId, oldEventId){
  if(oldEventId && effectiveCalId(t)!==oldCalId){
    try{ await api(`${calUrl(oldCalId)}/${oldEventId}`,{method:"DELETE"}); }catch(e){}
    t.calendarEventId="";
  }
}

async function purgeStaleGoals(){
  const today=todayKey();
  const stale=tasks.filter(t=>t.type==="goal" && (t.startDate||"")!==today);
  if(!stale.length) return false;
  // Verknüpfte Kalendertermine der abgelaufenen Ziele entfernen
  for(const g of stale){ if(g.calendarEventId){ try{ await deleteCalendar(g); }catch(e){} } }
  const ids=new Set(stale.map(t=>t.id));
  tasks=tasks.filter(t=>!ids.has(t.id));
  logs=logs.filter(l=>!ids.has(l.itemId));
  await saveTasks(); await saveLogs();
  return true;
}
async function toggleDone(id, key){
  setSync("busy");
  if(key==="once"){
    // Einmaliges ToDo: Erledigung dauerhaft (nicht datumsgebunden)
    if(isEverDone(id)) logs=logs.filter(l=>l.itemId!==id);
    else logs.push({itemId:id,date:todayKey(),doneAt:new Date().toISOString()});
  }else{
    if(isDone(id,key)) logs=logs.filter(l=>!(l.itemId===id&&l.date===key));
    else logs.push({itemId:id,date:key,doneAt:new Date().toISOString()});
  }
  if(key==="once") wsOnItemDone("todo", id, isEverDone(id));
  render();
  await saveLogs();
  setSync("on");
}

function buildCumulativeGraph(data, maxCum){
  const w=630, h=270, pad=60;
  const graphW=w-2*pad, graphH=h-2*pad;
  const xs=data.map((d,i)=>pad + (i/(data.length-1))*graphW);
  const ys=data.map(d=>h-pad - (d.total/maxCum)*graphH);
  
  // Polygon für die Fläche
  let pathD=`M ${xs[0]} ${h-pad}`;
  for(let i=0; i<xs.length; i++) pathD+=` L ${xs[i]} ${ys[i]}`;
  pathD+=` L ${xs[xs.length-1]} ${h-pad} Z`;
  
  // Y-Achsenlabel
  const yTicks=[0, Math.ceil(maxCum/2), maxCum];
  let yLabels='';
  yTicks.forEach(v=>{
    const yy=h-pad - (v/maxCum)*graphH;
    yLabels+=`<text x="${pad-12}" y="${yy+6}" font-size="13" text-anchor="end" fill="#888">${v}</text>`;
  });
  
  // X-Achsenlabel (nur Start und Ende)
  const fmt=(k)=>new Date(k).toLocaleDateString("de-DE",{day:"numeric",month:"short"});
  const xLabels=`<text x="${xs[0]}" y="${h-12}" font-size="11" text-anchor="middle" fill="#888">${fmt(data[0].k)}</text>
    <text x="${xs[xs.length-1]}" y="${h-12}" font-size="11" text-anchor="middle" fill="#888">${fmt(data[data.length-1].k)}</text>`;
  
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:270px;margin-bottom:2px">
    <defs><linearGradient id="gradgreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0.1" /></linearGradient></defs>
    <!-- Gitterlinien -->
    ${yTicks.map(v=>`<line x1="${pad}" x2="${w-pad}" y1="${h-pad-(v/maxCum)*graphH}" y2="${h-pad-(v/maxCum)*graphH}" stroke="#333" stroke-width="0.5" opacity="0.2"/>`).join('')}
    <!-- Achsen -->
    <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${h-pad}" stroke="#555" stroke-width="2"/>
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="#555" stroke-width="2"/>
    <!-- Fläche -->
    <path d="${pathD}" fill="url(#gradgreen)" stroke="#16a34a" stroke-width="3" stroke-linejoin="round"/>
    <!-- Labels -->
    ${yLabels}
    ${xLabels}
  </svg>`;
}
function statBars(items, color){
  const max=Math.max(1, ...items.map(i=>i.value));
  return items.map(i=>{
    const w=Math.round((i.value/max)*100);

function pieBlock(done,total){
  const f = total ? done/total : 0;
  const pct = Math.round(f*100);
  const cx=70, cy=70, r=60;
  let wedge;
  if(f<=0) wedge=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--red)"/>`;
  else if(f>=1) wedge=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--green)"/>`;
  else{
    const a0=-Math.PI/2, a1=a0+f*2*Math.PI;
    const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0);
    const x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
    const large=f>0.5?1:0;
    wedge=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--red)"/>`+
      `<path d="M${cx} ${cy} L${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z" fill="var(--green)"/>`;
  }
  return `<div class="pie-wrap">
    <svg viewBox="0 0 140 140" width="104" height="104" role="img" aria-label="${pct} Prozent erreicht">${wedge}</svg>
    <div class="pie-pct">${pct}%</div>
    <div class="pie-sub">${done} von ${total} erreicht</div>
    <div class="legend"><span><i class="lg green"></i>erledigt</span><span><i class="lg red"></i>unerledigt</span></div>
  </div>`;
}

function urgencyDays(startDate){
  if(!startDate) return 999;
  const due=parseDate(startDate), today=new Date();
  const d=Math.floor((due-today)/86400000);
  return Math.max(0,d);
}
function urgencyBar(d){
  if(d>3) return "";

  return `<div style="height:4px;background:#4caf50;width:${pct}%;margin-top:4px;border-radius:2px"></div>`;
}
function sortTasksForToday(tasks,key){
  const open=[],done=[];
  tasks.forEach(t=>{
    const d = t.type==="todo" ? isEverDone(t.id) : isDone(t.id,key);
    (d?done:open).push(t);
  });
  const withDate=open.filter(t=>t.startDate).sort((a,b)=>urgencyDays(a.startDate)-urgencyDays(b.startDate));
  const noDate=open.filter(t=>!t.startDate);
  console.log("sortTasksForToday: open=",open.length,"done=",done.length,"withDate=",withDate.length,"noDate=",noDate.length);
  open.forEach((t,i)=>console.log(`  open[${i}]:`,t.type,t.title,"startDate=",t.startDate));
  noDate.forEach((t,i)=>console.log(`  noDate[${i}]:`,t.type,t.title));
  const result=[...withDate,...noDate,...done];
  console.log("sortTasksForToday result order:",result.map((t,i)=>`${i}:${t.type}(${t.title.substring(0,10)})`).join(" "));
  return result;
}

function sortTasksByDateAndTime(tasks){
  return tasks.sort((a,b)=>{
    if(!a.startDate && !b.startDate) return 0;
    if(!a.startDate) return 1;
    if(!b.startDate) return -1;
    const dateA=new Date(a.startDate).getTime();
    const dateB=new Date(b.startDate).getTime();
    if(dateA!==dateB) return dateA-dateB;
    const timeA=(a.startTime||'00:00').split(':').map(Number);
    const timeB=(b.startTime||'00:00').split(':').map(Number);
    const minA=timeA[0]*60+timeA[1], minB=timeB[0]*60+timeB[1];
    return minA-minB;
  });
}

// Alles wird aus den vorhandenen Logs berechnet: es gibt keine zusätzliche Speicherung, die auseinanderlaufen könnte.
const XP_PER_TASK=10, XP_QUEST_BONUS=50;
const RANKS=[[1,"Rekrut"],[3,"Lehrling"],[5,"Geselle"],[8,"Veteran"],[12,"Elite"],[17,"Meister"],[23,"Großmeister"],[30,"Legende"]];
function xpAtLevel(L){ return 50*(L-1)*L; }                    // Level 2 = 100 XP, 3 = 300, 4 = 600, 5 = 1000 ...
function levelFromXp(xp){ let L=1; while(xp>=xpAtLevel(L+1)) L++; return L; }
function rankName(L){ let n=RANKS[0][1]; for(const r of RANKS){ if(L>=r[0]) n=r[1]; } return n; }
const TROPHIES=[
  {id:"first",  icon:"🥉", name:"Erster Schritt",  desc:"1 Aufgabe erledigt",         test:g=>g.total>=1},

  {id:"lv10",   icon:"🌟", name:"Level 10",        desc:"Level 10 erreicht",          test:g=>g.level>=10}
];
let GAME=null, _lastXp=null, _lastLevel=null, _lastClick=0;
document.addEventListener("click",()=>{ _lastClick=Date.now(); },true);

function computeGame(){
  const perDay={}; let early=false;
  for(const l of logs){
    perDay[l.date]=(perDay[l.date]||0)+1;
    if(!early && l.doneAt){ const h=new Date(l.doneAt).getHours(); if(!isNaN(h) && h<7) early=true; }
  }
  const goal=Math.max(1,minTaskGoal);
  const total=logs.length;
  let questDays=0, best=0, run=0, prev=null;
  Object.keys(perDay).sort().forEach(k=>{
    if(perDay[k]>=goal){
      questDays++;
      run=(prev && diffDays(parseDate(prev),parseDate(k))===1)?run+1:1;
      prev=k; if(run>best) best=run;
    }
  });
  const todayCount=perDay[todayKey()]||0;
  const questDone=todayCount>=goal;
  const streak=taskStreak()+(questDone?1:0);
  const xp=total*XP_PER_TASK+questDays*XP_QUEST_BONUS;
  const level=levelFromXp(xp);
  const base=xpAtLevel(level), next=xpAtLevel(level+1);
  return {total,questDays,bestStreak:Math.max(best,streak),streak,todayCount,questDone,goal,xp,level,base,next,
          pct:Math.round((xp-base)/(next-base)*100),early,rank:rankName(level)};
}

function gameTick(){
  GAME=computeGame();
  const pill=$("lvPill"); if(pill) pill.textContent="LV "+GAME.level;
  const delta=_lastXp===null?0:GAME.xp-_lastXp;
  // Nur animieren, wenn die Erhöhung zu einer einzelnen, gerade angetippten Aktion passt (nicht beim Laden der Daten)
  const live=delta>0 && delta<=XP_PER_TASK+XP_QUEST_BONUS && (Date.now()-_lastClick)<20000;
  const earned=TROPHIES.filter(t=>t.test(GAME)).map(t=>t.id);
  let stored=null; try{ stored=JSON.parse(localStorage.getItem("trophies")||"null"); }catch(e){}
  const have=new Set(stored||[]);
  const fresh=earned.filter(id=>!have.has(id));
  if(fresh.length || stored===null){
    fresh.forEach(id=>have.add(id));
    try{ localStorage.setItem("trophies",JSON.stringify([...have])); }catch(e){}
  }
  if(live){
    xpFloat(delta);
    const up=_lastLevel!==null && GAME.level>_lastLevel;
    if(navigator.vibrate){ try{ navigator.vibrate(up?[30,40,60]:15); }catch(e){} }
    if(up) levelUp(GAME);
    if(stored!==null && fresh.length){
      const names=fresh.map(id=>TROPHIES.find(t=>t.id===id).name).join(", ");
      toast("🏆 Trophäe: "+names);
    }
  }
  _lastXp=GAME.xp; _lastLevel=GAME.level;
}

          <div class="body">

  else if(view==="habits"){
    const list=active.filter(t=>t.type==="habit");
    main.innerHTML=list.length?list.map(habitCard).join(""):empty("Noch keine Gewohnheiten. Mit + anlegen.");
  }
  else if(view==="duties"){
    const key=todayKey();
    const list=sortTasksByDateAndTime(active.filter(t=>t.type==="duty"));
    main.innerHTML=list.length?list.map(t=>taskCard(t,{showCheck:true, key:key})).join(""):empty("Noch keine Pflichtaufgaben. Mit + anlegen.");
  }
  else if(view==="todos"){
    const key=todayKey();
    const todos=active.filter(t=>t.type==="todo");
    // Sortiere: mit Termin (nach Datum+Uhrzeit) → ohne Termin → erledigte
    const withDate=todos.filter(t=>t.startDate && !isEverDone(t.id));
    const noDate=todos.filter(t=>!t.startDate && !isEverDone(t.id));
    const done=todos.filter(t=>isEverDone(t.id));
    withDate.sort((a,b)=>{
      const dateA=new Date(a.startDate).getTime();
      const dateB=new Date(b.startDate).getTime();
      if(dateA!==dateB) return dateA-dateB;
      const timeA=(a.startTime||'00:00').split(':').map(Number);
      const timeB=(b.startTime||'00:00').split(':').map(Number);
      const minA=timeA[0]*60+timeA[1], minB=timeB[0]*60+timeB[1];
      return minA-minB;
    });
    const list=[...withDate,...noDate,...done];
    main.innerHTML=`<div style="display:flex;justify-content:flex-end;margin-bottom:8px"><button class="mini" data-md-import="1">⬆ Markdown importieren</button></div>`+(list.length?list.map(t=>taskCard(t,{showCheck:true, key:key, oneTime:true})).join(""):empty("Noch keine ToDos. Mit + anlegen."));

  else if(view==="distractions"){

  else if(view==="goals"){

    const today=todayKey();
    const overdueGoals=allOpenGoals.filter(g=>g.due<today).sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:0);
    if(overdueGoals.length){

    }
    if(undatedGoals.length){

    // Kommende Tage: alle künftigen offenen Ziele, nach Datum
    const upcomingGoals={};
    allOpenGoals.filter(g=>g.due>today).sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:0).forEach(g=>{ (upcomingGoals[g.due]=upcomingGoals[g.due]||[]).push(g); });
    const hasUpcoming=Object.values(upcomingGoals).some(arr=>arr.length>0);
    if(hasUpcoming){

    logs.filter(l=>inRange(l.date,k30)).forEach(l=>{ const t=byId[l.itemId]; if(t&&byType[t.type]!=null) byType[t.type]++; });

    // Pro Tag (14 Tage)
    const perDay=[]; for(let i=13;i>=0;i--){ const k=keyDaysAgo(i); perDay.push({k, n:logs.filter(l=>l.date===k).length}); }
    const maxDay=Math.max(1,...perDay.map(d=>d.n));
    const goalsDone=goalTasks.filter(g=>g.completed).length, goalsTot=goalTasks.length;

    const card=(label,val)=>`<div style="flex:1;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center">

    // Kumulativer Fortschritt: letzte 10 Tage (mit Bilanz)

    for(let i=9;i>=0;i--){

      cum.push({k, n, summ, dayBilanz, total}); 
    }

    h+=`<div class="section-title">Nach Bereich (30 Tage)</div>`;

    h+= typeItems.some(i=>i.value)? statBars(typeItems,"var(--accent)") : `<div class="muted center" style="padding:8px">Noch keine Daten</div>`;

    h+=`<div class="section-title">Nach Projekt (30 Tage)</div>`;
    const projItems=Object.keys(byProj).map(n=>({label:n,value:byProj[n]})).sort((a,b)=>b.value-a.value).slice(0,8);
    h+= projItems.length? statBars(projItems,"#ff9800") : `<div class="muted center" style="padding:8px">Noch keine Projekt-Erledigungen</div>`;

    h+=`<div class="section-title">Trophäen (${TROPHIES.filter(t=>t.test(GAME)).length}/${TROPHIES.length})</div>`+trophyGridHtml();
    h+=`<div class="section-title">Bericht erstellen</div>
      <div class="seg">
        <button data-report="7">7 Tage</button>
        <button data-report="30">30 Tage</button>
        <button data-report="90">90 Tage</button>
      </div>`;

    main.innerHTML=h;
  }
  else if(view==="notes"){

    wsAfterRender();

  else if(view==="kalender"){
    kalMount(main);

  else if(view==="plan"){

    h+=wsDeadlinesViewHtml();

  else if(view==="settings"){
    main.innerHTML=`
      <div class="section-title">Ziele</div>
      <div class="card">
        <div class="body">
          <div class="title">Mindest-Tasks pro Tag</div>
          <div class="sub" style="margin-bottom:12px">Für den Tages-Streak</div>

      <div class="section-title">Kalender</div>

          <select id="defCalSel">${calendars.map(c=>`<option value="${esc(c.id)}" ${c.id===defaultCalId?"selected":""}>${esc(c.summary)}</option>`).join("")}</select>
        </div>

      ${ksSettingsHtml()}
      <div class="card">

        </div>
      </div>

      <div class="card">
        <div class="body">
          <div class="title">Google-Tabelle</div>
          <div class="sub">${spreadsheetId?`<a href="https://docs.google.com/spreadsheets/d/${spreadsheetId}" target="_blank" rel="noopener">Im Browser öffnen ↗</a>`:"noch nicht angelegt"}</div>
        </div>
        <button class="icon-btn" id="reloadBtn">Neu laden</button>
      </div>
      
      <div class="section-title">Verwaltung</div>
      <div class="card">
        <div class="body">
          <div class="title">ToDos aus Markdown importieren</div>
          <div class="sub">Massenimport: eine Zeile pro ToDo, optional mit Datum, Uhrzeit und Tag</div>
        </div>
        <button class="icon-btn" data-md-import="1">Importieren</button>
      </div>
      <div class="section-title">Sicherung</div>
      <div class="card">
        <div class="body">
          <div class="title">Backup als JSON</div>
          <div class="sub">Sichert Aufgaben, Erledigungen, Projekte und Notizen als Datei auf diesem Gerät</div>
        </div>
        <button id="btnDoBackupTodo" style="padding:12px 16px;background:var(--accent2);color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:bold;font-size:14px;width:100%;margin-top:8px">⬇️ JSON herunterladen</button>
      </div>
      <div class="card">
        <div class="body">
          <div class="title">Backup wiederherstellen</div>
          <div class="sub">Ergänzt nur fehlende Einträge, nichts wird überschrieben oder doppelt angelegt</div>

      </div>

      <div class="card">
        <div class="body">
          <div class="title">Tabelle zurücksetzen</div>
          <div class="sub">Erstellt eine neue leere Tabelle (alte wird gelöscht)</div>
        </div>
        <button id="resetSheetBtn" style="padding:12px 16px;background-color:#f44336;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold;font-size:14px;width:100%;margin-top:8px">🗑️ Tabelle zurücksetzen</button>
      </div>
      
      <div class="section-title">Konto</div>
      <div class="card">
        <div class="body">
          <div class="title">Abmelden</div>
          <div class="sub">Trennt dieses Gerät vom Google-Konto</div>
        </div>
        <button class="icon-btn" id="signoutBtn">Abmelden</button>
      </div>
      
      <p class="muted" style="font-size:12px;margin-top:18px">Programmstand ${APP_VER}. Aufgaben, Projekte & Notizen liegen ausschließlich in deinem Google-Konto. Kalender-Sync ist pro Aufgabe schaltbar (Standard: an), der Zielkalender pro Eintrag wählbar.</p>
    `;
    const dcs=$("defCalSel"); if(dcs) dcs.onchange=()=>{ defaultCalId=dcs.value; localStorage.setItem("defcal",defaultCalId); toast("Standard-Kalender gesetzt"); };
    ksBindSettings();
    [...document.querySelectorAll("[data-calvis]")].forEach(btn=>{
      btn.onclick=async ()=>{
        const id=btn.dataset.calvis;
        const ids=getVisibleCalendarIds();
        const idx=ids.indexOf(id);
        if(idx>=0){ ids.splice(idx,1); } else { ids.push(id); }
        setVisibleCalendarIds(ids);
        btn.classList.toggle("on");
        await loadTodayCalendarEvents();
        render();
      };
    });
    const mtg=$("minTaskGoalInput"); if(mtg) mtg.onchange=()=>{ minTaskGoal=parseInt(mtg.value)||18; localStorage.setItem("minTaskGoal",minTaskGoal); toast("Mindest-Ziel gesetzt: "+minTaskGoal); };
    $("reloadBtn").onclick=async()=>{ setSync("busy"); await loadAll(); await purgeStaleGoals(); await wsReconcileLinks(); setSync("on"); render(); toast("Aktualisiert"); };
    $("signoutBtn").onclick=signOut;
    $("btnDoBackupTodo").onclick=doBackupTodo;
    $("btnDoRestoreTodo").onclick=doRestoreTodo;
    $("resetSheetBtn").onclick=async()=>{
      if(!confirm("⚠️ ACHTUNG:\nDies wird die aktuelle Tabelle LÖSCHEN und eine neue erstellen!\nAlle Daten gehen verloren!\n\nWirklich fortfahren?")) return;
      if(!confirm("Bist du dir WIRKLICH sicher?")) return;
      try{
        setSync("busy");
        console.log("🗑️ Lösche alte Tabelle:",spreadsheetId);
        const oldId=spreadsheetId;
        localStorage.removeItem("ssid");
        spreadsheetId=null;
        tasks=[]; logs=[]; projects=[]; notes=[]; distractions=[]; calendars=[]; allCalendars=[];
        // Lösche die alte Tabelle in Google Drive
        if(oldId) await deleteSheet(oldId);
        console.log("✅ Alte Tabelle gelöscht, neue wird erstellt...");
        alert("✅ Alte Tabelle wurde gelöscht!\n\nApp wird neu geladen...");
        location.reload();
      }catch(e){
        console.error("resetSheetBtn Fehler:",e);
        alert("❌ Fehler: "+e.message);
        setSync("on");
      }
    };
  }
}

/* ============ AUTOMATISCHER EINTRAG IN EIGENE GOOGLE KALENDER (Tagesziele, fällige Metaprojekte) ============ */
/* Prinzip: Aus dem aktuellen Stand der App wird der Soll-Zustand berechnet und mit den Terminen im Zielkalender abgeglichen.
   Angefasst werden nur Termine mit der Markierung todoSrc (privat erweiterte Eigenschaft); alles andere im Kalender bleibt unberührt. */
const KS_KEYS = {goal:"kalSyncGoalCal", meta:"kalSyncMetaCal"};
const KS_LABEL = {goal:"Tagesziele", meta:"Metaprojekte"};
const KS_SCOPE_CREATE = "https://www.googleapis.com/auth/calendar.app.created";
let ksRetries = 0, ksBusy = false, ksAgain = false, ksTimer = null, ksLast = {goal:"", meta:""};
let ksStatus = localStorage.getItem("ksStatus") || "";
function ksCalId(kind){ const v = localStorage.getItem(KS_KEYS[kind]) || ""; return v==="off" ? "" : v; }
/* Geht die Einstellung verloren (anderes Gerät, geleerter Browserspeicher), werden die von der App angelegten Kalender anhand ihres Namens wieder übernommen.
   Bewusst abgeschaltet ("off") bleibt abgeschaltet. */
function ksAutoAdopt(){
  const all = (allCalendars||[]).concat(calendars||[]);
  let adopted = false;
  ["goal","meta"].forEach(kind=>{
    if(localStorage.getItem(KS_KEYS[kind]) !== null) return;
    const name = kind==="goal" ? "ToDo Tagesziele" : "ToDo Metaprojekte";
    const hit = all.find(c=>c.summary===name);
    if(hit){ localStorage.setItem(KS_KEYS[kind], hit.id); ksLast[kind] = ""; adopted = true; }
  });
  if(adopted) ksSyncSoon();
}

function ksDesiredGoals(){

  allOpenGoals.forEach(g=>{

function ksDesiredMeta(){
  const m = new Map();
  wsMetaNodes().forEach(h=>{
    const n = h.node, sp = wsSpan(n), k = n.dl || (sp ? sp.end : "");
    if(!wsIsDate(k)) return;
