function ksBody(kind, ref, d){
  return {summary:d.title, description:d.desc, start:{date:d.date}, end:{date:nextDayKey(d.date)},
    transparency:"transparent", reminders:{useDefault:false},
    extendedProperties:{private:{todoSrc:kind, todoRef:ref}}};
}
async function ksListExisting(calId, kind){
  let items = [], pt = "";
  do{
    const url = calUrl(calId)+"?privateExtendedProperty="+encodeURIComponent("todoSrc="+kind)+"&maxResults=2500"+(pt?"&pageToken="+encodeURIComponent(pt):"");
    const r = await api(url);
    items = items.concat((r && r.items) || []);
    pt = (r && r.nextPageToken) || "";
  }while(pt);
  return items.filter(e=>e && e.status!=="cancelled");
}
async function ksSyncKind(kind, force){
  const calId = ksCalId(kind); if(!calId) return null;
  if(kind==="goal" && !gtasksLoadedOk) return null;      // Ziele nicht sicher geladen: nichts löschen
  if(kind==="meta" && !wsLoaded) return null;            // Arbeitsbereich nicht geladen: nichts löschen
  const want = kind==="goal" ? ksDesiredGoals() : ksDesiredMeta();
  const sig = JSON.stringify([calId, [...want.entries()].sort((a,b)=>a[0]<b[0]?-1:1)]);
  if(!force && sig===ksLast[kind]) return null;
  const existing = await ksListExisting(calId, kind);
  const byRef = new Map(), dupes = [];
  existing.forEach(e=>{
    const p = e.extendedProperties && e.extendedProperties.private, ref = p && p.todoRef;
    if(!ref) return;
    if(byRef.has(ref)) dupes.push(e); else byRef.set(ref, e);
  });
  const today = todayKey();
  const toAdd = [], toUpd = [], toDel = dupes.slice();
  want.forEach((d, ref)=>{
    const e = byRef.get(ref);
    if(!e){ toAdd.push([ref, d]); return; }
    const same = e.summary===d.title && (e.description||"")===d.desc && e.start && e.start.date===d.date && e.end && e.end.date===nextDayKey(d.date);
    if(!same) toUpd.push([e, ref, d]);
  });
  byRef.forEach((e, ref)=>{
    if(want.has(ref)) return;
    const day = e.start && e.start.date;
    if(kind==="goal" && day && day<today) return;        // vergangene Ziele bleiben als Verlauf stehen
    toDel.push(e);
  });
  let delSkipped = false;
  if(want.size===0 && toDel.length>3){ toDel.length = 0; delSkipped = true; }   // Sicherung gegen leere Ladefehler
  // Schreibzugriffe einzeln mit Wiederholung bei Tempolimit (Google sperrt viele schnelle Schreibzugriffe kurz); ein Fehler stoppt nicht die übrigen Termine
  let failed = 0, lastErr = "";
  const wr = async (url, opts)=>{
    for(let k=0; k<5; k++){
      try{ const r = await api(url, opts); await new Promise(ok=>setTimeout(ok, 250)); return r; }
      catch(err){
        const m = String(err.message||err);
        if(k<4 && /API (403|429|500|502|503)/.test(m) && !/insufficient|forbidden for non|notFound/i.test(m)){ await new Promise(ok=>setTimeout(ok, 1200*(k+1))); continue; }
        throw err;
      }
    }
  };
  let nAdd = 0, nUpd = 0, nDel = 0;
  for(const [ref,d] of toAdd){ try{ await wr(calUrl(calId), {method:"POST", body:JSON.stringify(ksBody(kind, ref, d))}); nAdd++; }catch(err){ failed++; lastErr = String(err.message||err); } }
  for(const [e,ref,d] of toUpd){
    const b = ksBody(kind, ref, d);
    try{ await wr(calUrl(calId)+"/"+encodeURIComponent(e.id), {method:"PATCH", body:JSON.stringify({summary:b.summary, description:b.description, start:b.start, end:b.end})}); nUpd++; }catch(err){ failed++; lastErr = String(err.message||err); }
  }
  for(const e of toDel){ try{ await wr(calUrl(calId)+"/"+encodeURIComponent(e.id), {method:"DELETE"}); nDel++; }catch(err){ failed++; lastErr = String(err.message||err); } }
  if(failed){ ksLast[kind] = ""; }      // nächster Lauf versucht es erneut
  else ksLast[kind] = sig;
  return {add:nAdd, upd:nUpd, del:nDel, skipped:delSkipped, total:want.size, failed, lastErr};
}
function ksStatusSet(txt){
  ksStatus = txt; try{ localStorage.setItem("ksStatus", txt); }catch(e){}
  const el = document.getElementById("ks_status"); if(el) el.textContent = txt;
}
async function ksSyncNow(force){
  if(!accessToken) return;
  if(ksBusy){ ksAgain = true; return; }
  if(!ksCalId("goal") && !ksCalId("meta")) return;
  ksBusy = true;
  const parts = []; let changed = false, ran = false, retry = false;
  try{
    for(const kind of ["goal","meta"]){
      try{
        const r = await ksSyncKind(kind, force);
        if(!r) continue;
        ran = true;
        if(r.add||r.upd||r.del) changed = true;
        parts.push(KS_LABEL[kind]+": "+r.total+" Termine, "+r.add+" neu, "+r.upd+" geändert, "+r.del+" entfernt"+(r.skipped?" (Löschen übersprungen)":"")+(r.failed?" – "+r.failed+" Fehler, neuer Versuch folgt ("+r.lastErr.slice(0,100)+")":""));
        if(r.failed) retry = true;
      }catch(e){
        ran = true; ksLast[kind] = "";
        parts.push(KS_LABEL[kind]+": Fehler "+String(e.message||e).slice(0,140));
      }
    }
    if(ran){
      const t = new Date(); const hm = String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0");
      ksStatusSet("Abgeglichen um "+hm+". "+parts.join(" | "));
      if(changed && typeof kalRefresh==="function") kalRefresh();
      if(retry && ksRetries<4){ ksRetries++; clearTimeout(ksTimer); ksTimer = setTimeout(()=>{ ksSyncNow(false); }, 15000); }
      else if(!retry) ksRetries = 0;
    }
  }finally{
    ksBusy = false;
    if(ksAgain){ ksAgain = false; ksSyncSoon(); }
  }
}
function ksSyncSoon(){
  if(!accessToken) return;
  if(!ksCalId("goal") && !ksCalId("meta")) return;
  clearTimeout(ksTimer); ksTimer = setTimeout(()=>{ ksSyncNow(false); }, 3000);
}
function ksRequestScope(scope){
  if(!tokenClient) return Promise.reject(new Error("Die Google-Anmeldung ist noch nicht bereit"));
  return new Promise((res, rej)=>{
    tokenResolve = res; tokenReject = rej;
    try{ tokenClient.requestAccessToken({scope:SCOPES+" "+scope, prompt:""}); }catch(e){ rej(e); }
  });
}

/* ============ MARKDOWN-IMPORT (Massenimport von ToDos) ============ */
/* Schreibweise je Zeile: "- [ ] Titel @2026-11-30 @14:30 #job"; "- [x] ..." legt das ToDo als erledigt an.
   Datum: @JJJJ-MM-TT, @TT.MM.JJJJ, @TT.MM., @heute, @morgen, @übermorgen. Uhrzeit: @HH:MM. Tags: #privat #job #projekt.
   Überschriften, Trennlinien, Zitate, Tabellen und Codeblöcke werden übersprungen; Listenzeichen sind optional. */
function mdDate(v){
  v = String(v||"").toLowerCase();
  const t = new Date(); t.setHours(0,0,0,0);
  if(v==="heute") return dateKey(t);
  if(v==="morgen"){ t.setDate(t.getDate()+1); return dateKey(t); }
  if(v==="übermorgen"){ t.setDate(t.getDate()+2); return dateKey(t); }
  let y, m, d, mt;
  if((mt = v.match(/^(\d{4})-(\d{2})-(\d{2})$/))){ y=+mt[1]; m=+mt[2]; d=+mt[3]; }
  else if((mt = v.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4}|\d{2})?$/))){
    d=+mt[1]; m=+mt[2];
    if(mt[3]) y = mt[3].length===2 ? 2000+(+mt[3]) : +mt[3];
    else{ y = t.getFullYear(); const c = new Date(y, m-1, d); if(c.getTime() < t.getTime()-180*86400000) y++; }
  } else return "";
  const c = new Date(y, m-1, d);
  if(c.getFullYear()!==y || c.getMonth()!==m-1 || c.getDate()!==d) return "";
  return dateKey(c);
}
function mdParseTodos(text, defDate){
  const out = [];
  let fence = false;
  String(text||"").replace(/\r/g,"").split("\n").forEach(raw=>{
    if(/^\s*(```|~~~)/.test(raw)){ fence = !fence; return; }
    if(fence) return;
    let s = raw.trim();
    if(!s) return;
    if(/^#{1,6}\s/.test(s) || /^(-{3,}|\*{3,}|_{3,})$/.test(s) || /^>/.test(s) || /^\|/.test(s)) return;
    let done = false;
    s = s.replace(/^([-*+]|\d+[.)])\s+/, "");
    const cb = s.match(/^\[([ xX])\]\s*/);
    if(cb){ done = cb[1]!==" "; s = s.slice(cb[0].length); }
    s = s.replace(/!?\[([^\]]*)\]\(([^)]*)\)/g, "$1").replace(/(\*\*|__)(.*?)\1/g, "$2").replace(/`([^`]*)`/g, "$1");
    let date = "", time = "";
    const tags = [];
    s = s.replace(/(^|\s)@(\d{4}-\d{2}-\d{2}|\d{1,2}\.\d{1,2}\.(?:\d{4}|\d{2})?|heute|morgen|übermorgen)(?=\s|$|[,;])/i, (m, pre, v)=>{ const k = mdDate(v); if(!k) return m; date = k; return pre; });
    s = s.replace(/(^|\s)@(\d{1,2}):(\d{2})(?=\s|$|[,;.])/, (m, pre, h, mi)=>{ if(+h>23 || +mi>59) return m; time = String(h).padStart(2,"0")+":"+mi; return pre; });
    s = s.replace(/(^|\s)#(privat|job|projekt)(?=\s|$|[,;.])/gi, (m, pre, tg)=>{ tags.push(tg.toLowerCase()); return pre; });
    const title = s.replace(/\s+/g, " ").trim();
    if(!title) return;
    if(time && !date) date = defDate || todayKey();
    out.push({title, done, date: date || defDate || "", time, tag:[...new Set(tags)].join(",")});
  });
  return out;
}
function openMdImport(){
  if(document.getElementById("modalBg")) return;
  const fld = "width:100%;background:#101216;border:1px solid #30343b;color:var(--text);border-radius:8px;padding:10px;font-size:16px;font-family:inherit;margin-bottom:8px";
  document.body.insertAdjacentHTML("beforeend", `<div class="modal-bg" id="modalBg"><div class="modal">
    <h2>ToDos aus Markdown importieren</h2>
    <p class="muted" style="font-size:13px;margin-bottom:8px">Pro Zeile ein ToDo, zum Beispiel <b>- [ ] Elternbrief schreiben @25.11. @14:30 #job</b>. Mit <b>[x]</b> wird das ToDo als erledigt angelegt. Datum: @JJJJ-MM-TT, @TT.MM., @heute, @morgen. Tags: #privat #job #projekt. Überschriften und Trennlinien werden übersprungen.</p>
    <input type="file" id="mdi_file" accept=".md,.markdown,.txt,text/markdown,text/plain" style="${fld}">
    <textarea id="mdi_text" rows="9" placeholder="Markdown hier einfügen oder Datei wählen" style="${fld};resize:vertical"></textarea>
    <label>Fälligkeit für ToDos ohne Datum</label>
    <select id="mdi_def" style="${fld}"><option value="">Ohne Datum</option><option value="today">Heute</option><option value="tomorrow">Morgen</option></select>
    <label style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><input type="checkbox" id="mdi_dup" checked> Bereits vorhandene ToDos mit gleichem Titel überspringen</label>
    <div id="mdi_prev" class="muted" style="font-size:13px;max-height:180px;overflow:auto;margin-bottom:6px"></div>
    <div class="modal-actions"><button class="btn-ghost" id="mdi_cancel">Abbrechen</button><button class="btn-primary" id="mdi_ok">Importieren</button></div>
  </div></div>`);
  const defDate = ()=>{ const v = $("mdi_def").value; return v==="today" ? todayKey() : v==="tomorrow" ? nextDayKey(todayKey()) : ""; };
  const current = ()=>{
    let items = mdParseTodos($("mdi_text").value, defDate());
    let skipped = 0;
    if($("mdi_dup").checked){
      const have = new Set(tasks.filter(t=>t.type==="todo" && !t.archived).map(t=>String(t.title||"").trim().toLowerCase()));
      const before = items.length;
      items = items.filter(x=>!have.has(x.title.toLowerCase()));
      skipped = before - items.length;
    }
    return {items, skipped};
  };
  const prev = ()=>{
    const {items, skipped} = current();
    const lbl = {privat:"Privat", job:"Job", projekt:"Projekt"};
    $("mdi_prev").innerHTML = (items.length ? "<b>"+items.length+" ToDo"+(items.length===1?"":"s")+" werden angelegt</b>" : "Noch nichts zu importieren")
      + (skipped ? " ("+skipped+" schon vorhanden, übersprungen)" : "")
      + items.slice(0,60).map(x=>`<div>${x.done?"✓":"☐"} ${esc(x.title)}${x.date?" · "+esc(x.date.split("-").reverse().join(".")):""}${x.time?" "+esc(x.time):""}${x.tag?" · "+esc(x.tag.split(",").map(q=>lbl[q]).join(", ")):""}</div>`).join("")
      + (items.length>60 ? `<div>… und ${items.length-60} weitere</div>` : "");
    $("mdi_ok").textContent = items.length ? "Importieren ("+items.length+")" : "Importieren";
  };
  $("mdi_text").oninput = prev; $("mdi_def").onchange = prev; $("mdi_dup").onchange = prev;
  $("mdi_file").onchange = async ()=>{
    const f = $("mdi_file").files && $("mdi_file").files[0]; if(!f) return;
    try{ $("mdi_text").value = await f.text(); }catch(e){ toast("Datei nicht lesbar"); }
    prev();
  };
  $("mdi_cancel").onclick = ()=>$("modalBg").remove();
  $("mdi_ok").onclick = async ()=>{
    const {items} = current();
    if(!items.length){ toast("Nichts zu importieren"); return; }
    $("modalBg").remove();
    setSync("busy");
    const nowIso = new Date().toISOString();
    items.forEach(x=>{
      const wd = x.date ? parseDate(x.date) : null;
      const t = {id:uid(), type:"todo", title:x.title, scheduleType:"once", startDate:x.date||"", weekday:wd?String(wd.getDay()):"",
        syncCalendar:false, calendarEventId:"", notes:"", createdAt:nowIso, archived:false, calendarId:"", startTime:x.time||"", projectId:"", tag:x.tag||""};
      tasks.push(t);
      if(x.done) logs.push({itemId:t.id, date:todayKey(), doneAt:nowIso});
    });
    const anyDone = items.some(x=>x.done);
    try{ await saveTasks(); if(anyDone) await saveLogs(); }catch(e){ toast("Speichern fehlgeschlagen"); }
    setSync("on"); render();
    toast(items.length+(items.length===1?" ToDo":" ToDos")+" importiert");
  };
  prev();
}

/* ============ TAGESSTRUKTUR (eigener Reiter, eigene Datei in Google Drive) ============ */
/* Alles, was hier geplant wird, liegt ausschließlich in der Drive-Datei "Tagesstruktur.json".
   ToDos und Ziele werden nur GELESEN und als Kopie auf die Zeitleiste gelegt; es gibt keine Schreibzugriffe auf Aufgaben, Ziele, Logs oder Kalender. */
const APP_VER = "v201";   // gleich dem Cache-Namen in sw.js, zur Kontrolle der laufenden Version
const TP_FILE = "Tagesstruktur.json";
const TP_COLORS = ["#3b82f6","#f59e0b","#22c55e","#a855f7","#ef4444","#64748b"];
const tp = {day:"", data:null, loading:false, err:"", fileId:"", mt:"", saveT:null, saving:false, again:false, pending:false,
  drag:null, scrollL:null, filter:"due", q:"", showSet:false, deleted:new Set(), range:{from:360,to:1320}, ppm:2};
const tpPad = n=>String(n).padStart(2,"0");
const tpHM = m=>tpPad(Math.floor(m/60)%24)+":"+tpPad(m%60);
const tpCl = (v,a,b)=>Math.max(a,Math.min(b,v));
const tpInt = (v,a,b,d)=>{ v = Math.floor(Number(v)); return Number.isFinite(v) ? tpCl(v,a,b) : d; };
function tpDefault(){ return {v:1, settings:{from:6,to:22,snap:15,pph:120}, days:{}}; }
function tpNorm(d){
  const o = tpDefault();
  if(!d || typeof d!=="object") return o;
  const s = d.settings || {};
  o.settings = {from:tpInt(s.from,0,23,6), to:tpInt(s.to,1,24,22), snap:[5,10,15,30].includes(+s.snap)?+s.snap:15, pph:tpInt(s.pph,40,400,120)};
  if(o.settings.to<=o.settings.from) o.settings.to = Math.min(24, o.settings.from+1);
  Object.keys(d.days||{}).forEach(k=>{
    if(!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
    const bl = ((d.days[k]||{}).blocks||[]).map(b=>{
      const st = tpInt(b&&b.start,0,1439,-1), en = tpInt(b&&b.end,1,1440,-1);
      if(!b || st<0 || en<=st) return null;
      return {id:String(b.id||uid()), title:String(b.title||"").slice(0,200), start:st, end:en, color:String(b.color||TP_COLORS[0]).slice(0,20), done:!!b.done, note:String(b.note||"").slice(0,500),
        src:(b.src && b.src.kind && b.src.ref) ? {kind:String(b.src.kind), ref:String(b.src.ref)} : null};
    }).filter(Boolean);
    if(bl.length) o.days[k] = {blocks:bl};
  });
  return o;
}
function tpSettings(){ return (tp.data && tp.data.settings) || tpDefault().settings; }
function tpDayBlocks(day){ const d = tp.data && tp.data.days[day]; return d ? d.blocks : []; }
function tpBlock(id){ return tpDayBlocks(tp.day).find(b=>b.id===id); }
function tpEnsureDay(day){ if(!tp.data.days[day]) tp.data.days[day] = {blocks:[]}; return tp.data.days[day].blocks; }
function tpRangeFor(day){
  const s = tpSettings(); let from = s.from*60, to = s.to*60;
  tpDayBlocks(day).forEach(b=>{ from = Math.min(from, Math.floor(b.start/60)*60); to = Math.max(to, Math.ceil(b.end/60)*60); });
  return {from, to};
}

/* ---- Laden und Speichern (nur die eigene Datei) ---- */
async function tpLoad(){
  if(tp.loading) return;
  tp.loading = true; tp.err = "";
  try{
    let id = ""; try{ id = localStorage.getItem("tpFileId")||""; }catch(e){}
    let ok = false;
    if(id){
      try{ const f = await api("https://www.googleapis.com/drive/v3/files/"+encodeURIComponent(id)+"?fields=id,trashed,modifiedTime"); if(f && f.id && !f.trashed){ ok = true; tp.mt = f.modifiedTime||""; } }catch(e){}
    }
    if(!ok){
      const q = encodeURIComponent(`name='${TP_FILE}' and trashed=false`);
      const r = await api(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&orderBy=${encodeURIComponent("modifiedTime desc")}&fields=files(id,modifiedTime)`);
      if(r && r.files && r.files.length){ id = r.files[0].id; tp.mt = r.files[0].modifiedTime||""; ok = true; }
    }
    if(ok){
      const blob = await wsDriveFetch(id);
      let parsed = null; try{ parsed = JSON.parse(await blob.text()); }catch(e){ throw new Error("Datei Tagesstruktur.json ist nicht lesbar"); }
      tp.data = tpNorm(parsed); tp.fileId = id; try{ localStorage.setItem("tpFileId", id); }catch(e){}
    }else{
      tp.data = tpDefault(); tp.fileId = "";     // Datei wird beim ersten Speichern angelegt
    }
  }catch(e){
    tp.err = String(e.message||e).slice(0,200); tp.data = null;
  }finally{ tp.loading = false; }
}
function tpDirty(){
  tp.pending = true; clearTimeout(tp.saveT);
  tp.saveT = setTimeout(tpSave, 1200);
}
function tpMerge(remote){
  // Fremde Änderungen (anderes Gerät) übernehmen: unbekannte Blöcke bleiben erhalten, lokale Stände und lokal gelöschte Blöcke gewinnen
  Object.keys(remote.days).forEach(day=>{
    const loc = tp.data.days[day] ? tp.data.days[day].blocks : null;
    remote.days[day].blocks.forEach(b=>{
      if(tp.deleted.has(b.id)) return;
      if(!loc){ tpEnsureDay(day).push(b); return; }
      if(!loc.some(x=>x.id===b.id)) loc.push(b);
    });
  });
}
async function tpSave(){
  if(!tp.data || !tp.pending) return;
  if(tp.saving){ tp.again = true; return; }
  tp.saving = true; tp.pending = false; setSync("busy");
  try{
    if(tp.fileId){
      const f = await api("https://www.googleapis.com/drive/v3/files/"+encodeURIComponent(tp.fileId)+"?fields=modifiedTime");
      if(f && f.modifiedTime && tp.mt && f.modifiedTime!==tp.mt){
        const blob = await wsDriveFetch(tp.fileId);
        try{ tpMerge(tpNorm(JSON.parse(await blob.text()))); if(view==="plan" && !tp.drag) render(); }catch(e){}
      }
    }
    Object.keys(tp.data.days).forEach(k=>{ if(!tp.data.days[k].blocks.length) delete tp.data.days[k]; });
    const json = JSON.stringify(tp.data);
    if(!tp.fileId){
      const f = await wsDriveUpload(new File([json], TP_FILE, {type:"application/json"}));
      tp.fileId = f.id; try{ localStorage.setItem("tpFileId", f.id); }catch(e){}
      const m = await api("https://www.googleapis.com/drive/v3/files/"+encodeURIComponent(f.id)+"?fields=modifiedTime");
      tp.mt = (m && m.modifiedTime) || "";
    }else{
      const r = await api("https://www.googleapis.com/upload/drive/v3/files/"+encodeURIComponent(tp.fileId)+"?uploadType=media&fields=modifiedTime", {method:"PATCH", body:json});
      tp.mt = (r && r.modifiedTime) || tp.mt;
    }
    tp.deleted.clear();
  }catch(e){
    tp.pending = true; console.error("Tagesstruktur speichern:", e.message);
    toast("Tagesstruktur: Speichern fehlgeschlagen, neuer Versuch folgt");
    clearTimeout(tp.saveT); tp.saveT = setTimeout(tpSave, 15000);
  }finally{
    tp.saving = false; setSync("on");
    if(tp.again){ tp.again = false; tpSave(); }
  }
}

/* ---- Hilfen ---- */
function tpFree(day, dur, prefer){
  const r = tp.range, snap = tpSettings().snap;
  const bl = tpDayBlocks(day).slice().sort((a,b)=>a.start-b.start);
  let t = r.from;
  if(day===todayKey()){ const n = new Date(); t = Math.max(t, Math.ceil((n.getHours()*60+n.getMinutes())/snap)*snap); }
  if(prefer!=null) t = prefer;
  for(const b of bl){ if(t+dur<=b.start) break; if(b.end>t && b.start<t+dur) t = b.end; }
  return tpCl(t, 0, 1440-dur);
}
function tpLanes(blocks){
  const sorted = blocks.slice().sort((a,b)=>a.start-b.start||a.end-b.end), ends = [], lane = new Map();
  sorted.forEach(b=>{ let i = ends.findIndex(e=>e<=b.start); if(i<0){ i = ends.length; ends.push(0); } ends[i] = b.end; lane.set(b.id, i); });
  return {lane, n:Math.max(ends.length, 3)};
}
function tpDur(m){ const h = Math.floor(m/60), mi = m%60; return (h?h+" h ":"")+(mi?mi+" min":(h?"":"0 min")); }
function tpDayTitle(day){ const d = parseDate(day); return d ? d.toLocaleDateString("de-DE",{weekday:"long", day:"numeric", month:"long", year:"numeric"}) : day; }

/* ---- Ansicht ---- */
function tpBlockHtml(b, lane){
  const w = (b.end-b.start)*tp.ppm, left = (b.start-tp.range.from)*tp.ppm;
  return `<div class="tp-b${b.done?" done":""}${w<46?" narrow":""}" data-id="${esc(b.id)}" title="${esc(b.title)} · ${tpHM(b.start)}–${tpHM(b.end)}" style="left:${left}px;width:${w}px;top:${4+lane*44}px;background:${esc(b.color)}">
    <i class="tp-h l" data-h="l"></i><span class="tp-ck" data-ck="1">${b.done?"✓":""}</span>
    <div class="tp-t">${esc(b.title||"(ohne Titel)")}</div><div class="tp-m">${tpHM(b.start)}–${b.end>=1440?"24:00":tpHM(b.end)}</div><i class="tp-h r" data-h="r"></i></div>`;
}
function tpPoolItems(day){
  const used = new Set(tpDayBlocks(day).filter(b=>b.src).map(b=>b.src.kind+":"+b.src.ref));
  const q = tp.q.trim().toLowerCase(), out = [];
  tasks.forEach(t=>{
    if(t.type!=="todo" || t.archived || isEverDone(t.id) || used.has("todo:"+t.id)) return;
    const d = t.startDate||"";
    out.push({kind:"todo", ref:t.id, title:t.title||"(ohne Titel)", date:d, time:t.startTime||"", cat:!d?"none":(d===day?"due":(d<day?"over":"later"))});
  });
  (allOpenGoals||[]).forEach(g=>{
    if(!g.due || used.has("goal:"+g.id)) return;
    out.push({kind:"goal", ref:g.id, title:g.title||"(ohne Titel)", date:g.due, time:"", cat:g.due===day?"due":(g.due<day?"over":"later")});
  });
  const list = out.filter(x=>q ? x.title.toLowerCase().includes(q) : (tp.filter==="all" || x.cat===tp.filter));
  list.sort((a,b)=>(a.date||"9999")<(b.date||"9999")?-1:(a.date||"9999")>(b.date||"9999")?1:a.title.localeCompare(b.title,"de"));
  return list;
}
function tpPoolHtml(){
  const list = tpPoolItems(tp.day), F = [["due","Fällig"],["over","Überfällig"],["none","Ohne Datum"],["later","Später"],["all","Alle"]];
  return `<h3>ToDos und Ziele übernehmen (nur Kopie, die ToDo-App bleibt unverändert)</h3>
    <div class="tp-chips">${F.map(f=>`<button class="tp-btn${tp.filter===f[0]&&!tp.q?" on":""}" data-tp="pf" data-v="${f[0]}">${f[1]}</button>`).join("")}</div>
    <input type="search" id="tp_q" placeholder="Suchen (alle ToDos und Ziele)" value="${esc(tp.q)}">
    ${list.slice(0,80).map(x=>`<div class="tp-it"><span>${x.kind==="goal"?"🎯":"☑"}</span><span class="tx">${esc(x.title)}</span><span class="dt">${x.date?esc(wsShortDate(x.date)):"ohne Datum"}${x.time?" · "+esc(x.time):""}</span><button class="tp-btn" data-tp="padd" data-k="${x.kind}" data-r="${esc(x.ref)}">+ Plan</button></div>`).join("")
      || `<div class="tp-note" style="padding:8px 2px">Nichts in dieser Auswahl.</div>`}
    ${list.length>80?`<div class="tp-note">… und ${list.length-80} weitere, bitte suchen</div>`:""}`;
}
function tpPoolRender(){ const el = document.getElementById("tp_pool"); if(el) el.innerHTML = tpPoolHtml(); const q = document.getElementById("tp_q"); if(q && document.activeElement!==q && tp.q){ /* Fokus nicht erzwingen */ } }
function tpSumText(){
  const bl = tpDayBlocks(tp.day); let all = 0, done = 0;
  bl.forEach(b=>{ all += b.end-b.start; if(b.done) done += b.end-b.start; });
  return bl.length ? `${bl.length} Block${bl.length===1?"":"e"}, geplant ${tpDur(all)}, davon erledigt ${tpDur(done)}` : "Noch nichts geplant. In die Zeitleiste tippen oder unten ein ToDo übernehmen.";
}
function tpMount(m){
  if(!accessToken){ m.innerHTML = '<p class="muted" style="padding:18px">Bitte zuerst anmelden.</p>'; return; }
  if(tp.drag) return;
  if(tp.mode==="meta"){ tmMount(m); return; }
  if(!tp.day) tp.day = todayKey();
  if(!tp.data){
    if(tp.err){ m.innerHTML = `<div class="center" style="padding:30px"><p class="muted">Tagesstruktur konnte nicht geladen werden: ${esc(tp.err)}</p><button class="tp-btn pri" data-tp="retry">Erneut versuchen</button></div>`; return; }
    m.innerHTML = '<p class="muted center" style="padding:30px">Lade Tagesstruktur …</p>';
    if(!tp.loading) tpLoad().then(()=>{ if(view==="plan") render(); });
    return;
  }
  const s = tpSettings();
  tp.range = tpRangeFor(tp.day); tp.ppm = s.pph/60;

  const bl = tpDayBlocks(tp.day), L = tpLanes(bl), W = (tp.range.to-tp.range.from)*tp.ppm, H = L.n*44+8;
  let hours = ""; for(let h = tp.range.from/60; h<tp.range.to/60; h++) hours += `<span style="left:${(h*60-tp.range.from)*tp.ppm}px">${tpPad(h)}:00</span>`;
  const now = new Date(), nowM = now.getHours()*60+now.getMinutes();
  const showNow = tp.day===todayKey() && nowM>=tp.range.from && nowM<=tp.range.to;
  const opt = (arr, cur, f)=>arr.map(v=>`<option value="${v}"${v==cur?" selected":""}>${f?f(v):v}</option>`).join("");
  const rng = (a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
  m.innerHTML = `<div class="tp">${tpModeBar()}
    <div class="tp-bar">
      <button class="tp-btn" data-tp="prev">‹</button><button class="tp-btn" data-tp="today">Heute</button><button class="tp-btn" data-tp="next">›</button>
      <input type="date" id="tp_date" value="${esc(tp.day)}"><span class="tp-title">${esc(tpDayTitle(tp.day))}</span>
      <span style="flex:1"></span>
      <button class="tp-btn pri" data-tp="add">+ Block</button><button class="tp-btn" data-tp="carry" title="Unerledigte Blöcke auf den nächsten Tag verschieben">Offenes → morgen</button><button class="tp-btn${tp.showSet?" on":""}" data-tp="set" title="Einstellungen">⚙</button>
    </div>
    ${tp.showSet?`<div class="tp-set">Beginn <select id="tp_from">${opt(rng(0,23), s.from, v=>tpPad(v)+":00")}</select> Ende <select id="tp_to">${opt(rng(1,24), s.to, v=>tpPad(v)+":00")}</select>
      Raster <select id="tp_snap">${opt([5,10,15,30], s.snap, v=>v+" min")}</select> Breite <select id="tp_pph">${opt([60,90,120,180,240], s.pph, v=>v+" px je Stunde")}</select></div>`:""}
    <div class="tp-scroll" id="tp_scroll"><div class="tp-inner" style="width:${W}px">
      <div class="tp-hours">${hours}</div>
      <div class="tp-track" id="tp_track" style="height:${H}px;background-image:linear-gradient(to right,rgba(255,255,255,.13) 1px,transparent 1px),linear-gradient(to right,rgba(255,255,255,.05) 1px,transparent 1px);background-size:${s.pph}px 100%,${s.pph/2}px 100%">
        ${bl.map(b=>tpBlockHtml(b, L.lane.get(b.id))).join("")}${showNow?`<div class="tp-now" id="tp_now" style="left:${(nowM-tp.range.from)*tp.ppm}px"></div>`:""}
      </div></div></div>
    <div class="tp-sum" id="tp_sum">${esc(tpSumText())}</div>
    <div class="tp-pool" id="tp_pool">${tpPoolHtml()}</div>
    <div class="tp-note">Die Tagesstruktur liegt in der eigenen Drive-Datei „${TP_FILE}“. Änderungen hier verändern keine ToDos, Ziele oder Kalendertermine. Programmstand ${APP_VER}.</div>
  </div>`;
  const sc = document.getElementById("tp_scroll");
  if(sc){
    if(tp.scrollL==null){
      let focusM = showNow ? nowM-60 : (bl.length ? Math.min.apply(null, bl.map(b=>b.start))-30 : tp.range.from);
      sc.scrollLeft = Math.max(0, (focusM-tp.range.from)*tp.ppm);
    }else sc.scrollLeft = tp.scrollL;
  }
}

/* ---- Aktionen ---- */
function tpShift(n){ const d = parseDate(tp.day); d.setDate(d.getDate()+n); tp.day = dateKey(d); }
function tpAdd(blk){ tpEnsureDay(tp.day).push(blk); tpDirty(); }
function tpAddFromPool(kind, ref){
  const it = tpPoolItems(tp.day).concat([]).find(x=>x.kind===kind && x.ref===ref) || tpPoolItems(tp.day).find(x=>x.ref===ref);
  let item = it;
  if(!item){ tp.q = ""; item = tpPoolItems(tp.day).find(x=>x.kind===kind && x.ref===ref); }
  if(!item){
    const all = []; tasks.forEach(t=>{ if(t.id===ref) all.push({kind:"todo", ref, title:t.title, time:t.startTime||""}); });
    (allOpenGoals||[]).forEach(g=>{ if(g.id===ref) all.push({kind:"goal", ref, title:g.title, time:""}); });
    item = all[0]; if(!item) return;
  }
  const dur = 30, mm = /^(\d{1,2}):(\d{2})$/.exec(item.time||"");
  const pref = mm ? +mm[1]*60+ +mm[2] : null;
  const st = tpFree(tp.day, dur, pref);
  tpAdd({id:uid(), title:item.title, start:st, end:st+dur, color:kind==="goal"?TP_COLORS[1]:TP_COLORS[0], done:false, note:"", src:{kind, ref}});
  render(); toast("Zur Tagesstruktur hinzugefügt");
}
function tpToggleDone(id){ const b = tpBlock(id); if(!b) return; b.done = !b.done; tpDirty(); render(); }
function tpDelete(id){ const arr = tpEnsureDay(tp.day), i = arr.findIndex(b=>b.id===id); if(i>=0){ tp.deleted.add(id); arr.splice(i,1); tpDirty(); } }
function tpEdit(id, nb){
  if(document.getElementById("modalBg")) return;
  const b = nb || tpBlock(id); if(!b) return;
  const isNew = !!nb;
  document.body.insertAdjacentHTML("beforeend", `<div class="modal-bg" id="modalBg"><div class="modal">
    <h2>${isNew?"Neuer Block":"Block bearbeiten"}</h2>
    <label>Titel</label><input type="text" id="tpe_t" maxlength="200" value="${esc(b.title)}" style="width:100%;background:#101216;border:1px solid #30343b;color:var(--text);border-radius:8px;padding:10px;font-size:16px;margin-bottom:8px">
    <div style="display:flex;gap:10px;margin-bottom:8px"><div style="flex:1"><label>Von</label><input type="time" id="tpe_s" value="${tpHM(b.start)}" style="width:100%;background:#101216;border:1px solid #30343b;color:var(--text);border-radius:8px;padding:10px;font-size:16px"></div>
      <div style="flex:1"><label>Bis</label><input type="time" id="tpe_e" value="${b.end>=1440?"00:00":tpHM(b.end)}" style="width:100%;background:#101216;border:1px solid #30343b;color:var(--text);border-radius:8px;padding:10px;font-size:16px"></div></div>
    <label>Farbe</label><div class="tp-col" id="tpe_c">${TP_COLORS.map(c=>`<button type="button" data-c="${c}" style="background:${c}" class="${c===b.color?"on":""}"></button>`).join("")}</div>
    <label>Notiz</label><input type="text" id="tpe_n" maxlength="500" value="${esc(b.note||"")}" style="width:100%;background:#101216;border:1px solid #30343b;color:var(--text);border-radius:8px;padding:10px;font-size:16px;margin-bottom:8px">
    <label style="display:flex;gap:8px;align-items:center;margin-bottom:10px"><input type="checkbox" id="tpe_d"${b.done?" checked":""}> Erledigt (gilt nur in der Tagesstruktur)</label>
    <div class="modal-actions">${isNew?"":`<button class="btn-ghost" id="tpe_del" style="color:#ff8a8e">Löschen</button>`}<button class="btn-ghost" id="tpe_x">Abbrechen</button><button class="btn-primary" id="tpe_ok">Speichern</button></div></div></div>`);
  let color = b.color;
  $("tpe_c").onclick = e=>{ const c = e.target.closest("[data-c]"); if(!c) return; color = c.dataset.c; [...$("tpe_c").children].forEach(x=>x.classList.toggle("on", x===c)); };
  $("tpe_x").onclick = ()=>$("modalBg").remove();
  $("modalBg").onclick = e=>{ if(e.target.id==="modalBg") $("modalBg").remove(); };
  if($("tpe_del")) $("tpe_del").onclick = ()=>{ $("modalBg").remove(); tpDelete(b.id); render(); };
  $("tpe_ok").onclick = ()=>{
    const pm = v=>{ const m = /^(\d{1,2}):(\d{2})$/.exec(v||""); return m ? +m[1]*60+ +m[2] : -1; };
    const s = pm($("tpe_s").value); let e = pm($("tpe_e").value);
    if(e===0 && s>0) e = 1440;
    if(s<0 || e<0 || e<=s){ toast("Die Endzeit muss nach der Startzeit liegen"); return; }
    b.title = $("tpe_t").value.trim().slice(0,200); b.start = s; b.end = e; b.color = color; b.note = $("tpe_n").value.trim().slice(0,500); b.done = $("tpe_d").checked;
    if(isNew) tpAdd(b); else tpDirty();
    $("modalBg").remove(); render();
  };
  setTimeout(()=>{ const t = $("tpe_t"); if(t) t.focus(); }, 50);
}
function tpAct(a, el){
  if(a==="prev"){ tpShift(-1); render(); }
  else if(a==="next"){ tpShift(1); render(); }
  else if(a==="today"){ tp.day = todayKey(); tp.scrollL = null; render(); }
  else if(a==="add"){ const dur = 30, st = tpFree(tp.day, dur); tpEdit("", {id:uid(), title:"", start:st, end:st+dur, color:TP_COLORS[0], done:false, note:"", src:null}); }
  else if(a==="set"){ tp.showSet = !tp.showSet; render(); }
  else if(a==="retry"){ tp.err = ""; render(); }
  else if(a==="pf"){ tp.filter = el.dataset.v; tp.q = ""; tpPoolRender(); document.querySelectorAll("#tp_pool [data-tp=pf]").forEach(x=>x.classList.toggle("on", x.dataset.v===tp.filter)); }
  else if(a==="padd"){ tpAddFromPool(el.dataset.k, el.dataset.r); }
  else if(a==="carry"){
    const open = tpDayBlocks(tp.day).filter(b=>!b.done);
    if(!open.length){ toast("Nichts Offenes an diesem Tag"); return; }
    if(!confirm(open.length+" unerledigte Block"+(open.length===1?"":"e")+" auf den nächsten Tag verschieben?")) return;
    const cur = tp.day; tpShift(1); const nxt = tp.day; tp.day = cur;
    const src = tpEnsureDay(cur), dst = tpEnsureDay(nxt);
    open.forEach(b=>{ const i = src.indexOf(b); if(i>=0) src.splice(i,1); dst.push(b); });
    tpDirty(); render(); toast(open.length+" Block"+(open.length===1?"":"e")+" verschoben");
  }
}

/* ---- Ziehen und Verschieben ---- */
function tpDragApply(clientX){
  const d = tp.drag; if(!d) return;
  const sc = document.getElementById("tp_scroll"); if(!sc) return;
  const snap = tpSettings().snap, minD = Math.max(5, snap);
  const dx = (clientX + sc.scrollLeft) - (d.x0 + d.sl0);
  if(Math.abs(dx)>4) d.moved = true;
  if(!d.moved) return;
  const dm = Math.round(dx/tp.ppm/snap)*snap, R = tp.range;
  let ns = d.s0, ne = d.e0;
  if(d.mode==="m"){ const len = d.e0-d.s0; ns = tpCl(d.s0+dm, R.from, R.to-len); ne = ns+len; }
  else if(d.mode==="l"){ ns = tpCl(d.s0+dm, R.from, d.e0-minD); }
  else { ne = tpCl(d.e0+dm, d.s0+minD, R.to); }
  d.ns = ns; d.ne = ne;
  d.el.style.left = (ns-R.from)*tp.ppm+"px"; d.el.style.width = (ne-ns)*tp.ppm+"px";
  const mt = d.el.querySelector(".tp-m"); if(mt) mt.textContent = tpHM(ns)+"–"+(ne>=1440?"24:00":tpHM(ne));
}
function tpDown(e){
  if(view!=="plan" || tp.mode!=="day") return;
  const b = e.target.closest && e.target.closest(".tp-b"); if(!b || !b.closest("#tp_track")) return;
  if(e.target.closest("[data-ck]")) return;
  if(e.pointerType==="mouse" && e.button!==0) return;
  const blk = tpBlock(b.dataset.id); if(!blk) return;
  const h = e.target.closest("[data-h]"), sc = document.getElementById("tp_scroll");
  tp.drag = {id:blk.id, mode:h?h.dataset.h:"m", x0:e.clientX, sl0:sc?sc.scrollLeft:0, s0:blk.start, e0:blk.end, ns:blk.start, ne:blk.end, moved:false, el:b, pid:e.pointerId, lastX:e.clientX, timer:null};
  try{ b.setPointerCapture(e.pointerId); }catch(_){}
  b.classList.add("drag");
  tp.drag.timer = setInterval(()=>{            // am Rand der Zeitleiste mitscrollen
    const d = tp.drag, s2 = document.getElementById("tp_scroll"); if(!d || !s2 || !d.moved) return;
    const r = s2.getBoundingClientRect();
    if(d.lastX < r.left+40) s2.scrollLeft -= 14; else if(d.lastX > r.right-40) s2.scrollLeft += 14; else return;
    tpDragApply(d.lastX);
  }, 30);
  e.preventDefault();
}
function tpMoveEv(e){ const d = tp.drag; if(!d || e.pointerId!==d.pid) return; d.lastX = e.clientX; tpDragApply(e.clientX); }
function tpUp(e){
  const d = tp.drag; if(!d || e.pointerId!==d.pid) return;
  clearInterval(d.timer); tp.drag = null;
  d.el.classList.remove("drag");
  tp.suppressClick = Date.now();
  const blk = tpBlock(d.id);
  if(d.moved && e.type==="pointerup" && blk){ blk.start = d.ns; blk.end = d.ne; tpDirty(); render(); }
  else if(!d.moved && e.type==="pointerup" && blk){ tpEdit(blk.id); }
  else render();
}
function tpClick(e){
  if(view!=="plan" || tp.mode!=="day") return;
  const ck = e.target.closest && e.target.closest("[data-ck]");
  if(ck){ const b = ck.closest(".tp-b"); if(b) tpToggleDone(b.dataset.id); return; }
  const a = e.target.closest && e.target.closest("[data-tp]");
  if(a){ tpAct(a.dataset.tp, a); return; }
  if(e.target.closest && e.target.closest(".tp-b")) return;
  const track = e.target.closest && e.target.closest("#tp_track");
  if(track){
    if(tp.suppressClick && Date.now()-tp.suppressClick<350) return;
    const x = e.clientX - track.getBoundingClientRect().left, snap = tpSettings().snap, dur = 30;
    const st = tpCl(Math.floor((tp.range.from + x/tp.ppm)/snap)*snap, 0, 1440-dur);
    tpEdit("", {id:uid(), title:"", start:st, end:st+dur, color:TP_COLORS[0], done:false, note:"", src:null});
  }
}
function tpInput(e){
  if(view!=="plan" || tp.mode!=="day") return;
  if(e.target.id==="tp_q"){ tp.q = e.target.value; const el = document.getElementById("tp_pool"); if(el){ el.innerHTML = tpPoolHtml(); const q = document.getElementById("tp_q"); if(q){ q.focus(); try{ q.setSelectionRange(q.value.length, q.value.length); }catch(_){} } } }
}
function tpChange(e){
  if(view!=="plan" || tp.mode!=="day") return;
  const id = e.target.id;
  if(id==="tp_date"){ if(/^\d{4}-\d{2}-\d{2}$/.test(e.target.value)){ tp.day = e.target.value; render(); } return; }
  if(["tp_from","tp_to","tp_snap","tp_pph"].includes(id)){
    const s = tpSettings(), v = +e.target.value;
    if(id==="tp_from") s.from = Math.min(v, s.to-1);
    if(id==="tp_to") s.to = Math.max(v, s.from+1);
    if(id==="tp_snap") s.snap = v;
    if(id==="tp_pph") s.pph = v;
    tpDirty(); render();
  }
}
(function tpInit(){
  main.addEventListener("pointerdown", tpDown);
  main.addEventListener("pointermove", tpMoveEv);
  main.addEventListener("pointerup", tpUp);
  main.addEventListener("pointercancel", tpUp);
  main.addEventListener("click", tpClick);
  main.addEventListener("input", tpInput);
  main.addEventListener("change", tpChange);
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden" && tp.pending) tpSave(); });
  setInterval(()=>{
    if(view!=="plan" || tp.drag) return;
    const el = document.getElementById("tp_now"); if(!el) return;
    const n = new Date(), m = n.getHours()*60+n.getMinutes();
    el.style.left = (m-tp.range.from)*tp.ppm+"px";

})();
function tpReset(){ if(typeof tmReset==="function") tmReset(); clearTimeout(tp.saveT); tp.data = null; tp.fileId = ""; tp.mt = ""; tp.err = ""; tp.pending = false; tp.deleted.clear(); }

/* ============ METAPROJEKTE-PLANER (Modus im Reiter Struktur, eigene Drive-Datei) ============ */
/* Wie die Tagesstruktur: Die Planung liegt ausschließlich in der Drive-Datei "Metaprojektplanung.json".
   Meta-Projekte aus dem Arbeitsbereich werden nur GELESEN (Auswahlliste, Deadline-Markierung); es wird nichts in Arbeitsbereich, ToDos, Ziele oder Kalender zurückgeschrieben. */
const TM_FILE = "Metaprojektplanung.json";
const tm = {data:null, loading:false, err:"", fileId:"", mt:"", saveT:null, saving:false, again:false, pending:false, drag:null,
  scrollL:null, q:"", filter:"all", showSet:false, deleted:new Set(), range:{from:0,to:1}, ppd:24, suppressClick:0};
tp.mode = (function(){ try{ return localStorage.getItem("tpMode")==="meta" ? "meta" : "day"; }catch(e){ return "day"; } })();
const tmDN = k=>{ const p = String(k).split("-"); return Math.round(Date.UTC(+p[0], +p[1]-1, +p[2])/864e5); };
const tmKey = n=>{ const d = new Date(n*864e5); return d.getUTCFullYear()+"-"+tpPad(d.getUTCMonth()+1)+"-"+tpPad(d.getUTCDate()); };
const tmShort = k=>{ const p = String(k).split("-"); return p[2]+"."+p[1]+"."; };
const tmOk = k=>typeof k==="string" && /^\d{4}-\d{2}-\d{2}$/.test(k) && tmKey(tmDN(k))===k;
function tmDefault(){ return {v:1, settings:{ppd:24}, blocks:[]}; }
function tmNorm(d){
  const o = tmDefault();
  if(!d || typeof d!=="object") return o;
  o.settings.ppd = tpInt((d.settings||{}).ppd, 6, 80, 24);
  (Array.isArray(d.blocks)?d.blocks:[]).forEach(b=>{
    if(!b || !tmOk(b.start) || !tmOk(b.end) || b.end<b.start) return;
    o.blocks.push({id:String(b.id||uid()), title:String(b.title||"").slice(0,200), start:b.start, end:b.end, color:String(b.color||TP_COLORS[0]).slice(0,20), done:!!b.done, note:String(b.note||"").slice(0,500),
      src:(b.src && b.src.ref) ? {kind:"meta", ref:String(b.src.ref)} : null});
  });
  return o;
}
function tmBlock(id){ return tm.data ? tm.data.blocks.find(b=>b.id===id) : null; }
async function tmLoad(){
  if(tm.loading) return;
  tm.loading = true; tm.err = "";
  try{
    let id = ""; try{ id = localStorage.getItem("tmFileId")||""; }catch(e){}
    let ok = false;
    if(id){ try{ const f = await api("https://www.googleapis.com/drive/v3/files/"+encodeURIComponent(id)+"?fields=id,trashed,modifiedTime"); if(f && f.id && !f.trashed){ ok = true; tm.mt = f.modifiedTime||""; } }catch(e){} }
    if(!ok){
      const q = encodeURIComponent(`name='${TM_FILE}' and trashed=false`);
      const r = await api(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&orderBy=${encodeURIComponent("modifiedTime desc")}&fields=files(id,modifiedTime)`);
      if(r && r.files && r.files.length){ id = r.files[0].id; tm.mt = r.files[0].modifiedTime||""; ok = true; }
    }
    if(ok){
      const blob = await wsDriveFetch(id);
      let parsed = null; try{ parsed = JSON.parse(await blob.text()); }catch(e){ throw new Error("Datei Metaprojektplanung.json ist nicht lesbar"); }
      tm.data = tmNorm(parsed); tm.fileId = id; try{ localStorage.setItem("tmFileId", id); }catch(e){}
    }else{ tm.data = tmDefault(); tm.fileId = ""; }
  }catch(e){ tm.err = String(e.message||e).slice(0,200); tm.data = null; }
  finally{ tm.loading = false; }
}
function tmDirty(){ tm.pending = true; clearTimeout(tm.saveT); tm.saveT = setTimeout(tmSave, 1200); }
function tmMerge(remote){
  remote.blocks.forEach(b=>{ if(tm.deleted.has(b.id)) return; if(!tm.data.blocks.some(x=>x.id===b.id)) tm.data.blocks.push(b); });
}
async function tmSave(){
  if(!tm.data || !tm.pending) return;
  if(tm.saving){ tm.again = true; return; }
  tm.saving = true; tm.pending = false; setSync("busy");
  try{
    if(tm.fileId){
      const f = await api("https://www.googleapis.com/drive/v3/files/"+encodeURIComponent(tm.fileId)+"?fields=modifiedTime");
      if(f && f.modifiedTime && tm.mt && f.modifiedTime!==tm.mt){
        const blob = await wsDriveFetch(tm.fileId);
        try{ tmMerge(tmNorm(JSON.parse(await blob.text()))); if(view==="plan" && tp.mode==="meta" && !tm.drag) render(); }catch(e){}
      }
    }
    const json = JSON.stringify(tm.data);
    if(!tm.fileId){
      const f = await wsDriveUpload(new File([json], TM_FILE, {type:"application/json"}));
      tm.fileId = f.id; try{ localStorage.setItem("tmFileId", f.id); }catch(e){}
      const m = await api("https://www.googleapis.com/drive/v3/files/"+encodeURIComponent(f.id)+"?fields=modifiedTime");
      tm.mt = (m && m.modifiedTime) || "";
    }else{
      const r = await api("https://www.googleapis.com/upload/drive/v3/files/"+encodeURIComponent(tm.fileId)+"?uploadType=media&fields=modifiedTime", {method:"PATCH", body:json});
      tm.mt = (r && r.modifiedTime) || tm.mt;
    }
    tm.deleted.clear();
  }catch(e){
    tm.pending = true; console.error("Metaprojektplanung speichern:", e.message);
    toast("Metaprojektplanung: Speichern fehlgeschlagen, neuer Versuch folgt");
    clearTimeout(tm.saveT); tm.saveT = setTimeout(tmSave, 15000);
  }finally{
    tm.saving = false; setSync("on");
    if(tm.again){ tm.again = false; tmSave(); }
  }
}
function tmRange(){
  const t = tmDN(todayKey());
  let from = t-14, to = t+120;
  tm.data.blocks.forEach(b=>{ from = Math.min(from, tmDN(b.start)-7); to = Math.max(to, tmDN(b.end)+30); });
  // an Montag ausrichten
  const wd = (new Date(from*864e5).getUTCDay()+6)%7; from -= wd;
  return {from, to};
}
function tmMetaMap(){
  const m = new Map();
  if(typeof wsLoaded!=="undefined" && wsLoaded && Array.isArray(wsDocs)) wsMetaNodes().forEach(h=>m.set(h.node.id, h));
  return m;
}
function tmLanes(blocks){
  const sorted = blocks.slice().sort((a,b)=>a.start<b.start?-1:a.start>b.start?1:(a.end<b.end?-1:1)), ends = [], lane = new Map();
  sorted.forEach(b=>{ const s = tmDN(b.start); let i = ends.findIndex(e=>e<s); if(i<0){ i = ends.length; ends.push(0); } ends[i] = tmDN(b.end); lane.set(b.id, i); });
  return {lane, n:Math.max(ends.length, 3)};
}
function tmBlockHtml(b, lane, metaMap){
  const s = tmDN(b.start), e = tmDN(b.end), days = e-s+1;
  const left = (s-tm.range.from)*tm.ppd, w = days*tm.ppd;
  const h = b.src ? metaMap.get(b.src.ref) : null;
  let flag = "";
  if(h && h.node.dl && tmOk(h.node.dl)){
    const dn = tmDN(h.node.dl);
    flag = `<i class="tm-dl" title="Deadline ${esc(tmShort(h.node.dl))} (aus dem Arbeitsbereich)" style="left:${(dn-tm.range.from)*tm.ppd}px;top:${4+lane*44}px">⚑</i>`;
  }
  return `<div class="tp-b tm-b${b.done?" done":""}${w<46?" narrow":""}" data-id="${esc(b.id)}" title="${esc(b.title)} · ${esc(tmShort(b.start))}–${esc(tmShort(b.end))} (${days} Tag${days===1?"":"e"})" style="left:${left}px;width:${w}px;top:${4+lane*44}px;background:${esc(b.color)}">
    <i class="tp-h l" data-h="l"></i><span class="tp-ck" data-ck="1">${b.done?"✓":""}</span>
    <div class="tp-t">${esc(b.title||"(ohne Titel)")}</div><div class="tp-m">${esc(tmShort(b.start))}–${esc(tmShort(b.end))} · ${days} T</div><i class="tp-h r" data-h="r"></i></div>${flag}`;
}
function tmPoolItems(){
  if(!(typeof wsLoaded!=="undefined" && wsLoaded)) return null;
  const used = new Set(tm.data.blocks.filter(b=>b.src).map(b=>b.src.ref)), q = tm.q.trim().toLowerCase(), out = [];
  wsMetaNodes().forEach(h=>{
    const n = h.node; if(used.has(n.id)) return;
    const sp = wsSpan(n), title = (wsTitleOf(n)||"(ohne Titel)");
    out.push({ref:n.id, title, doc:h.doc.title||"Ohne Titel", span:sp, dl:n.dl||""});
  });
  const list = out.filter(x=>q ? (x.title.toLowerCase().includes(q) || x.doc.toLowerCase().includes(q)) : (tm.filter==="all" || (tm.filter==="dl" && x.dl) || (tm.filter==="nodate" && !x.span)));
  list.sort((a,b)=>((a.span?a.span.start:"9999")<(b.span?b.span.start:"9999")?-1:(a.span?a.span.start:"9999")>(b.span?b.span.start:"9999")?1:a.title.localeCompare(b.title,"de")));
  return list;
}
function tmPoolHtml(){
  const list = tmPoolItems(), F = [["all","Alle"],["dl","Mit Deadline"],["nodate","Ohne Termin"]];
  if(list===null) return `<h3>Meta-Projekte übernehmen</h3><div class="tp-note">Der Arbeitsbereich wird noch geladen …</div>`;
  return `<h3>Meta-Projekte übernehmen (nur Kopie, der Arbeitsbereich bleibt unverändert)</h3>
    <div class="tp-chips">${F.map(f=>`<button class="tp-btn${tm.filter===f[0]&&!tm.q?" on":""}" data-tm="pf" data-v="${f[0]}">${f[1]}</button>`).join("")}</div>
    <input type="search" id="tm_q" placeholder="Suchen" value="${esc(tm.q)}">
    ${list.slice(0,80).map(x=>`<div class="tp-it"><span>★</span><span class="tx">${esc(x.title)}<span class="tp-note"> · ${esc(x.doc)}</span></span><span class="dt">${x.span?esc(tmShort(x.span.start))+"–"+esc(tmShort(x.span.end)):"ohne Termin"}${x.dl?" · ⚑ "+esc(tmShort(x.dl)):""}</span><button class="tp-btn" data-tm="padd" data-r="${esc(x.ref)}">+ Plan</button></div>`).join("")
      || `<div class="tp-note" style="padding:8px 2px">Nichts in dieser Auswahl.</div>`}
    ${list.length>80?`<div class="tp-note">… und ${list.length-80} weitere, bitte suchen</div>`:""}`;
}
function tpModeBar(){
  return `<div class="tp-bar"><button class="tp-btn${tp.mode==="day"?" on":""}" data-tpmode="day">Tag</button><button class="tp-btn${tp.mode==="meta"?" on":""}" data-tpmode="meta">Metaprojekte</button></div>`;
}
function tmMount(m){
  if(tm.drag) return;
  if(!tm.data){
    if(tm.err){ m.innerHTML = `<div class="tp">${tpModeBar()}<div class="center" style="padding:30px"><p class="muted">Metaprojektplanung konnte nicht geladen werden: ${esc(tm.err)}</p><button class="tp-btn pri" data-tm="retry">Erneut versuchen</button></div></div>`; return; }
    m.innerHTML = `<div class="tp">${tpModeBar()}<p class="muted center" style="padding:30px">Lade Metaprojektplanung …</p></div>`;
    if(!tm.loading) tmLoad().then(()=>{ if(view==="plan" && tp.mode==="meta") render(); });
    return;
  }
  tm.ppd = tm.data.settings.ppd; tm.range = tmRange();
  const prev = document.getElementById("tm_scroll"); if(prev) tm.scrollL = prev.scrollLeft;
  const R = tm.range, days = R.to-R.from+1, W = days*tm.ppd, ppd = tm.ppd, metaMap = tmMetaMap();
  const L = tmLanes(tm.data.blocks), H = L.n*44+8, today = tmDN(todayKey());
  let mon = "", dayRow = "", shade = "", i0 = R.from;
  while(i0<=R.to){
    const d = new Date(i0*864e5), y = d.getUTCFullYear(), mo = d.getUTCMonth();
    const last = new Date(Date.UTC(y, mo+1, 0)).getTime()/864e5, i1 = Math.min(last, R.to);
    mon += `<span style="left:${(i0-R.from)*ppd}px;width:${(i1-i0+1)*ppd}px">${d.toLocaleDateString("de-DE",{month:"long", year:"numeric", timeZone:"UTC"})}</span>`;
    i0 = i1+1;
  }
  for(let n = R.from; n<=R.to; n++){
    const wd = new Date(n*864e5).getUTCDay(), we = wd===0||wd===6, mondayish = wd===1;
    const showNum = ppd>=18 || mondayish;
    dayRow += `<span class="${we?"we":""}${n===today?" td":""}" style="left:${(n-R.from)*ppd}px;width:${ppd}px">${showNum?new Date(n*864e5).getUTCDate():""}</span>`;
    if(we) shade += `<i class="tm-we" style="left:${(n-R.from)*ppd}px;width:${ppd}px"></i>`;
  }
  const opt = (arr, cur, f)=>arr.map(v=>`<option value="${v}"${v==cur?" selected":""}>${f?f(v):v}</option>`).join("");
  let sumDays = 0; tm.data.blocks.forEach(b=>{ sumDays += tmDN(b.end)-tmDN(b.start)+1; });
  m.innerHTML = `<div class="tp">${tpModeBar()}
    <div class="tp-bar">
      <button class="tp-btn" data-tm="left">‹ Zurück</button><button class="tp-btn" data-tm="today">Heute</button><button class="tp-btn" data-tm="right">Weiter ›</button>
      <span class="tp-title">Metaprojekte</span><span style="flex:1"></span>
      <button class="tp-btn" data-tm="term" title="Start und Deadline der Meta-Projekte in der ToDo-App bearbeiten">Start/Deadline bearbeiten</button><button class="tp-btn pri" data-tm="add">+ Block</button><button class="tp-btn${tm.showSet?" on":""}" data-tm="set" title="Einstellungen">⚙</button>
    </div>
    ${tm.showSet?`<div class="tp-set">Breite <select id="tm_ppd">${opt([8,12,16,24,36,56], ppd, v=>v+" px je Tag")}</select></div>`:""}
    <div class="tp-scroll" id="tm_scroll"><div class="tp-inner" style="width:${W}px">
      <div class="tm-mon">${mon}</div><div class="tm-days">${dayRow}</div>
      <div class="tp-track" id="tm_track" style="height:${H}px">${shade}
        ${tm.data.blocks.map(b=>tmBlockHtml(b, L.lane.get(b.id), metaMap)).join("")}
        ${today>=R.from&&today<=R.to?`<div class="tp-now" style="left:${(today-R.from)*ppd+ppd/2}px"></div>`:""}
      </div></div></div>
    <div class="tp-sum">${tm.data.blocks.length ? `${tm.data.blocks.length} Block${tm.data.blocks.length===1?"":"e"}, zusammen ${sumDays} Tage geplant` : "Noch nichts geplant. In die Zeitleiste tippen oder unten ein Meta-Projekt übernehmen."}</div>
    <div class="tp-pool" id="tm_pool">${tmPoolHtml()}</div>
    <div class="tp-note">Die Metaprojektplanung liegt in der eigenen Drive-Datei „${TM_FILE}“. Änderungen hier verändern keine Meta-Projekte, ToDos oder Termine im Arbeitsbereich. Die Fahne ⚑ zeigt die Deadline des Meta-Projekts (nur Anzeige). Programmstand ${APP_VER}.</div>
  </div>`;
  const sc = document.getElementById("tm_scroll");
  if(sc){
    if(tm.scrollL==null){
      const first = tm.data.blocks.length ? Math.min.apply(null, tm.data.blocks.map(b=>tmDN(b.start))) : today;
      sc.scrollLeft = Math.max(0, (Math.min(first, today)-3-R.from)*ppd);
    }else sc.scrollLeft = tm.scrollL;
  }
}
function tmPoolRender(){ const el = document.getElementById("tm_pool"); if(el) el.innerHTML = tmPoolHtml(); }
function tmAddBlock(blk){ tm.data.blocks.push(blk); tmDirty(); }
function tmAddFromPool(ref){
  const h = tmMetaMap().get(ref); if(!h) return;
  const n = h.node, sp = wsSpan(n), t = todayKey();
  let s, e;
  if(sp){ s = sp.start; e = sp.end; }
  else{ s = t; e = tmKey(tmDN(t)+13); }
  if(e<s) e = s;
  tmAddBlock({id:uid(), title:(wsTitleOf(n)||"(ohne Titel)"), start:s, end:e, color:TP_COLORS[2], done:false, note:"", src:{kind:"meta", ref}});
  tm.scrollL = null; render(); toast("Zur Metaprojektplanung hinzugefügt");
}
function tmEdit(id, nb){

    <div style="display:flex;gap:10px;margin-bottom:8px"><div style="flex:1"><label>Von</label><input type="date" id="tme_s" value="${esc(b.start)}" style="${fld}"></div>
      <div style="flex:1"><label>Bis</label><input type="date" id="tme_e" value="${esc(b.end)}" style="${fld}"></div></div>

    <label style="display:flex;gap:8px;align-items:center;margin-bottom:10px"><input type="checkbox" id="tme_d"${b.done?" checked":""}> Erledigt (gilt nur in der Metaprojektplanung)</label>
    ${(!isNew && b.src)?`<button class="btn-ghost" id="tme_term" style="width:100%;margin-bottom:10px">Start und Deadline bearbeiten (ToDo-App)</button>`:""}
    <div class="modal-actions">${isNew?"":`<button class="btn-ghost" id="tme_del" style="color:#ff8a8e">Löschen</button>`}<button class="btn-ghost" id="tme_x">Abbrechen</button><button class="btn-primary" id="tme_ok">Speichern</button></div></div></div>`);
  let color = b.color;
  if($("tme_term")) $("tme_term").onclick = ()=>{ $("modalBg").remove(); tmTermView(b.src.ref); };
  $("tme_c").onclick = e=>{ const c = e.target.closest("[data-c]"); if(!c) return; color = c.dataset.c; [...$("tme_c").children].forEach(x=>x.classList.toggle("on", x===c)); };
  $("tme_x").onclick = ()=>$("modalBg").remove();
  $("modalBg").onclick = e=>{ if(e.target.id==="modalBg") $("modalBg").remove(); };
  if($("tme_del")) $("tme_del").onclick = ()=>{ $("modalBg").remove(); const i = tm.data.blocks.findIndex(x=>x.id===b.id); if(i>=0){ tm.deleted.add(b.id); tm.data.blocks.splice(i,1); tmDirty(); } render(); };

    if(isNew) tmAddBlock(b); else tmDirty();

  };

/* ---- Start und Deadline der Meta-Projekte bearbeiten (schreibt bewusst in den Arbeitsbereich, nur auf ausdrücklichen Klick auf "Übernehmen") ---- */
function tmTermRows(onlyRef){
  const map = tmMetaMap(), rows = new Map();
  tm.data.blocks.forEach(b=>{
    if(!b.src || (onlyRef && b.src.ref!==onlyRef)) return;
    const h = map.get(b.src.ref); if(!h) return;
    let r = rows.get(b.src.ref);
    if(!r){ r = {ref:b.src.ref, h, s:b.start, e:b.end, nb:0}; rows.set(b.src.ref, r); }
    if(b.start<r.s) r.s = b.start; if(b.end>r.e) r.e = b.end; r.nb++;
  });
  return [...rows.values()].sort((a,b)=>a.s<b.s?-1:a.s>b.s?1:0);
}
function tmTermView(onlyRef){
  if(document.getElementById("modalBg")) return;
  if(!(typeof wsLoaded!=="undefined" && wsLoaded)){ toast("Arbeitsbereich noch nicht geladen"); return; }
  const rows = tmTermRows(onlyRef);
  if(!rows.length){ toast(onlyRef ? "Dieses Meta-Projekt ist im Arbeitsbereich nicht mehr offen" : "Noch keine Blöcke aus Meta-Projekten in der Planung"); return; }
  const inp = "width:100%;background:#101216;border:1px solid #30343b;color:var(--text);border-radius:8px;padding:8px;font-size:15px;font-family:inherit";
  const dayCnt = (a,b)=>tmDN(b)-tmDN(a)+1;
  const card = (r,i)=>{
    const n = r.h.node;
    return `<div style="border:1px solid #30343b;border-radius:12px;padding:10px;margin-bottom:10px" data-i="${i}">
      <div style="font-weight:600;margin-bottom:2px">★ ${esc(wsTitleOf(n)||"(ohne Titel)")}</div>
      <div class="tp-note" style="margin-bottom:6px">${esc(r.h.doc.title||"Ohne Titel")}${n.link?" · mit "+(n.link.kind==="goal"?"Tages-Ziel":"ToDo")+" verknüpft, dessen Datum wird mitgeführt":""}</div>
      <div style="font-size:13px;margin-bottom:8px"><b>Struktur (Planung):</b> ${esc(tmShort(r.s))} bis ${esc(tmShort(r.e))}, ${dayCnt(r.s,r.e)} Tag${dayCnt(r.s,r.e)===1?"":"e"}${r.nb>1?" ("+r.nb+" Blöcke)":""}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <div style="flex:1;min-width:130px"><label style="font-size:12px">Start (ToDo-App)</label><input type="date" class="t_s" value="${esc(n.date||"")}" style="${inp}"></div>
        <div style="flex:0 0 90px"><label style="font-size:12px">Tage</label><input type="number" class="t_d" min="0" max="3660" step="1" value="${n.dur||""}" placeholder="–" style="${inp}"></div>
        <div style="flex:1;min-width:130px"><label style="font-size:12px">Deadline (ToDo-App)</label><input type="date" class="t_l" value="${esc(n.dl||"")}" style="${inp}"></div>
      </div>
      <div class="muted t_info" style="font-size:12px;margin:6px 0 4px"></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap"><button type="button" class="tp-btn t_from" title="Start und Deadline mit dem Zeitraum aus der Struktur füllen (noch nicht gespeichert)">Aus Struktur füllen</button>
        <button type="button" class="tp-btn t_to" title="Die Blöcke in der Struktur an Start und Deadline der ToDo-App anpassen">Struktur angleichen</button></div>
    </div>`;
  };
  document.body.insertAdjacentHTML("beforeend", `<div class="modal-bg" id="modalBg"><div class="modal">
    <h2>Start und Deadline bearbeiten</h2>
    <p class="muted" style="font-size:13px;margin-bottom:10px">Oben siehst du den Zeitraum in der Struktur, darunter Start, Laufzeit und Deadline des Meta-Projekts in der ToDo-App. Erst „Übernehmen“ schreibt die Änderungen in den Arbeitsbereich. Die Blöcke in der Struktur werden dabei nicht verändert.</p>
    ${rows.map(card).join("")}
    <div class="modal-actions"><button class="btn-ghost" id="tmt_x">Abbrechen</button><button class="btn-primary" id="tmt_ok">Übernehmen</button></div></div></div>`);
  const root = $("modalBg");
  const info = c=>{
    const s = c.querySelector(".t_s").value, d = parseInt(c.querySelector(".t_d").value,10)||0, l = c.querySelector(".t_l").value;
    const sp = wsSpan({date:s, dur:d, dl:l});
    c.querySelector(".t_info").textContent = sp ? "Zeitraum in der ToDo-App: "+wsShortDate(sp.start)+" bis "+wsShortDate(sp.end)+((l && sp.end>l)?" (reicht über die Deadline hinaus)":"") : "Kein Zeitraum in der ToDo-App gesetzt";
  };
  root.querySelectorAll("[data-i]").forEach(c=>{
    const r = rows[+c.dataset.i];
    ["t_s","t_d","t_l"].forEach(k=>{ c.querySelector("."+k).oninput = ()=>info(c); c.querySelector("."+k).onchange = ()=>info(c); });
    c.querySelector(".t_from").onclick = ()=>{ c.querySelector(".t_s").value = r.s; c.querySelector(".t_l").value = r.e; c.querySelector(".t_d").value = ""; info(c); };
    c.querySelector(".t_to").onclick = ()=>{
      const sp = wsSpan({date:c.querySelector(".t_s").value, dur:parseInt(c.querySelector(".t_d").value,10)||0, dl:c.querySelector(".t_l").value});
      if(!sp){ toast("In der ToDo-App ist noch kein Zeitraum gesetzt"); return; }
      const mine = tm.data.blocks.filter(b=>b.src && b.src.ref===r.ref);
      if(mine.length>1 && !confirm("Dieses Meta-Projekt hat "+mine.length+" Blöcke. Sie werden zu einem Block zusammengefasst. Fortfahren?")) return;
      const keep = mine[0]; keep.start = sp.start; keep.end = sp.end;
      mine.slice(1).forEach(b=>{ const i = tm.data.blocks.indexOf(b); if(i>=0){ tm.deleted.add(b.id); tm.data.blocks.splice(i,1); } });
      tmDirty(); root.remove(); render(); toast("Struktur angepasst");
    };
    info(c);
  });
  $("tmt_x").onclick = ()=>root.remove();
  root.onclick = e=>{ if(e.target===root) root.remove(); };
  $("tmt_ok").onclick = async ()=>{
    const jobs = [];
    root.querySelectorAll("[data-i]").forEach(c=>{
      const r = rows[+c.dataset.i], n = r.h.node;
      const s = c.querySelector(".t_s").value, d = parseInt(c.querySelector(".t_d").value,10), l = c.querySelector(".t_l").value;
      const ns = wsIsDate(s)?s:"", nl = wsIsDate(l)?l:"", nd = (d>0 && d<=3660)?d:0;
      if(ns!==(n.date||"") || nl!==(n.dl||"") || nd!==(n.dur>0?n.dur:0)) jobs.push({r, ns, nl, nd});
    });
    root.remove();
    if(!jobs.length){ toast("Keine Änderungen"); return; }
    for(const j of jobs){
      const n = j.r.h.node, doc = j.r.h.doc;
      if(n.type==="heading"){ n.date = j.ns; n.dl = j.nl; n.dur = j.nd; wsTouch(doc); }
      else await wsApplyMenuCore(doc.id, n.id, {date:j.ns, dur:j.nd, dl:j.nl, meta:true, cal:!!(n.link && n.link.cal)});
    }
    toast(jobs.length+" Meta-Projekt"+(jobs.length===1?"":"e")+" in der ToDo-App aktualisiert");
    render();
  };
}

function tmAct(a, el){
  const sc = document.getElementById("tm_scroll");
  if(a==="left" && sc){ tm.scrollL = Math.max(0, sc.scrollLeft-sc.clientWidth*0.7); sc.scrollLeft = tm.scrollL; }
  else if(a==="right" && sc){ tm.scrollL = sc.scrollLeft+sc.clientWidth*0.7; sc.scrollLeft = tm.scrollL; }
  else if(a==="today" && sc){ tm.scrollL = Math.max(0, (tmDN(todayKey())-3-tm.range.from)*tm.ppd); sc.scrollLeft = tm.scrollL; }
  else if(a==="add"){ const t = todayKey(); tmEdit("", {id:uid(), title:"", start:t, end:tmKey(tmDN(t)+6), color:TP_COLORS[2], done:false, note:"", src:null}); }
  else if(a==="set"){ tm.showSet = !tm.showSet; render(); }
  else if(a==="retry"){ tm.err = ""; render(); }
  else if(a==="pf"){ tm.filter = el.dataset.v; tm.q = ""; tmPoolRender(); }
  else if(a==="padd"){ tmAddFromPool(el.dataset.r); }
  else if(a==="term"){ tmTermView(""); }
}
function tmDragApply(clientX){
  const d = tm.drag; if(!d) return;
  const sc = document.getElementById("tm_scroll"); if(!sc) return;
  const dx = (clientX + sc.scrollLeft) - (d.x0 + d.sl0);
  if(Math.abs(dx)>4) d.moved = true;
  if(!d.moved) return;
  const dm = Math.round(dx/tm.ppd), R = tm.range;
  let ns = d.s0, ne = d.e0;
  if(d.mode==="m"){ const len = d.e0-d.s0; ns = tpCl(d.s0+dm, R.from, R.to-len); ne = ns+len; }
  else if(d.mode==="l"){ ns = tpCl(d.s0+dm, R.from, d.e0); }
  else { ne = tpCl(d.e0+dm, d.s0, R.to); }
  d.ns = ns; d.ne = ne;
  d.el.style.left = (ns-R.from)*tm.ppd+"px"; d.el.style.width = (ne-ns+1)*tm.ppd+"px";
  const mt = d.el.querySelector(".tp-m"); if(mt) mt.textContent = tmShort(tmKey(ns))+"–"+tmShort(tmKey(ne))+" · "+(ne-ns+1)+" T";
}
function tmDown(e){
  if(view!=="plan" || tp.mode!=="meta") return;
  const b = e.target.closest && e.target.closest(".tm-b"); if(!b || !b.closest("#tm_track")) return;
  if(e.target.closest("[data-ck]")) return;
  if(e.pointerType==="mouse" && e.button!==0) return;
  const blk = tmBlock(b.dataset.id); if(!blk) return;
  const h = e.target.closest("[data-h]"), sc = document.getElementById("tm_scroll");
  tm.drag = {id:blk.id, mode:h?h.dataset.h:"m", x0:e.clientX, sl0:sc?sc.scrollLeft:0, s0:tmDN(blk.start), e0:tmDN(blk.end), ns:tmDN(blk.start), ne:tmDN(blk.end), moved:false, el:b, pid:e.pointerId, lastX:e.clientX, timer:null};
  try{ b.setPointerCapture(e.pointerId); }catch(_){}
  b.classList.add("drag");
  tm.drag.timer = setInterval(()=>{
    const d = tm.drag, s2 = document.getElementById("tm_scroll"); if(!d || !s2 || !d.moved) return;
    const r = s2.getBoundingClientRect();
    if(d.lastX < r.left+40) s2.scrollLeft -= 14; else if(d.lastX > r.right-40) s2.scrollLeft += 14; else return;
    tmDragApply(d.lastX);
  }, 30);
  e.preventDefault();
}
function tmMoveEv(e){ const d = tm.drag; if(!d || e.pointerId!==d.pid) return; d.lastX = e.clientX; tmDragApply(e.clientX); }
function tmUp(e){
  const d = tm.drag; if(!d || e.pointerId!==d.pid) return;
  clearInterval(d.timer); tm.drag = null; d.el.classList.remove("drag");
  tm.suppressClick = Date.now();
  const blk = tmBlock(d.id);
  if(d.moved && e.type==="pointerup" && blk){ blk.start = tmKey(d.ns); blk.end = tmKey(d.ne); tmDirty(); render(); }
  else if(!d.moved && e.type==="pointerup" && blk){ tmEdit(blk.id); }
  else render();
}
function tmClick(e){
  if(view!=="plan" || tp.mode!=="meta") return;
  const ck = e.target.closest && e.target.closest("[data-ck]");
  if(ck){ const b = ck.closest(".tm-b"); const blk = b && tmBlock(b.dataset.id); if(blk){ blk.done = !blk.done; tmDirty(); render(); } return; }
  const a = e.target.closest && e.target.closest("[data-tm]");
  if(a){ tmAct(a.dataset.tm, a); return; }
  if(e.target.closest && e.target.closest(".tm-b")) return;
  const track = e.target.closest && e.target.closest("#tm_track");
  if(track){
    if(Date.now()-tm.suppressClick<350) return;
    const x = e.clientX - track.getBoundingClientRect().left, dn = tm.range.from + Math.floor(x/tm.ppd);
    tmEdit("", {id:uid(), title:"", start:tmKey(dn), end:tmKey(dn+6), color:TP_COLORS[2], done:false, note:"", src:null});
  }
}
function tmInput(e){
  if(view!=="plan" || tp.mode!=="meta") return;
  if(e.target.id==="tm_q"){ tm.q = e.target.value; tmPoolRender(); const q = document.getElementById("tm_q"); if(q){ q.focus(); try{ q.setSelectionRange(q.value.length, q.value.length); }catch(_){} } }
}
function tmChange(e){
  if(view!=="plan" || tp.mode!=="meta") return;
  if(e.target.id==="tm_ppd"){ tm.data.settings.ppd = +e.target.value; tm.scrollL = null; tmDirty(); render(); }
}
(function tmInit(){
  main.addEventListener("click", e=>{
    if(view!=="plan") return;
    const mb = e.target.closest && e.target.closest("[data-tpmode]");
    if(mb){ tp.mode = mb.dataset.tpmode==="meta" ? "meta" : "day"; try{ localStorage.setItem("tpMode", tp.mode); }catch(_){} tm.scrollL = null; render(); e.stopPropagation(); }
  }, true);
  main.addEventListener("pointerdown", tmDown);
  main.addEventListener("pointermove", tmMoveEv);
  main.addEventListener("pointerup", tmUp);
  main.addEventListener("pointercancel", tmUp);
  main.addEventListener("click", tmClick);
  main.addEventListener("input", tmInput);
  main.addEventListener("change", tmChange);
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden" && tm.pending) tmSave(); });
})();

/* ---- Bericht erstellen ---- */
function buildReport(days){
  const byId={}; tasks.forEach(t=>byId[t.id]=t);
  const projName={}; projects.forEach(p=>projName[p.id]=p.name);
  const today=todayKey();
  const from=(()=>{ const d=new Date(); d.setDate(d.getDate()-(days-1)); return dateKey(d); })();
  const rel=logs.filter(l=>l.date>=from && l.date<=today);
  const fmt=(k)=>new Date(k).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"});
  const typeLabel={habit:"Gewohnheit",duty:"Pflichtaufgabe",todo:"ToDo",goal:"Tagesziel"};

  let out=`BERICHT ${fmt(from)} bis ${fmt(today)} (${days} Tage)\n`;
  out+=`Erstellt am ${new Date().toLocaleString("de-DE")}\n`;
  out+=`${"=".repeat(46)}\n\n`;
  out+=`ZUSAMMENFASSUNG\n`;
  out+=`Erledigte Eintraege gesamt: ${rel.length}\n`;
  const activeDays=new Set(rel.map(l=>l.date)).size;
  out+=`Aktive Tage: ${activeDays} von ${days}\n`;
  out+=`Durchschnitt pro Tag: ${(rel.length/days).toFixed(1)}\n\n`;

  // Nach Bereich
  const byType={};
  rel.forEach(l=>{ const t=byId[l.itemId]; const k=t?t.type:"unbekannt"; byType[k]=(byType[k]||0)+1; });
  out+=`NACH BEREICH\n`;
  Object.keys(byType).sort((a,b)=>byType[b]-byType[a]).forEach(k=>{
    out+=`  ${(typeLabel[k]||k).padEnd(18)} ${byType[k]}\n`;
  });
  out+=`\n`;

  // Nach Projekt
  const byProj={};
  rel.forEach(l=>{ const t=byId[l.itemId]; if(t&&t.projectId){ const n=projName[t.projectId]||"(unbekannt)"; byProj[n]=(byProj[n]||0)+1; } });
  const projKeys=Object.keys(byProj).sort((a,b)=>byProj[b]-byProj[a]);
  out+=`NACH PROJEKT\n`;
  out+= projKeys.length? projKeys.map(n=>`  ${n.padEnd(24)} ${byProj[n]}\n`).join("") : `  (keine Projektzuordnungen)\n`;
  out+=`\n`;

  // Nach Tags
  const byTag={};
  rel.forEach(l=>{ const t=byId[l.itemId]; if(t && t.projectId){
    const proj=projects.find(p=>p.id===t.projectId);
    if(proj && proj.tags) proj.tags.forEach(tag=>{ byTag[tag]=(byTag[tag]||0)+1; });
  } });
  const tagKeys=Object.keys(byTag).sort((a,b)=>byTag[b]-byTag[a]);
  out+=`NACH TAG\n`;
  out+= tagKeys.length? tagKeys.map(n=>`  ${n.padEnd(24)} ${byTag[n]}\n`).join("") : `  (keine Tag-Zuordnungen)\n`;
  out+=`\n`;

  // Chronologisch
  out+=`ERLEDIGT IM DETAIL\n`;
  const byDate={};
  rel.forEach(l=>{ (byDate[l.date]=byDate[l.date]||[]).push(l); });
  Object.keys(byDate).sort().reverse().forEach(d=>{
    out+=`\n${fmt(d)}\n`;
    byDate[d].forEach(l=>{
      const t=byId[l.itemId];
      const n=notes.find(x=>x.id===l.itemId);
      if(n){ // Notiz
        const title=n.text.split('\n')[0].substring(0,60);
        const proj=(n.projectId && projName[n.projectId])?` [${projName[n.projectId]}]`:"";
        out+=`  - ${title}${proj} (Notiz)\n`;
      }else if(t){ // Aufgabe
        const title=t.title;
        const typ=typeLabel[t.type]||t.type;
        const proj=(t.projectId&&projName[t.projectId])?` [${projName[t.projectId]}]`:"";
        out+=`  - ${title}${proj} (${typ})\n`;
      }else{
        out+=`  - (geloeschter Eintrag)\n`;
      }
    });
  });
  out+=`\n`;

  // Offene Punkte
  const openTodos=tasks.filter(t=>!t.archived && t.type==="todo" && !isEverDone(t.id));
  const overdue=openTodos.filter(t=>t.startDate && t.startDate<today);
  out+=`${"=".repeat(46)}\n`;
  out+=`OFFEN ZUM STICHTAG\n`;
  out+=`Offene ToDos: ${openTodos.length}, davon ueberfaellig: ${overdue.length}\n`;
  if(overdue.length){
    overdue.sort((a,b)=>a.startDate.localeCompare(b.startDate)).forEach(t=>{
      out+=`  - ${t.title} (faellig ${fmt(t.startDate)})\n`;
    });
  }
  const openProj=projects.filter(p=>!p.archived);
  out+=`\nAktive Projekte: ${openProj.length}\n`;
  openProj.sort((a,b)=>b.priority-a.priority).forEach(p=>{
    const n=tasks.filter(t=>t.projectId===p.id && !t.archived && !isEverDone(t.id)).length;
    out+=`  - ${p.name} (Prio ${p.priority}, ${n} offene ToDos)\n`;
  });
  return out;
}

function openReport(days){
  const text=buildReport(days);
  main.insertAdjacentHTML("beforeend",
    `<div class="modal-bg" id="modalBg"><div class="modal">
      <h2>Bericht (${days} Tage)</h2>
      <textarea id="r_text" readonly style="width:100%;height:280px;padding:8px;border:1px solid var(--line);border-radius:6px;font-family:monospace;font-size:11px;resize:vertical;white-space:pre"></textarea>
      <div class="modal-actions">
        <button class="btn-ghost" id="r_close">Schliessen</button>
        <button class="btn-ghost" id="r_copy">Kopieren</button>

      </div>
    </div></div>`);
  $("r_text").value=text;
  $("r_close").onclick=()=>$("modalBg").remove();
  $("modalBg").onclick=(e)=>{ if(e.target.id==="modalBg") $("modalBg").remove(); };
  $("r_copy").onclick=async()=>{
    try{ await navigator.clipboard.writeText(text); toast("In die Zwischenablage kopiert"); }
    catch(e){ const ta=$("r_text"); ta.removeAttribute("readonly"); ta.select(); toast("Text markiert - bitte manuell kopieren"); }
  };
  $("r_dl").onclick=()=>{

    const a=document.createElement("a");
    a.href=url; a.download=`Bericht_${todayKey()}_${days}Tage.txt`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1000);

  };

/* ---- Bilanz berechnen und bei Tagsübergang abziehen ---- */
function checkGoalsPenalty(){
  const today=todayKey();
  const lastDay=localStorage.getItem("bilanzDay");
  
  // Wenn Tagsübergang: Ziele vom gestrigen Tag prüfen
  if(lastDay && lastDay!==today){
    const yesterdayGoalIdsStr=localStorage.getItem("openGoals-"+lastDay);
    if(yesterdayGoalIdsStr){
      try{
        const yesterdayGoalIds=JSON.parse(yesterdayGoalIdsStr);
        // Prüfe, welche dieser Ziele nicht in heute's completed sind
        const todayCompletedStr=localStorage.getItem("completedGoals-"+today);
        const todayCompleted=todayCompletedStr?JSON.parse(todayCompletedStr):[];
        const unfinished=yesterdayGoalIds.filter(id=>!todayCompleted.includes(id)).length;
        if(unfinished>0){
          bilanz-=(unfinished*2);
          console.log(`📉 ${unfinished} Ziele vom ${lastDay} nicht erfüllt → Bilanz: ${bilanz}`);
        }
      }catch(e){
        console.error("Fehler beim Bilanz-Check:", e);
      }
    }
  }
  
  // Speichere heutige offene Ziel-IDs für morgen
  const openGoals=goalTasks.filter(g=>!g.completed).map(g=>g.id);
  localStorage.setItem("openGoals-"+today, JSON.stringify(openGoals));
  
  // Speichere heutige erledigte Ziel-IDs
  const completedGoals=goalTasks.filter(g=>g.completed).map(g=>g.id);
  localStorage.setItem("completedGoals-"+today, JSON.stringify(completedGoals));
  
  localStorage.setItem("bilanzDay", today);
  
  // Bilanz für heute aus localStorage laden (falls schon was da ist)
  const bilanzKey="bilanz-"+today;
  const savedBilanz=localStorage.getItem(bilanzKey);
  if(savedBilanz!==null) bilanz=parseInt(savedBilanz);
  else bilanz=0;
  
  saveBilanz();
}

/* ---- Bilanz speichern ---- */
function saveBilanz(){
  const today=todayKey();
  localStorage.setItem("bilanz-"+today, bilanz);
}

      const on=[...tagEl.querySelectorAll("button[data-tag]")].filter(x=>x.dataset.tag && x.classList.contains("sel")).map(x=>x.dataset.tag);
      tagEl.querySelector('button[data-tag=""]').classList.toggle("sel", on.length===0);
      selectedTag=on.join(",");
    });
  }

  // Interaktionen
  const segSel={v: (existing&&existing.scheduleType)|| (type==="duty"?"daily":"once")};
  const segEl=$("f_sched");
  if(segEl) segEl.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    segEl.querySelectorAll("button").forEach(x=>x.classList.remove("sel"));
    b.classList.add("sel"); segSel.v=b.dataset.v; });
  const syncBtn=$("f_sync"); if(syncBtn) syncBtn.onclick=()=>syncBtn.classList.toggle("on");
  const weeklyBtn=$("f_weekly");
  function updWdHint(){ if(!weeklyBtn) return; const s=$("f_start").value; const wd=parseDate(s);
    $("wdHint").textContent = weeklyBtn.classList.contains("on") && wd ? "jeden "+WEEKDAYS[wd.getDay()] : ""; }
  if(weeklyBtn){ weeklyBtn.onclick=()=>{ weeklyBtn.classList.toggle("on"); updWdHint(); };
    $("f_start").onchange=updWdHint; updWdHint(); }
  const onceBtn=$("f_once");
  if(onceBtn){ onceBtn.onclick=()=>{ 
    onceBtn.classList.toggle("on");
    const box=$("f_repeatBox");
    if(box) box.style.display=onceBtn.classList.contains("on")?"none":"block";
  }; }
  $("f_cancel").onclick=()=>$("modalBg").remove();
  $("modalBg").onclick=(e)=>{ if(e.target.id==="modalBg") $("modalBg").remove(); };

  const doSave=async()=>{
    const title=$("f_title").value.trim();
    if(!title){ toast("Titel fehlt"); return; }
    const convertingToGoal = type==="goal" && origType && origType!=="goal";
    const convertingFromGoal = origType==="goal" && type!=="goal";
    // Ziele laufen über Google Tasks, nicht über das Sheet
    if(type==="goal"){ 
      const goalDate=$("f_goaldate").value||todayKey();
      $("modalBg").remove(); 
      if(convertingToGoal){
        if(existing && existing.id) await deleteTask(existing.id);
        await addGoalTask(title, goalDate);
      } else if(isEdit){
        await updateGoalTask(existing.id, title, goalDate);
      } else {
        await addGoalTask(title, goalDate); 
      }
      return; 
    }
    const data={type, title, syncCalendar: syncBtn ? syncBtn.classList.contains("on") : false};
    if(type==="habit"){ data.scheduleType="daily"; data.startDate=t.startDate||todayKey(); }
    if(type==="duty"){ 
      const onceBtn=$("f_once");
      data.scheduleType=onceBtn && onceBtn.classList.contains("on")?"once":segSel.v; 
      data.startDate=$("f_start").value; 
      const wd=parseDate(data.startDate); data.weekday=wd?String(wd.getDay()):""; 
    }
    if(type==="todo"){ data.startDate=$("f_start").value;
      data.scheduleType=weeklyBtn.classList.contains("on")?"weekly":"once";
      const wd=parseDate(data.startDate); data.weekday=wd?String(wd.getDay()):""; }
    const ft=$("f_time"); if(ft && ft.value) data.startTime=ft.value;
    data.tag=selectedTag||"";
    const cs=$("f_cal"); if(cs) data.calendarId=cs.value;
    const fn=$("f_notes"); if(fn && fn.value.trim()) data.notes=fn.value.trim();
    $("modalBg").remove();
    if(convertingFromGoal){
      if(existing && existing.id) await deleteGTask(existing.id);
      await addTask(data);
    } else if(isEdit){
      await updateTask(existing.id, data);
    } else {
      await addTask(data);
    }
  };
  $("f_save").onclick=doSave;
  // Enter speichert – außer im mehrzeiligen Notizfeld
  $("modalBg").addEventListener("keydown",(e)=>{
    if(e.key==="Enter" && e.target.tagName!=="TEXTAREA"){ e.preventDefault(); doSave(); }
  });
  // Cursor direkt ins Titelfeld
  setTimeout(()=>{ const ft=$("f_title"); if(ft) ft.focus(); },50);
}
