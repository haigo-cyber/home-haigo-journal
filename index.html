/* ============ ARBEITSBEREICH (ehemals Notizen-Reiter) ============ */
/* Dokumente aus Blöcken (Text, Überschrift, Gliederung, Tabelle), Fokus-Notiz in der Heute-Ansicht,
   Gantt-Ansicht direkt aus den Punkten (Start, Laufzeit, Deadline, Meta-Projekt).
   Speicherung: Tabellenblatt "Workspace" in der ToDo-Tabelle, JSON auf mehrere Zellen verteilt (Zellgrenze 50000 Zeichen). */
const WS_TAB = "Workspace";
const WS_CHUNK = 40000;
const WS_MAXROWS = 2000;

/* WS-PURE-START */
let _wsCnt = 0;
function wsId(){ return Date.now().toString(36) + (++_wsCnt).toString(36) + Math.random().toString(36).slice(2,5); }
function wsNewNode(text){ return {id:wsId(), text:text||"", done:false, collapsed:false, date:"", ld:"", dur:0, dl:"", meta:false, hid:false, tag:"", link:null, aopen:false, att:[], children:[]}; }
/* Anhang an einem Punkt: Text (auch als Notiz nutzbar) oder Tabelle; trägt wie ein Punkt Datum, Erledigt-Haken und Verknüpfung */
function wsNewAtt(type){
  const a = {id:wsId(), type:type, title:"", done:false, date:"", link:null, tag:""};
  if(type==="table"){ a.cols = ["Spalte 1","Spalte 2"]; a.rows = [["",""],["",""]]; }
  else if(type==="link") a.url = "";
  else if(type==="file"){ a.fileId = ""; a.name = ""; a.mime = ""; a.size = 0; }
  else a.text = "";
  return a;
}
function wsIsAtt(x){ return !!x && !Array.isArray(x.children) && typeof x.done==="boolean" && (x.type==="text" || x.type==="table" || x.type==="link" || x.type==="file"); }   // Blöcke haben kein done
function wsTitleOf(x){
  if(!x) return "";
  if(!wsIsAtt(x)) return (x.text||"").trim();
  if((x.title||"").trim()) return x.title.trim();
  if(x.type==="link") return (x.url||"").trim().slice(0,80);
  if(x.type==="file") return (x.name||"").trim().slice(0,80);
  return x.type==="text" ? (x.text||"").trim().split("\n")[0].slice(0,80) : "";
}
function wsSetTitle(x, v){ if(wsIsAtt(x)) x.title = v; else x.text = v; }
function wsNormAtt(a){
  if(!a || typeof a!=="object" || (a.type!=="text" && a.type!=="table" && a.type!=="link" && a.type!=="file")) return null;
  const o = {id:a.id||wsId(), type:a.type, title:String(a.title||""), done:!!a.done, date:wsIsDate(a.date)?a.date:"", link:wsNormLink(a.link), tag:wsNormTag(a.tag)};
  if(a.type==="text") o.text = String(a.text||"");
  else if(a.type==="link") o.url = String(a.url||"").trim().slice(0,2000);
  else if(a.type==="file"){ o.fileId = String(a.fileId||"").slice(0,200); o.name = String(a.name||"").slice(0,300); o.mime = String(a.mime||"").slice(0,120); o.size = Math.max(0, Math.floor(+a.size||0)); }
  else{
    o.cols = (Array.isArray(a.cols) && a.cols.length) ? a.cols.map(String) : ["Spalte 1"];
    o.rows = (Array.isArray(a.rows)?a.rows:[]).map(r=>{ const row=(Array.isArray(r)?r:[]).map(String); while(row.length<o.cols.length) row.push(""); return row.slice(0,o.cols.length); });
  }
  return o;
}
function wsAddDays(d, k){
  const t = new Date(+d.slice(0,4), +d.slice(5,7)-1, +d.slice(8,10)+k);
  return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
}
/* Tag, an dem das verknüpfte ToDo / Tages-Ziel gilt: bei gesetzter Deadline deren Tag (ld), sonst der Start */
function wsLinkDay(x){ return x.ld || x.date || ""; }
function wsSetLinkDay(x, d){ if(x.ld || x.dl) x.ld = d; else x.date = d; }
/* gewünschter Tag der Verknüpfung: neu -> Deadline, sonst Start, sonst heute; bestehend -> folgt einer neuen/geänderten Deadline, ohne Deadline dem Start */
function wsPlanDay(n, date0, newDl, isLinked, today){
  if(!isLinked) return newDl || date0 || today;
  if(newDl) return newDl!==(n.dl||"") ? newDl : wsLinkDay(n);
  return date0;
}
/* Zeitraum eines Punktes: Start + Laufzeit (Kalendertage) ergibt das Ende; ohne Start rückwärts von der Deadline */
function wsSpan(n){
  const s = n.date||"", dl = n.dl||"", dur = n.dur>0 ? Math.floor(n.dur) : 0;
  if(s && dur) return {start:s, end:wsAddDays(s,dur-1), dl};
  if(s) return {start:s, end:(dl && dl>=s) ? dl : s, dl};
  if(dl && dur) return {start:wsAddDays(dl,-(dur-1)), end:dl, dl};
  if(dl) return {start:dl, end:dl, dl};
  return null;
}
function wsAllNodes(doc){
  const out = [];
  const walk = (items)=>items.forEach(n=>{ out.push(n); walk(n.children); });
  doc.blocks.forEach(b=>{ if(b.type==="outline") walk(b.items); });
  return out;
}
/* Punkt oder Anhang anhand der ID */
function wsFindAny(doc, id){
  const r = wsFindNode(doc, id); if(r) return r.node;
  for(const n of wsAllNodes(doc)){ const a = n.att.find(x=>x.id===id); if(a) return a; }
  return null;
}
function wsAttOwner(doc, aid){ return wsAllNodes(doc).find(n=>n.att.some(a=>a.id===aid)) || null; }
function wsIsDate(s){ return typeof s==="string" && /^\d{4}-\d{2}-\d{2}$/.test(s); }
/* link: Verknüpfung mit einem ToDo (Sheet-Zeile) oder Tages-Ziel (Google Task); evId/calId: vom Punkt selbst angelegter Kalendertermin (nur Ziele) */
function wsNormLink(l){
  if(!l || typeof l!=="object") return null;
  if((l.kind!=="todo" && l.kind!=="goal") || !l.ref) return null;
  return {kind:l.kind, ref:String(l.ref), cal:!!l.cal, evId:String(l.evId||""), calId:String(l.calId||"")};
}
function wsShortDate(d){
  if(!wsIsDate(d)) return "";
  const dt = new Date(+d.slice(0,4), +d.slice(5,7)-1, +d.slice(8,10));
  return ["So","Mo","Di","Mi","Do","Fr","Sa"][dt.getDay()] + " " + d.slice(8,10) + "." + d.slice(5,7) + ".";
}
function wsCollectLinkedNodes(list, out){
  out = out || [];
  (list||[]).forEach(n=>{ if(n.link) out.push(n); (n.att||[]).forEach(a=>{ if(a.link) out.push(a); }); wsCollectLinkedNodes(n.children, out); });
  return out;
}
function wsDocLinkedNodes(doc){
  const out = [];
  doc.blocks.forEach(b=>{ if(b.type==="outline") wsCollectLinkedNodes(b.items, out); });
  return out;
}
function wsFindByLink(docs, kind, ref){
  for(const doc of docs){
    for(const n of wsDocLinkedNodes(doc)){
      if(n.link.kind===kind && n.link.ref===ref) return {doc, node:n};
    }
  }
  return null;
}
function wsNewDoc(title){
  const now = new Date().toISOString();
  return {id:wsId(), title:title||"Neues Dokument", pinned:false, tag:"", inbox:false, seen:[], focus:[], createdAt:now, updatedAt:now, blocks:[]};
}
function wsNewBlock(type){
  if(type==="text") return {id:wsId(), type:"text", text:"", tag:""};
  if(type==="heading") return {id:wsId(), type:"heading", text:"", tag:"", collapsed:false, lvl:1, done:false, date:"", dur:0, dl:"", meta:false};
  if(type==="outline") return {id:wsId(), type:"outline", items:[wsNewNode("")], tag:""};
  if(type==="table") return {id:wsId(), type:"table", cols:["Spalte 1","Spalte 2","Spalte 3"], rows:[["","",""],["","",""]], tag:""};
  return null;
}
function wsNormNodes(a){
  return (Array.isArray(a)?a:[]).filter(n=>n && typeof n==="object").map(n=>({
    id:n.id||wsId(), text:String(n.text||""), done:!!n.done, collapsed:!!n.collapsed,
    date:wsIsDate(n.date)?n.date:"", ld:wsIsDate(n.ld)?n.ld:"", dur:(n.dur>0 && n.dur<=3660)?Math.floor(n.dur):0, dl:wsIsDate(n.dl)?n.dl:"", meta:!!n.meta, hid:!!n.hid, tag:wsNormTag(n.tag),
    link:wsNormLink(n.link), aopen:!!n.aopen, att:(Array.isArray(n.att)?n.att:[]).map(wsNormAtt).filter(Boolean), children:wsNormNodes(n.children)
  }));
}
function wsNormalizeDocs(arr){
  if(!Array.isArray(arr)) return [];
  return arr.filter(d=>d && typeof d==="object").map(d=>{
    const doc = {id:d.id||wsId(), title:String(d.title||""), pinned:!!d.pinned, tag:wsNormTag(d.tag),
      inbox:!!d.inbox, seen:(Array.isArray(d.seen)?d.seen:[]).filter(k=>typeof k==="string").slice(-3000),
      focus:(Array.isArray(d.focus)?d.focus:[]).filter(k=>typeof k==="string").slice(0,500),
      createdAt:d.createdAt||new Date().toISOString(), updatedAt:d.updatedAt||d.createdAt||new Date().toISOString(), blocks:[]};
    (Array.isArray(d.blocks)?d.blocks:[]).forEach(b=>{
      if(!b || typeof b!=="object") return;
      const id = b.id||wsId();
      if(b.type==="text") doc.blocks.push({id, type:b.type, text:String(b.text||""), tag:wsNormTag(b.tag)});
      else if(b.type==="heading") doc.blocks.push({id, type:b.type, text:String(b.text||""), tag:wsNormTag(b.tag), collapsed:!!b.collapsed, lvl:(b.lvl>=2)?2:1, done:!!b.done, date:wsIsDate(b.date)?b.date:"", dur:(b.dur>0 && b.dur<=3660)?Math.floor(b.dur):0, dl:wsIsDate(b.dl)?b.dl:"", meta:!!b.meta});
      else if(b.type==="outline") doc.blocks.push({id, type:"outline", items:wsNormNodes(b.items), tag:wsNormTag(b.tag)});
      else if(b.type==="table"){
        const cols = (Array.isArray(b.cols) && b.cols.length) ? b.cols.map(String) : ["Spalte 1"];
        const rows = (Array.isArray(b.rows)?b.rows:[]).map(r=>{
          const row = (Array.isArray(r)?r:[]).map(String);
          while(row.length<cols.length) row.push("");
          return row.slice(0, cols.length);
        });
        doc.blocks.push({id, type:"table", cols, rows, tag:wsNormTag(b.tag)});
      }
    });
    return doc;
  });
}

/* ---- Speicherformat: JSON in Stücken zu je WS_CHUNK Zeichen ---- */
function wsSerialize(docs, trash){
  const o = {v:1, savedAt:new Date().toISOString(), docs};
  if(trash && trash.length) o.trash = trash;
  return JSON.stringify(o);
}
function wsParse(text){
  if(!text || !text.trim()) return [];
  const data = JSON.parse(text);               // Fehler absichtlich nicht abfangen: kaputte Daten dürfen nie als "leer" gelten
  if(Array.isArray(data)) return wsNormalizeDocs(data);
  if(data && Array.isArray(data.docs)) return wsNormalizeDocs(data.docs);
  throw new Error("Unbekanntes Format im Tabellenblatt Workspace");
}
function wsToChunks(json){
  const out = []; let i = 0;
  while(i < json.length){
    let end = Math.min(i + WS_CHUNK, json.length);
    if(end < json.length){
      // keine Aufteilung mitten in einem Surrogatpaar und nicht neben einem Leerzeichen (Zellen könnten Leerraum am Rand verlieren)
      const c = json.charCodeAt(end-1);
      if(c>=0xD800 && c<=0xDBFF) end--;
      while(end>i+1 && (json[end-1]===" " || json[end]===" ")) end--;
    }
    out.push(json.slice(i, end)); i = end;
  }
  if(!out.length) out.push("[]");
  return out;
}
/* ---- Papierkorb: gelöschte Einträge bleiben 3 Tage erhalten ---- */
const WS_TRASH_MS = 3*24*3600*1000;
function wsTrashItem(kind, doc, obj, where){
  let label = "";
  if(kind==="node") label = obj.text || "(leerer Punkt)";
  else if(kind==="att") label = obj.title || obj.name || obj.url || String(obj.text||"").split("\n")[0] || "Anhang";
  else if(kind==="block") label = obj.type==="heading" ? (obj.text||"(Überschrift)") : obj.type==="outline" ? obj.items.length+" Punkte" : obj.type==="table" ? "Tabelle" : (String(obj.text||"").split("\n")[0] || "(Notiz)");
  else label = obj.title || "(Dokument)";
  return {id:wsId(), kind, deletedAt:new Date().toISOString(), docId:doc?doc.id:obj.id, docTitle:doc?(doc.title||""):(obj.title||""), label:String(label).slice(0,80), where:where||{}, data:JSON.parse(JSON.stringify(obj))};
}
function wsTrashNorm(arr){
  const out = [];
  (Array.isArray(arr)?arr:[]).forEach(i=>{
    if(!i || typeof i!=="object" || !i.id || !["node","att","block","doc"].includes(i.kind) || !i.data || isNaN(Date.parse(i.deletedAt))) return;
    let data = null;
    if(i.kind==="node") data = wsNormNodes([i.data])[0];
    else if(i.kind==="att") data = wsNormAtt(i.data);
    else if(i.kind==="block"){ const d = wsNormalizeDocs([{blocks:[i.data]}])[0]; data = d && d.blocks[0]; }
    else data = wsNormalizeDocs([i.data])[0];
    if(!data) return;
    const w = i.where && typeof i.where==="object" ? i.where : {};
    out.push({id:String(i.id), kind:i.kind, deletedAt:String(i.deletedAt), docId:String(i.docId||""), docTitle:String(i.docTitle||""), label:String(i.label||"").slice(0,80),
      where:{blockId:String(w.blockId||""), parentId:String(w.parentId||""), ownerId:String(w.ownerId||""), index:Math.max(0, parseInt(w.index,10)||0)}, data});
  });
  return out;
}
function wsParseTrash(text){
  if(!text || !text.trim()) return [];
  const data = JSON.parse(text);
  return (data && !Array.isArray(data) && Array.isArray(data.trash)) ? wsTrashNorm(data.trash) : [];
}
function wsTrashLive(items, now){ return items.filter(i=>Date.parse(i.deletedAt)+WS_TRASH_MS > now); }
/* Abgleich mit dem Serverstand: Server gewinnt; lokal neu Hinzugekommene (adds) bleiben, lokal Entfernte (gone) bleiben weg; Abgelaufenes fällt heraus */
function wsMergeTrash(local, server, adds, gone, now){
  const out = [], seen = new Set();
  server.forEach(i=>{ if(!gone.has(i.id) && !seen.has(i.id)){ out.push(i); seen.add(i.id); } });
  local.forEach(i=>{ if(!seen.has(i.id) && adds.has(i.id)){ out.push(i); seen.add(i.id); } });
  return wsTrashLive(out, now).sort((a,b)=>b.deletedAt.localeCompare(a.deletedAt));
}
function wsStripLinks(n){ n.link = null; (n.att||[]).forEach(a=>{ a.link = null; }); (n.children||[]).forEach(wsStripLinks); }
/* Eintrag zurücklegen. Verknüpfungen mit ToDos/Zielen werden dabei gelöst (sie wurden beim Löschen freigegeben). */
function wsRestore(docs, item){
  const data = JSON.parse(JSON.stringify(item.data)), w = item.where || {};
  if(item.kind==="doc"){
    if(docs.some(d=>d.id===data.id)) return {ok:false, msg:"Ein Dokument mit dieser Kennung gibt es schon."};
    data.blocks.forEach(b=>{ if(b.type==="outline") b.items.forEach(wsStripLinks); });
    docs.push(data); return {ok:true, doc:data, docId:data.id};
  }
  const doc = docs.find(d=>d.id===item.docId);
  if(!doc) return {ok:false, msg:"Das Dokument gibt es nicht mehr. Stelle zuerst das Dokument wieder her."};
  if(item.kind==="block"){
    if(doc.blocks.some(b=>b.id===data.id)) return {ok:false, msg:"Der Block ist schon vorhanden."};
    if(data.type==="outline") data.items.forEach(wsStripLinks);
    doc.blocks.splice(Math.min(w.index||0, doc.blocks.length), 0, data); return {ok:true, doc, docId:doc.id};
  }
  if(item.kind==="att"){
    if(wsFindAny(doc, data.id)) return {ok:false, msg:"Der Anhang ist schon vorhanden."};
    const ow = w.ownerId ? wsFindNode(doc, w.ownerId) : null;
    if(!ow) return {ok:false, msg:"Der Punkt, an dem der Anhang hing, existiert nicht mehr."};
    data.link = null; ow.node.att.splice(Math.min(w.index||0, ow.node.att.length), 0, data); ow.node.aopen = true;
    return {ok:true, doc, docId:doc.id};
  }
  if(wsFindNode(doc, data.id)) return {ok:false, msg:"Der Punkt ist schon vorhanden."};
  wsStripLinks(data);
  const par = w.parentId ? wsFindNode(doc, w.parentId) : null;
  if(par){ par.node.children.splice(Math.min(w.index||0, par.node.children.length), 0, data); par.node.collapsed = false; return {ok:true, doc, docId:doc.id}; }
  let blk = w.blockId ? doc.blocks.find(b=>b.id===w.blockId && b.type==="outline") : null;
  if(!blk) blk = doc.blocks.find(b=>b.type==="outline");
  if(!blk){ blk = {id:wsId(), type:"outline", items:[], tag:""}; doc.blocks.push(blk); }
  blk.items.splice(Math.min(w.index||0, blk.items.length), 0, data);
  return {ok:true, doc, docId:doc.id};
}
function wsFromChunks(rows){ return (rows||[]).map(r=>(r && r[0]!==undefined) ? r[0] : "").join(""); }

/* ---- Abgleich mit dem Serverstand (server-first, nur lokal geänderte Dokumente gewinnen) ---- */
function wsMergeDocs(local, server, dirty, deleted){
  const sMap = new Map(server.map(d=>[d.id, d]));
  const out = []; const seen = new Set();
  local.forEach(d=>{
    if(dirty.has(d.id)){ out.push(d); seen.add(d.id); }
    else if(sMap.has(d.id)){ out.push(sMap.get(d.id)); seen.add(d.id); }
    // weder lokal geändert noch auf dem Server: anderswo gelöscht, also weglassen
  });
  server.forEach(d=>{ if(!seen.has(d.id) && !deleted.has(d.id)) out.push(d); });
  return out;
}
function wsFixPinned(docs){
  const pinned = docs.filter(d=>d.pinned);
  if(pinned.length>1){
    pinned.sort((a,b)=>(b.updatedAt||"").localeCompare(a.updatedAt||""));
    pinned.slice(1).forEach(d=>{ d.pinned = false; });
  }
  return docs;
}

/* ---- Gliederung ---- */
function wsFindIn(list, nid, block, parent){
  for(let i=0;i<list.length;i++){
    const n = list[i];
    if(n.id===nid) return {block, list, index:i, node:n, parent};
    const r = wsFindIn(n.children, nid, block, n);
    if(r) return r;
  }
  return null;
}
function wsFindNode(doc, nid){
  for(const b of doc.blocks){
    if(b.type!=="outline") continue;
    const r = wsFindIn(b.items, nid, b, null);
    if(r) return r;
  }
  return null;
}
function wsContains(node, nid){ return node.id===nid || node.children.some(c=>wsContains(c, nid)); }
/* pos: "before" | "after" | "into". Der Teilbaum (alle Unterpunkte) wandert immer mit. */
function wsMoveNode(doc, nid, targetId, pos){
  if(nid===targetId) return false;
  const src = wsFindNode(doc, nid); if(!src) return false;
  if(wsContains(src.node, targetId)) return false;       // nie in den eigenen Teilbaum
  if(!wsFindNode(doc, targetId)) return false;
  const [node] = src.list.splice(src.index, 1);
  const tgt = wsFindNode(doc, targetId);
  if(pos==="into"){ tgt.node.children.push(node); tgt.node.collapsed = false; }
  else tgt.list.splice(tgt.index + (pos==="after"?1:0), 0, node);
  return true;
}
/* Abschnitte eines Dokuments: jede Gliederung mit der Überschrift davor; Überschriften ohne Gliederung bieten "neue Gliederung anlegen" */
function wsSections(doc){
  const secs = [{head:null, outs:[]}];
  doc.blocks.forEach(b=>{ if(b.type==="heading") secs.push({head:b, outs:[]}); else if(b.type==="outline") secs[secs.length-1].outs.push(b); });
  const out = [];
  secs.forEach(s=>{
    const hl = s.head ? ((s.head.text||"").trim() || "(Überschrift ohne Text)") : "(vor der ersten Überschrift)";
    if(s.outs.length) s.outs.forEach((b,i)=>out.push({id:b.id, headId:s.head?s.head.id:"", label:hl+" › Punkte"+(s.outs.length>1?" "+(i+1):"")}));
    else if(s.head || secs.length===1) out.push({id:"", headId:s.head?s.head.id:"", label:hl+" › neue Punkte anlegen"});
  });
  return out;
}
/* Punkt (samt Unterpunkten) oder Anhang in einen anderen Block, unter eine andere Überschrift oder in ein anderes Dokument verschieben.
   tgt: {block: Gliederungs-ID oder "" (= neue Gliederung hinter der Überschrift headId), mode: "top"|"end"|"child", parent: Punkt-ID} */
function wsMoveTo(srcDoc, dstDoc, id, tgt){
  const src = wsFindNode(srcDoc, id);
  if(!src){
    const ow = wsAttOwner(srcDoc, id); if(!ow) return false;
    const t = tgt.parent ? wsFindNode(dstDoc, tgt.parent) : null;
    if(!t || t.node===ow) return false;
    const i = ow.att.findIndex(a=>a.id===id), [a] = ow.att.splice(i, 1);
    t.node.att.push(a); t.node.aopen = true; return true;
  }
  let blk = tgt.block ? dstDoc.blocks.find(b=>b.id===tgt.block && b.type==="outline") : null;
  if(tgt.mode==="child"){
    if(!tgt.parent || wsContains(src.node, tgt.parent) || !wsFindNode(dstDoc, tgt.parent)) return false;
  }else if(tgt.block && !blk) return false;
  src.list.splice(src.index, 1);
  if(tgt.mode==="child"){ const t = wsFindNode(dstDoc, tgt.parent); t.node.children.push(src.node); t.node.collapsed = false; return true; }
  if(!blk){
    blk = {id:wsId(), type:"outline", items:[], tag:""};
    let at = 0; if(tgt.headId){ const hi = dstDoc.blocks.findIndex(b=>b.id===tgt.headId); at = hi<0 ? dstDoc.blocks.length : hi+1; }
    dstDoc.blocks.splice(at, 0, blk);
  }
  if(tgt.mode==="top") blk.items.unshift(src.node); else blk.items.push(src.node);
  return true;
}
function wsIndent(doc, nid){
  const src = wsFindNode(doc, nid); if(!src || src.index===0) return false;
  const prev = src.list[src.index-1];
  src.list.splice(src.index, 1);
  prev.children.push(src.node); prev.collapsed = false;
  return true;
}
function wsOutdent(doc, nid){
  const src = wsFindNode(doc, nid); if(!src || !src.parent) return false;
  const par = wsFindNode(doc, src.parent.id);
  src.list.splice(src.index, 1);
  par.list.splice(par.index+1, 0, src.node);
  return true;
}
function wsAddSibling(doc, nid){
  const src = wsFindNode(doc, nid); if(!src) return null;
  const n = wsNewNode("");
  src.list.splice(src.index+1, 0, n);
  return n;
}
function wsAddChild(doc, nid){
  const src = wsFindNode(doc, nid); if(!src) return null;
  const n = wsNewNode("");
  src.node.children.push(n); src.node.collapsed = false;
  return n;
}
function wsDeleteNode(doc, nid){
  const src = wsFindNode(doc, nid); if(!src) return false;
  src.list.splice(src.index, 1); return true;
}
function wsCount(node){
  let done = 0, total = 0;
  node.children.forEach(c=>{ total++; if(c.done) done++; const s = wsCount(c); total += s.total; done += s.done; });
  return {done, total};
}
function wsAllDone(n){ return n.done && n.children.every(wsAllDone); }
/* Nächste offene Schritte: Blätter bzw. Knoten, deren Unterpunkte alle erledigt sind, in Dokumentreihenfolge */
function wsNextOpen(doc, max){ return wsNextOpenItems(doc, max).map(n=>n.text.trim()); }
function wsNextOpenItems(doc, max, vis, sort){
  const out = [];
  const walk = (items)=>{
    for(const n of (sort ? sort(items) : items)){
      if(out.length>=max) return;
      if(n.done) continue;
      if(vis && !vis(n)) continue;
      const open = n.children.filter(c=>!wsAllDone(c));
      if(n.children.length && open.length) walk(n.children);
      else if((n.text||"").trim()) out.push(n);
    }
  };
  doc.blocks.filter(b=>b.type==="outline").forEach(b=>walk(b.items));
  return out;
}
function wsOpenCount(doc){
  let n = 0;
  const walk = (items)=>items.forEach(i=>{ if(!i.done && (i.text||"").trim()) n++; walk(i.children); });
  doc.blocks.filter(b=>b.type==="outline").forEach(b=>walk(b.items));
  return n;
}

/* ---- Gantt-Zeilen aus der Gliederung ---- */
function wsGanttRows(roots, sel, em, sort){
  const rows = [];
  const walk = (n, level)=>{
    if(wsAllDone(n)) return null;
    if(sel && !wsTagShownNode(n, sel, em)) return null;
    const own = wsSpan(n);
    const row = {id:n.id, title:(n.text||"").trim()||"(ohne Titel)", level, meta:!!n.meta, own, start:null, end:null, agg:false, dl:n.dl||"", late:false, tag:em ? (em.get(n.id)||"") : ""};
    rows.push(row);
    let lo = own ? own.start : null, hi = own ? own.end : null;
    (sort ? sort(n.children) : n.children).forEach(c=>{
      const r = walk(c, level+1);
      if(r && r.start){ if(!lo || r.start<lo) lo = r.start; if(!hi || r.end>hi) hi = r.end; }
    });
    if(lo){ row.start = lo; row.end = hi; row.agg = !own || lo!==own.start || hi!==own.end; }
    if(row.dl && row.end && row.end>row.dl) row.late = true;
    if(!row.start && !row.meta){ rows.splice(rows.indexOf(row), 1); return null; }
    return row;
  };
  (sort ? sort(roots) : roots).forEach(n=>walk(n, 0));
  return rows;
}
/* Überschrift (Ebene 1 oder 2) samt Abschnitt als Punkt-ähnliches Objekt (nur zum Lesen: Gantt, Listen). Die Punkte darunter sind die echten Punkte. */
function wsHeadVirt(doc, i, end){
  const blocks = doc.blocks, h = blocks[i];
  const n = wsNewNode(h.text); n.id = h.id; n.done = !!h.done; n.date = h.date||""; n.dur = h.dur||0; n.dl = h.dl||""; n.meta = !!h.meta; n.tag = h.tag||""; n.head = true;
  let j = i+1;
  while(j<end){
    const b = blocks[j];
    if(b.type==="heading"){ const e = Math.min(wsSecEnd(blocks, j), end); n.children.push(wsHeadVirt(doc, j, e)); j = e; continue; }
    if(b.type==="outline") b.items.forEach(x=>n.children.push(x));
    j++;
  }
  return n;
}
/* oberste Meta-Projekte (nicht verschachtelt gesammelt) aus allen Dokumenten; auch Überschriften können Meta-Projekte sein */
function wsMetaRoots(docs){
  const out = [];
  const walk = (items)=>items.forEach(n=>{ if(n.meta) out.push(n); else walk(n.children); });
  docs.forEach(d=>{
    let skip = -1;
    d.blocks.forEach((b,i)=>{
      if(i<skip) return;
      if(b.type==="heading" && b.meta){ const e = wsSecEnd(d.blocks, i); out.push(wsHeadVirt(d, i, e)); skip = e; return; }
      if(b.type==="outline") walk(b.items);
    });
  });
  return out;
}
/* Gantt-Wurzeln eines Dokuments: hat eine Überschrift eigene Termine oder ist Meta-Projekt, bildet die Überschrift eine Ebene; sonst wie bisher alle Punkte */
function wsDocGanttRoots(d){
  const flat = []; d.blocks.forEach(b=>{ if(b.type==="outline") flat.push(...b.items); });
  if(!d.blocks.some(b=>b.type==="heading" && (b.date || b.dl || b.dur || b.meta))) return flat;
  const roots = []; let i = 0;
  while(i<d.blocks.length){
    const b = d.blocks[i];
    if(b.type==="heading"){ const e = wsSecEnd(d.blocks, i); roots.push(wsHeadVirt(d, i, e)); i = e; continue; }
    if(b.type==="outline") roots.push(...b.items);
    i++;
  }
  return roots;
}

/* ---- Blöcke und Tabellen ---- */
function wsMoveBlock(doc, bid, targetBid, pos){
  if(bid===targetBid) return false;
  const i = doc.blocks.findIndex(b=>b.id===bid); if(i<0) return false;
  if(doc.blocks.findIndex(b=>b.id===targetBid)<0) return false;
  const [b] = doc.blocks.splice(i, 1);
  const t = doc.blocks.findIndex(x=>x.id===targetBid);
  doc.blocks.splice(t + (pos==="after"?1:0), 0, b);
  return true;
}

/* ---- Ebenen: Ebene 1 und 2 sind Überschriften (Blöcke), Ebene 3 und tiefer sind Punkte ---- */
function wsHLvl(b){ return b && b.lvl===2 ? 2 : 1; }
/* Ende (exklusiv) des Abschnitts, der mit der Überschrift an Position i beginnt */
function wsSecEnd(blocks, i){
  const L = wsHLvl(blocks[i]); let j = i+1;
  while(j<blocks.length && !(blocks[j].type==="heading" && wsHLvl(blocks[j])<=L)) j++;
  return j;
}
/* Abschnitt (Überschrift mit allem darunter) in einen Punkt umwandeln: Listen werden Unterpunkte, Notizen und Tabellen Anhänge, Unterüberschriften Unterpunkte */
function wsSecToNode(blocks, i, end){
  const h = blocks[i], n = wsNewNode(h.text); n.tag = h.tag || ""; n.date = h.date || ""; n.dur = h.dur || 0; n.dl = h.dl || ""; n.meta = !!h.meta; n.done = !!h.done;
  let j = i+1;
  while(j<end){
    const b = blocks[j];
    if(b.type==="heading"){ const e = Math.min(wsSecEnd(blocks, j), end); n.children.push(wsSecToNode(blocks, j, e)); j = e; continue; }
    if(b.type==="outline") b.items.forEach(x=>n.children.push(x));
    else if(b.type==="text"){ const a = wsNewAtt("text"); a.text = b.text; a.tag = b.tag || ""; n.att.push(a); }
    else if(b.type==="table"){ const a = wsNewAtt("table"); a.cols = b.cols.slice(); a.rows = b.rows.map(r=>r.slice()); a.tag = b.tag || ""; n.att.push(a); }
    j++;
  }
  if(n.att.length) n.aopen = true;
  return n;
}
/* Überschrift samt Abschnitt wird zum Punkt. tgt: null (an die Stelle der Überschrift), {nid,pos} (relativ zu einem Punkt) oder {headId} (an den Anfang des Abschnitts einer anderen Überschrift) */
function wsDemoteHeading(doc, bid, tgt){
  const i = doc.blocks.findIndex(b=>b.id===bid); if(i<0 || doc.blocks[i].type!=="heading") return null;
  const end = wsSecEnd(doc.blocks, i);
  const slice = doc.blocks.splice(i, end-i);
  const node = wsSecToNode(slice, 0, slice.length);
  const undo = ()=>{ doc.blocks.splice(i, 0, ...slice); return null; };
  if(tgt && tgt.nid){
    const r = wsFindNode(doc, tgt.nid); if(!r) return undo();
    if(tgt.pos==="into"){ r.node.children.push(node); r.node.collapsed = false; }
    else r.list.splice(r.index + (tgt.pos==="after"?1:0), 0, node);
  }else if(tgt && tgt.headId){
    const h = doc.blocks.findIndex(b=>b.id===tgt.headId); if(h<0) return undo();
    const nx = doc.blocks[h+1];
    if(nx && nx.type==="outline") nx.items.unshift(node);
    else { const ob = wsNewBlock("outline"); ob.items = [node]; doc.blocks.splice(h+1, 0, ob); }
  }else{
    const pv = doc.blocks[i-1];
    if(pv && pv.type==="outline") pv.items.push(node);
    else { const ob = wsNewBlock("outline"); ob.items = [node]; doc.blocks.splice(i, 0, ob); }
  }
  return node;
}
/* Ebene einer Überschrift ändern; Ebene-2-Überschriften im Abschnitt einer Überschrift, die selbst Ebene 2 wird, werden zu Punkten */
function wsSetHeadLvl(doc, bid, lvl){
  const i = doc.blocks.findIndex(b=>b.id===bid); if(i<0) return false;
  const h = doc.blocks[i]; lvl = lvl===2 ? 2 : 1;
  if(wsHLvl(h)===1 && lvl===2){
    const end = wsSecEnd(doc.blocks, i);
    const subs = doc.blocks.slice(i+1, end).filter(b=>b.type==="heading").map(b=>b.id);
    subs.forEach(id=>wsDemoteHeading(doc, id, null));
  }
  h.lvl = lvl;
  return true;
}
/* Abschnitt (Überschrift mit allem darunter) vor oder hinter einen anderen Block schieben */
function wsMoveSection(doc, bid, targetBid, pos){
  const i = doc.blocks.findIndex(b=>b.id===bid); if(i<0 || doc.blocks[i].type!=="heading") return false;
  const end = wsSecEnd(doc.blocks, i);
  const ti = doc.blocks.findIndex(b=>b.id===targetBid); if(ti<0 || (ti>=i && ti<end)) return false;
  const slice = doc.blocks.splice(i, end-i);
  const t = doc.blocks.findIndex(b=>b.id===targetBid);
  doc.blocks.splice(t + (pos==="after"?1:0), 0, ...slice);
  return true;
}
/* Punkt wird zur Überschrift (Ebene 1 oder 2). Unterpunkte werden eine Liste darunter, Text- und Tabellen-Anhänge eigene Blöcke.
   at: {bid,pos} = vor oder hinter diesen Block, sonst direkt an der Stelle des Punkts (Punkte dahinter bilden eine neue Liste).
   Rückgabe: {heading} oder {err} */
function wsPromoteNode(doc, nid, lvl, at){
  const r = wsFindNode(doc, nid); if(!r) return {err:"Punkt nicht gefunden"};
  const n = r.node;
  if(n.link) return {err:"Dieser Punkt ist mit einem ToDo oder Ziel verknüpft und kann keine Überschrift werden"};
  if(n.att.some(a=>a.type!=="text" && a.type!=="table")) return {err:"Links, Bilder und PDFs lassen sich nicht in eine Überschrift mitnehmen. Bitte zuerst verschieben."};
  if(at && at.bid && !doc.blocks.some(b=>b.id===at.bid)) return {err:"Ziel nicht gefunden"};
  const blk = r.block;
  r.list.splice(r.index, 1);
  let tail = [];
  if(!at && !r.parent){ tail = r.list.splice(r.index); }
  const h = wsNewBlock("heading"); h.text = n.text; h.tag = n.tag || ""; h.lvl = lvl===2 ? 2 : 1; h.date = n.date || ""; h.dur = n.dur || 0; h.dl = n.dl || ""; h.meta = !!n.meta; h.done = !!n.done;
  const ins = [h];
  n.att.forEach(a=>{
    if(a.type==="text"){ const t = wsNewBlock("text"); t.text = a.text; t.tag = a.tag || ""; ins.push(t); }
    else { const t = wsNewBlock("table"); t.cols = a.cols.slice(); t.rows = a.rows.map(x=>x.slice()); t.tag = a.tag || ""; ins.push(t); }
  });
  if(n.children.length){ const ob = wsNewBlock("outline"); ob.items = n.children; ins.push(ob); }
  if(tail.length){ const tb = wsNewBlock("outline"); tb.items = tail; tb.tag = blk.tag || ""; ins.push(tb); }
  let pos;
  if(at && at.bid){
    if(!blk.items.length && blk.id!==at.bid) doc.blocks.splice(doc.blocks.indexOf(blk), 1);
    const t = doc.blocks.findIndex(b=>b.id===at.bid);
    pos = t + (at.pos==="after"?1:0);
  }else{
    pos = doc.blocks.indexOf(blk) + 1;
    if(!blk.items.length){ pos--; doc.blocks.splice(doc.blocks.indexOf(blk), 1); }
  }
  doc.blocks.splice(pos, 0, ...ins);
  return {heading:h};
}
/* Punkt an den Anfang des Abschnitts einer Überschrift legen (erste Liste darunter oder eine neue) */
function wsNodeToSection(doc, nid, headId){
  const r = wsFindNode(doc, nid); if(!r) return false;
  const hi = doc.blocks.findIndex(b=>b.id===headId); if(hi<0) return false;
  r.list.splice(r.index, 1);
  const blk = r.block;
  if(!blk.items.length && doc.blocks[hi+1]!==blk) doc.blocks.splice(doc.blocks.indexOf(blk), 1);
  const h2 = doc.blocks.findIndex(b=>b.id===headId);
  const nx = doc.blocks[h2+1];
  if(nx && nx.type==="outline") nx.items.unshift(r.node);
  else { const ob = wsNewBlock("outline"); ob.items = [r.node]; doc.blocks.splice(h2+1, 0, ob); }
  return true;
}
function wsMoveRow(block, from, to, pos){
  if(from===to || from<0 || to<0 || from>=block.rows.length || to>=block.rows.length) return false;
  const [r] = block.rows.splice(from, 1);
  const t = from<to ? to-1 : to;
  block.rows.splice(t + (pos==="after"?1:0), 0, r);
  return true;
}
function wsAddCol(block){ block.cols.push("Spalte "+(block.cols.length+1)); block.rows.forEach(r=>r.push("")); }
function wsDelCol(block, ci){
  if(block.cols.length<=1 || ci<0 || ci>=block.cols.length) return false;
  block.cols.splice(ci, 1); block.rows.forEach(r=>r.splice(ci, 1)); return true;
}
function wsAddRow(block, after){
  const row = block.cols.map(()=> "");
  const idx = (after===undefined || after===null) ? block.rows.length : after+1;
  block.rows.splice(idx, 0, row); return idx;
}

/* ---- Ansicht: Ausblenden und Filtern (rein) ---- */
function wsFNorm(f){
  f = (f && typeof f==="object") ? f : {};
  return {lvl:(f.lvl>=1 && f.lvl<=3)?Math.floor(f.lvl):0, hideDone:!!f.hideDone, dated:!!f.dated,
    due:(f.due==="today"||f.due==="week")?f.due:"", meta:!!f.meta, noAtt:!!f.noAtt, q:String(f.q||"").trim().slice(0,80), showHid:!!f.showHid,
    manual:!!f.manual, notes:!!f.notes, noTab:!!f.noTab,
    tag:(f.tag==="!none") ? "!none" : wsTagKey(f.tag).slice(0,40)};
}
function wsHasCrit(f){ return !!(f.dated || f.due || f.meta || f.q || f.tag); }
function wsFActive(f){ return (f.lvl?1:0)+(f.hideDone?1:0)+(f.dated?1:0)+(f.due?1:0)+(f.meta?1:0)+(f.noAtt?1:0)+(f.q?1:0)+(f.showHid?1:0)+(f.manual?1:0)+(f.notes?1:0)+(f.noTab?1:0); }
function wsNodeDue(n){ return n.dl || n.ld || n.date || ""; }
function wsNodeMatch(n, f, today, eff){
  if(f.tag && !wsTagMatch(eff, f.tag)) return false;
  if(f.dated && !(n.date || n.ld || n.dl || n.dur)) return false;
  if(f.meta && !n.meta) return false;
  if(f.due){
    if(n.done) return false;
    const d = wsNodeDue(n); if(!d) return false;
    const lim = f.due==="today" ? today : wsAddDays(today, 7);
    if(d>lim) return false;
  }
  if(f.q){
    const q = f.q.toLowerCase();
    let hay = (n.text||"")+" "+(n.att||[]).map(a=>(a.title||"")+" "+(a.text||"")+" "+(a.url||"")).join(" ");
    if(!hay.toLowerCase().includes(q)) return false;
  }
  return true;
}
function wsNodeShown(n, f, today, inh){
  if(n.hid && !f.showHid) return false;
  if(f.hideDone && wsAllDone(n)) return false;
  if(!wsHasCrit(f)) return true;
  const eff = wsTagUnion(inh, n.tag);
  if(!(n.text||"").trim() && !n.children.length && wsTagMatch(eff, f.tag)) return true;
  if(wsNodeMatch(n, f, today, eff)) return true;
  return n.children.some(c=>wsNodeShown(c, f, today, eff));
}
function wsSubCount(n){ return 1 + n.children.reduce((s,c)=>s+wsSubCount(c), 0); }
function wsHiddenCount(items, f, today, inh){
  let k = 0;
  for(const n of items){ const eff = wsTagUnion(inh, n.tag); if(!wsNodeShown(n, f, today, inh)) k += wsSubCount(n); else k += wsHiddenCount(n.children, f, today, eff); }
  return k;
}

/* ---- Deadlines aus den Punkten des Arbeitsbereichs (rein) ---- */
function wsDayDiff(from, to){
  const p = s=>{ const a = s.split("-").map(Number); return Date.UTC(a[0], a[1]-1, a[2]); };
  return Math.round((p(to)-p(from))/86400000);
}
function wsDeadlineItems(docs, today){
  const out = [];
  docs.forEach(doc=>{
    wsAllNodes(doc).forEach(n=>{
      if(!n.dl || n.done) return;
      out.push({doc, node:n, dl:n.dl, days:wsDayDiff(today, n.dl)});
    });
    doc.blocks.forEach(b=>{ if(b.type==="heading" && b.dl && !b.done) out.push({doc, node:b, dl:b.dl, days:wsDayDiff(today, b.dl)}); });
  });
  out.sort((a,b)=> a.days-b.days || (a.node.text||"").localeCompare(b.node.text||""));
  return out;
}

/* ---- Tags (rein) ---- */
/* Ein Eintrag kann mehrere Tags tragen (Text mit Komma getrennt); Tags darunter kommen zu den geerbten dazu */
function wsTagList(s){
  const seen = new Set(), out = [];
  String(s||"").split(",").forEach(p=>{ const t = p.replace(/\s+/g," ").trim().slice(0,30), k = t.toLowerCase(); if(t && !seen.has(k)){ seen.add(k); out.push(t); } });
  return out;
}
function wsNormTag(s){ return wsTagList(s).slice(0,4).join(", "); }
function wsTagKey(s){ return wsNormTag(s).toLowerCase(); }
function wsTagUnion(a, b){ return wsTagList(String(a||"")+","+String(b||"")).slice(0,8).join(", "); }
function wsTagMatch(eff, sel){ if(!sel) return true; const l = wsTagList(eff).map(t=>t.toLowerCase()); return sel==="!none" ? l.length===0 : l.includes(sel); }
/* Tag eines Blocks: Überschrift gilt für sich und alle folgenden Blöcke bis zur nächsten Überschrift; sonst der Tag des Dokuments */
function wsBlockTags(doc){
  const out = {}; let base = wsNormTag(doc.tag);
  const lv = {0:wsNormTag(doc.tag), 1:wsNormTag(doc.tag), 2:wsNormTag(doc.tag), 3:wsNormTag(doc.tag)};   // wirksamer Tag je Überschrift-Ebene
  doc.blocks.forEach(b=>{
    if(b.type==="heading"){
      const L = (b.lvl===2||b.lvl===3) ? b.lvl : 1;
      base = wsTagUnion(lv[L-1], b.tag); out[b.id] = base;
      for(let i=L;i<=3;i++) lv[i] = base;
    }
    else out[b.id] = wsTagUnion(base, b.tag);
  });
  return out;
}
/* Wirksamer Tag jedes Punkts: eigener Tag, sonst der des übergeordneten Punkts, sonst der des Blocks */
function wsEffTags(docs){
  const map = new Map();
  docs.forEach(doc=>{
    const bt = wsBlockTags(doc);
    const walk = (items, inh)=>items.forEach(n=>{ const e = wsTagUnion(inh, n.tag); map.set(n.id, e); walk(n.children, e); });
    doc.blocks.forEach(b=>{ if(b.type==="outline") walk(b.items, bt[b.id]); });
  });
  return map;
}
function wsTagShownNode(n, sel, em){ return wsTagMatch(em.get(n.id), sel) || n.children.some(c=>wsTagShownNode(c, sel, em)); }
function wsAllTags(docs){
  const seen = new Map();
  const add = t=>{ wsTagList(t).forEach(x=>{ const k = x.toLowerCase(); if(!seen.has(k)) seen.set(k, x); }); };
  const walk = items=>items.forEach(n=>{ add(n.tag); (n.att||[]).forEach(a=>add(a.tag)); walk(n.children); });
  docs.forEach(d=>{ add(d.tag); d.blocks.forEach(b=>{ add(b.tag); if(b.type==="outline") walk(b.items); }); });
  return [...seen.values()].sort((a,b)=>a.localeCompare(b, "de"));
}
function wsDocHasTag(doc, sel){
  const bt = wsBlockTags(doc), em = wsEffTags([doc]);
  return doc.blocks.some(b=> b.type==="outline" ? b.items.some(n=>wsTagShownNode(n, sel, em)) : wsTagMatch(bt[b.id], sel));
}

/* ---- Dringlichkeit: Sortierung (rein) ---- */
/* frühester offener Tag im Punkt samt Unterpunkten: Deadline, Termin, Ende der Laufzeit; leer = nichts Terminiertes */
function wsUrgKey(n){
  let best = "";
  const take = d=>{ if(d && (!best || d<best)) best = d; };
  const walk = x=>{
    if(!x.done){
      take(x.dl); take(wsLinkDay(x));
      const sp = wsSpan(x); if(sp) take(sp.end);
      (x.att||[]).forEach(a=>{ if(!a.done) take(a.date); });
    }
    x.children.forEach(walk);
  };
  walk(n);
  return best;
}
/* Dringendstes zuerst; ohne Termin danach, Erledigtes ganz am Ende; bei Gleichstand bleibt die Reihenfolge */
function wsUrgSort(items){
  const rank = n=>{ if(wsAllDone(n)) return 2; return wsUrgKey(n) ? 0 : 1; };
  return items.map((n,i)=>({n, i, r:rank(n), k:wsUrgKey(n)}))
    .sort((a,b)=> a.r-b.r || (a.r===0 ? (a.k<b.k?-1:a.k>b.k?1:0) : 0) || a.i-b.i)
    .map(x=>x.n);
}
function wsDocUrgKey(doc){
  let best = "";
  doc.blocks.forEach(b=>{ if(b.type==="outline") b.items.forEach(n=>{ const k = wsUrgKey(n); if(k && (!best || k<best)) best = k; }); });
  return best;
}

/* ---- Links (rein): nur http, https und mailto werden zu anklickbaren Adressen ---- */
function wsNormUrl(u){
  u = String(u||"").trim();
  if(!u) return "";
  if(/^(https?:\/\/|mailto:)\S+$/i.test(u)) return u;
  if(/^[a-z][a-z0-9+.-]*:/i.test(u)) return "";                 // andere Schemata (javascript: usw.) nie
  if(/^[^\s\/@]+\.[a-z]{2,}(\/\S*)?$/i.test(u)) return "https://"+u;
  return "";
}

/* ---- Wochenübersicht (rein) ---- */
function wsMonday(d){
  const t = new Date(+d.slice(0,4), +d.slice(5,7)-1, +d.slice(8,10));
  return wsAddDays(d, -((t.getDay()+6)%7));
}
function wsKW(d){
  const t = new Date(Date.UTC(+d.slice(0,4), +d.slice(5,7)-1, +d.slice(8,10)));
  t.setUTCDate(t.getUTCDate() - ((t.getUTCDay()+6)%7) + 3);                 // Donnerstag der Woche
  const j4 = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
  return 1 + Math.round(((t - j4)/86400000 - 3 + ((j4.getUTCDay()+6)%7)) / 7);
}
/* Aufgaben für die Woche: Blätter und alle terminierten Punkte; Tag = Tag der Verknüpfung (Deadline-Tag) oder Start */
function wsWeekTasks(docs, o){
  const days = []; for(let i=0;i<(o.n||7);i++) days.push(wsAddDays(o.start, i));
  const byDay = {}; days.forEach(d=>{ byDay[d] = []; });
  const pool = [], overdue = [];
  const em = wsEffTags(docs), q = (o.q||"").trim().toLowerCase();
  const showOver = o.start >= (o.overFrom || wsMonday(o.today));
  docs.forEach(doc=>{
    if(o.doc && o.doc!=="all" && doc.id!==o.doc) return;
    wsAllNodes(doc).forEach(n=>{
      if(n.hid || !(n.text||"").trim()) return;
      const day = wsLinkDay(n);
      if(!(n.children.length===0 || day)) return;
      if(!wsTagMatch(em.get(n.id), o.tag||"")) return;
      if(q && !n.text.toLowerCase().includes(q)) return;
      const it = {doc, node:n, day};
      if(n.done){ if(o.showDone && day && byDay[day]) byDay[day].push(it); return; }
      if(!day){ pool.push(it); return; }
      if(byDay[day]) byDay[day].push(it);
      else if(showOver && day<o.today && day<days[0]) overdue.push(it);
    });
  });
  days.forEach(d=>{ byDay[d] = byDay[d].map((x,i)=>({x,i})).sort((a,b)=>(a.x.node.done?1:0)-(b.x.node.done?1:0) || a.i-b.i).map(z=>z.x); });
  overdue.sort((a,b)=>a.day<b.day?-1:a.day>b.day?1:0);
  const keyed = pool.map((x,i)=>({x,i,k:wsUrgKey(x.node)})).sort((a,b)=>(a.k?0:1)-(b.k?0:1) || (a.k<b.k?-1:a.k>b.k?1:0) || a.i-b.i);
  return {days, byDay, pool:keyed.map(z=>z.x), overdue};
}
/* ToDos und Tages-Ziele der ToDo-App, die in keinem Punkt des Arbeitsbereichs verknüpft sind (rein) */
function wsWeekExternal(todos, goals, o){
  const days = o.days, byDay = {}; days.forEach(d=>{ byDay[d] = []; });
  const overdue = [], q = (o.q||"").trim().toLowerCase();
  if(o.docAll===false) return {byDay, overdue};
  const showOver = o.start >= (o.overFrom || o.today);
  const push = it=>{
    if(o.linked && o.linked.has(it.kind+":"+it.id)) return;
    if(!(it.title||"").trim()) return;
    if(q && !it.title.toLowerCase().includes(q)) return;
    if(!wsTagMatch(it.tag||"", o.tag||"")) return;
    if(it.done){ if(o.showDone && byDay[it.day]) byDay[it.day].push(it); return; }
    if(byDay[it.day]) byDay[it.day].push(it);
    else if(showOver && it.day<o.today && it.day<days[0]) overdue.push(it);
  };
  (todos||[]).forEach(t=>{
    if(!t || t.type!=="todo" || t.archived || t.scheduleType==="weekly" || !wsIsDate(t.startDate)) return;
    push({kind:"todo", id:t.id, title:t.title||"", day:t.startDate, done:!!(o.isDone && o.isDone(t.id)), time:t.startTime||"", tag:t.tag||""});
  });
  (goals||[]).forEach(g=>{
    if(!g || !wsIsDate(g.due)) return;
    push({kind:"goal", id:g.id, title:g.title==="(ohne Titel)"?"":(g.title||""), day:g.due, done:!!g.completed, time:"", tag:""});
  });
  days.forEach(d=>{ byDay[d] = byDay[d].map((x,i)=>({x,i})).sort((a,b)=>(a.x.done?1:0)-(b.x.done?1:0) || ((a.x.time?0:1)-(b.x.time?0:1)) || (a.x.time<b.x.time?-1:a.x.time>b.x.time?1:0) || a.i-b.i).map(z=>z.x); });
  overdue.sort((a,b)=>a.day<b.day?-1:a.day>b.day?1:0);
  return {byDay, overdue};
}
/* Kalendertermine auf die Tage verteilen (rein): Ganztägige über alle Tage, Zeitgebundene am Starttag */
function wsWeekEvents(evs, days){
  const byDay = {}; days.forEach(d=>{ byDay[d] = []; });
  (evs||[]).forEach(e=>{
    if(e.allDay){ days.forEach(d=>{ if(e.sd<=d && d<(e.ed || wsAddDays(e.sd, 1))) byDay[d].push(e); }); }
    else if(byDay[e.sd]) byDay[e.sd].push(e);
  });
  days.forEach(d=>{ byDay[d].sort((a,b)=>(a.allDay?0:1)-(b.allDay?0:1) || (a.st<b.st?-1:a.st>b.st?1:0) || (a.title<b.title?-1:a.title>b.title?1:0)); });
  return byDay;
}
/* ---- 3D-Graph (rein): Dokumente, Überschriften/Blöcke, Punkte, Anhänge und Tags als Knoten ---- */
/* Knoten-IDs: d:<Dokument>, b:<Block>, n:<Punkt>, a:<Anhang>, t:<Tag>; Tag-Knoten hängen nur an Elementen mit EIGENEM Tag (Vererbung zeigt die Baumstruktur) */
function wsGraph(docs, o){
  o = o || {};
  const max = o.max || 1000, nodes = [], links = [], idx = new Map();
  let cut = false;
  const em = wsEffTags(docs);
  const add = n=>{ if(nodes.length>=max){ cut = true; return null; } nodes.push(n); idx.set(n.id, n); return n; };
  const link = (a, b, kind)=>{ if(a && b && idx.has(a) && idx.has(b)) links.push({a, b, kind:kind||"tree"}); };
  const ownTag = (id, tag)=>{
    if(o.tags===false) return;
    wsTagList(tag).forEach(t=>{
      const tid = "t:"+t.toLowerCase();
      if(!idx.has(tid)) add({id:tid, kind:"tag", label:"#"+t, doc:"", ref:t, eff:t, done:false});
      link(id, tid, "tag");
    });
  };
  const first = t=>{ const s = String(t||"").trim().split("\n")[0]; return s.length>60 ? s.slice(0,60)+"…" : s; };
  /* o.head: "H:<Überschrift-ID>" oder "S:<Dokument-ID>" (Teil vor der ersten Überschrift) = nur dieser Abschnitt */
  const sectionOf = doc=>{
    if(!o.head) return null;
    const m = /^([HS]):(.*)$/.exec(o.head); if(!m) return null;
    if(m[1]==="S"){ if(doc.id!==m[2]) return false; const set = new Set(); for(const b of doc.blocks){ if(b.type==="heading") break; set.add(b.id); } return set; }
    const i = doc.blocks.findIndex(b=>b.id===m[2]); if(i<0) return false;
    const set = new Set([m[2]]); for(let k=i+1;k<doc.blocks.length && doc.blocks[k].type!=="heading";k++) set.add(doc.blocks[k].id); return set;
  };
  docs.forEach(doc=>{
    if(o.doc && doc.id!==o.doc) return;
    const sect = sectionOf(doc); if(sect===false) return;
    const did = "d:"+doc.id;
    if(!add({id:did, kind:"doc", label:doc.title||"(ohne Titel)", doc:doc.id, ref:doc.id, eff:doc.tag||"", done:false})) return;
    ownTag(did, doc.tag);
    const bt = wsBlockTags(doc);
    let parent = did;
    const walk = (items, par, inhTag)=>items.forEach(n=>{
      if((n.done && !o.showDone) || (n.hid && !o.showHid)) return;
      const id = "n:"+n.id, eff = em.get(n.id)||"";
      if(!add({id, kind:"node", label:first(n.text)||"(leer)", doc:doc.id, ref:n.id, eff, done:!!n.done, meta:!!n.meta, date:n.date||"", dl:n.dl||""})) return;
      link(par, id); ownTag(id, n.tag);
      (n.att||[]).forEach(a=>{
        if(a.done && !o.showDone) return;
        const aid = "a:"+a.id;
        const label = wsTitleOf(a) || (a.type==="table" ? "Tabelle" : a.type==="file" ? "Datei" : a.type==="link" ? "Link" : "Notiz");
        if(!add({id:aid, kind:"att", type:a.type, label:first(label), doc:doc.id, ref:a.id, eff:wsTagUnion(eff, a.tag), done:!!a.done, fileId:a.fileId||"", mime:a.mime||"", url:a.url||""})) return;
        link(id, aid); ownTag(aid, a.tag);
      });
      walk(n.children, id);
    });
    doc.blocks.forEach(b=>{
      if(sect && !sect.has(b.id)){ if(b.type==="heading") parent = did; return; }
      if(b.type==="outline"){ walk(b.items, parent); return; }
      const id = "b:"+b.id;
      const label = b.type==="heading" ? first(b.text) : b.type==="table" ? "Tabelle" : first(b.text);
      if(!add({id, kind:"block", type:b.type, label:label||(b.type==="heading"?"(Überschrift)":"(Text)"), doc:doc.id, ref:b.id, eff:bt[b.id]||"", done:b.type==="heading" ? !!b.done : false, meta:b.type==="heading" && !!b.meta, date:b.type==="heading" ? (b.date||"") : "", dl:b.type==="heading" ? (b.dl||"") : ""})) return;
      link(b.type==="heading" ? did : parent, id); ownTag(id, b.tag);
      if(b.type==="heading") parent = id;
    });
  });
  return {nodes, links, cut};
}

/* ---- Zustand ---- */
let wsDocs = [];
let wsLoaded = false, wsLoadError = "", wsTabOk = false, wsLastLoad = 0;
let wsF = (()=>{ try{ return wsFNorm(JSON.parse(localStorage.getItem("wsFilter")||"null")); }catch(e){ return wsFNorm(null); } })();
let wsFOpen = (()=>{ try{ return localStorage.getItem("wsFOpen")==="1"; }catch(e){ return false; } })();
const wsColl = new Map();   // nur für diese Sitzung: Auf-/Zuklappen, solange ein Filter aktiv ist
function wsFSave(){ try{ localStorage.setItem("wsFilter", JSON.stringify(wsF)); }catch(e){} wsColl.clear(); }
let wsMetaOv = false;       // beim Zeichnen eines Abschnitts unter einer Meta-Überschrift gilt der Filter "Nur Meta" nicht
function wsVis(n, inh){ return wsNodeShown(n, wsMetaOv ? Object.assign({}, wsF, {meta:false}) : wsF, todayKey(), inh); }
const wsOpenMap = new Map();   // nur für diese Sitzung: einzeln auf- oder zugeklappte Notizen, Tabellen und Gliederungen
function wsFoldOpen(id, kind){
  if(wsOpenMap.has(id)) return wsOpenMap.get(id);
  if(kind==="text") return !!wsF.notes;      // Notizen standardmäßig zu
  if(kind==="table") return !wsF.noTab;
  return true;
}
/* Überschriften klappen alle Blöcke bis zur nächsten Überschrift ein (gespeichert am Block, also auf allen Geräten gleich) */
function wsHeadClosed(b){
  if(wsFiltered() && wsColl.has(b.id)) return wsColl.get(b.id);
  return !wsFiltered() && !!b.collapsed;
}
function wsHeadLvl(b){ return wsHLvl(b); }
/* alle Überschriften (Ebene 1 bis 3), unter denen ein Block steht */
function wsHeadChain(doc, bid){
  const st = [];
  for(const b of doc.blocks){
    if(b.id===bid) return st;
    if(b.type==="heading"){ while(st.length && wsHeadLvl(st[st.length-1])>=wsHeadLvl(b)) st.pop(); st.push(b); }
  }
  return [];
}
/* Welche Blöcke blendet eine eingeklappte Überschrift aus? Ebene 1 schließt Ebene 2 und 3 mit ein. */
function wsHiddenByHeads(doc){
  const hidden = new Set(), counts = {}, indent = {}, base = {}, metaIn = new Set();
  let closedLvl = 0, cur = null, lvl = 0, doneLvl = 0, metaLvl = 0;
  doc.blocks.forEach(b=>{
    if(b.type==="heading"){
      const L = wsHeadLvl(b); lvl = L; indent[b.id] = L-1;
      if(metaLvl && L<=metaLvl) metaLvl = 0;
      if(b.meta && !metaLvl) metaLvl = L;
      if(metaLvl) metaIn.add(b.id);
      if(doneLvl && L<=doneLvl) doneLvl = 0;
      if(closedLvl && L<=closedLvl){ closedLvl = 0; cur = null; }
      if(closedLvl){ hidden.add(b.id); counts[cur.id]++; return; }
      if(doneLvl){ hidden.add(b.id); return; }
      if(b.done && wsF.hideDone){ doneLvl = L; hidden.add(b.id); return; }
      if(wsHeadClosed(b)){ closedLvl = L; cur = b; counts[b.id] = 0; }
    }else{
      indent[b.id] = lvl ? lvl-1 : 0; base[b.id] = lvl+1;
      if(metaLvl) metaIn.add(b.id);
      if(closedLvl){ hidden.add(b.id); counts[cur.id]++; }
      else if(doneLvl) hidden.add(b.id);
    }
  });
  return {hidden, counts, indent, base, metaIn};
}

async function wsEnsureTab(){
  if(wsTabOk) return;
  const ss = await api(`${SHEETS}/${spreadsheetId}?fields=sheets(properties(title))`);
  const titles = (ss.sheets||[]).map(s=>s.properties?.title||"");
  if(!titles.includes(WS_TAB)){
    await api(`${SHEETS}/${spreadsheetId}:batchUpdate`, {method:"POST", body:JSON.stringify({requests:[{addSheet:{properties:{title:WS_TAB}}}]})});
    await new Promise(r=>setTimeout(r,400));
  }
  wsTabOk = true;
}
async function wsReadServer(){
  const res = await api(`${SHEETS}/${spreadsheetId}/values/${WS_TAB}!A1:A${WS_MAXROWS}`);
  const rows = res.values || [];
  const text = wsFromChunks(rows);
  return {docs: wsParse(text), trash: wsParseTrash(text), rows: rows.length};
}
let wsTrash = [];
const wsTrashAdd = new Set(), wsTrashGone = new Set();
async function wsWriteServer(docs, rowsOnServer){
  const chunks = wsToChunks(wsSerialize(docs, wsTrash));
  if(chunks.length>WS_MAXROWS) throw new Error("Arbeitsbereich zu groß für das Tabellenblatt");
  await api(`${SHEETS}/${spreadsheetId}/values/${WS_TAB}!A1?valueInputOption=RAW`,
    {method:"PUT", body:JSON.stringify({values:chunks.map(c=>[c])})});
  if(chunks.length < rowsOnServer){
    await api(`${SHEETS}/${spreadsheetId}/values/${WS_TAB}!A${chunks.length+1}:A${WS_MAXROWS}:clear`, {method:"POST", body:"{}"});
  }
}
async function loadWorkspace(){

    wsDocs = wsFixPinned(wsLoaded ? wsMergeDocs(wsDocs, s.docs, wsDirty, wsDeleted) : s.docs);
    wsTrash = wsMergeTrash(wsTrash, s.trash, wsTrashAdd, wsTrashGone, Date.now());

function wsScheduleSave(){
  clearTimeout(wsSaveTimer); wsSetStatus("…");
  wsSaveTimer = setTimeout(wsFlush, 1000);
}
function wsFlush(){
  clearTimeout(wsSaveTimer); wsSaveTimer = null;
  wsSaveQueue = wsSaveQueue.then(wsSaveNow).catch(e=>console.error("wsFlush:", e));
  return wsSaveQueue;
}
async function wsSaveNow(){
  if(!wsDirty.size && !wsDeleted.size) return;
  if(!wsLoaded){ toast("Arbeitsbereich nicht geladen: Speichern gesperrt"); return; }
  const dSnap = new Map(wsDirty), xSnap = new Map(wsDeleted), aSnap = new Set(wsTrashAdd), gSnap = new Set(wsTrashGone);
  setSync("busy"); wsSetStatus("speichert …");
  try{
    await wsEnsureTab();
    const s = await wsReadServer();                                     // server-first: erst den Stand der anderen Geräte holen
    wsDocs = wsFixPinned(wsMergeDocs(wsDocs, s.docs, wsDirty, wsDeleted));
    wsTrash = wsMergeTrash(wsTrash, s.trash, wsTrashAdd, wsTrashGone, Date.now());
    wsRefreshChips();                                                   // Dokumente von anderen Geräten sofort in der Auswahl zeigen
    await wsWriteServer(wsDocs, s.rows);
    dSnap.forEach((rev,id)=>{ if(wsDirty.get(id)===rev) wsDirty.delete(id); });
    xSnap.forEach((rev,id)=>{ if(wsDeleted.get(id)===rev) wsDeleted.delete(id); });
    aSnap.forEach(id=>wsTrashAdd.delete(id)); gSnap.forEach(id=>wsTrashGone.delete(id));
    wsLastLoad = Date.now();
    setSync("on"); wsSetStatus("gespeichert ✓");
  }catch(e){
    console.error("❌ wsSaveNow FEHLER:", e.message);
    setSync("on"); wsSetStatus("Speichern fehlgeschlagen");
    toast("Arbeitsbereich: Speichern fehlgeschlagen, neuer Versuch folgt");
    clearTimeout(wsRetryTimer); wsRetryTimer = setTimeout(wsFlush, 15000);
  }
}

function wsTrashPut(item){ wsTrash.unshift(item); wsTrashAdd.add(item.id); wsTrashTouch(); }
function wsTrashDrop(id){ wsTrash = wsTrash.filter(i=>i.id!==id); wsTrashAdd.delete(id); wsTrashGone.add(id); wsTrashTouch(); }

let wsCurDoc = null;
function wsSecEarliest(doc, bid){
  if(!doc) return "";
  const i = doc.blocks.findIndex(b=>b.id===bid); if(i<0) return "";
  const end = wsSecEnd(doc.blocks, i); let best = "";
  const take = d=>{ if(d && (!best || d<best)) best = d; };
  const walk = items=>items.forEach(n=>{ if(!n.done) take(wsNodeDue(n)); walk(n.children); });
  for(let k=i+1;k<end;k++){
    const b = doc.blocks[k];
    if(b.type==="outline") walk(b.items);
    else if(b.type==="heading" && !b.done){ take(b.dl || b.date); }
  }
  return best;
}

let wsGQ = "";
function wsSearchAll(q, max){
  q = String(q||"").trim().toLowerCase(); if(q.length<1) return [];
  max = max||60;
  const out = [], has = t=>String(t||"").toLowerCase().includes(q);
  const snip = t=>{ const x = String(t||"").replace(/\s+/g, " ").trim(); const i = x.toLowerCase().indexOf(q); if(x.length<=90) return x; const a = Math.max(0, i-30); return (a?"…":"")+x.slice(a, a+90)+(a+90<x.length?"…":""); };
  for(const doc of wsDocs){
    if(has(doc.title)) out.push({docId:doc.id, kind:"doc", ref:doc.id, icon:"📄", text:doc.title||"(ohne Titel)", where:"Dokument", done:false});
    let head = "";
    for(const b of doc.blocks){
      if(out.length>=max) return out;
      const where = (doc.title||"(ohne Titel)")+(head?" › "+head:"");
      if(b.type==="heading"){ head = (b.text||"").trim().slice(0,40); if(has(b.text)) out.push({docId:doc.id, kind:"block", ref:b.id, icon:wsHLvl(b)===1?"E1":"E2", text:b.text, where:doc.title||"(ohne Titel)", done:!!b.done}); }
      else if(b.type==="text"){ if(has(b.text)) out.push({docId:doc.id, kind:"block", ref:b.id, icon:"📝", text:snip(b.text), where, done:false}); }
      else if(b.type==="table"){ if(has(b.cols.join(" ")+" "+b.rows.map(r=>r.join(" ")).join(" "))) out.push({docId:doc.id, kind:"block", ref:b.id, icon:"▦", text:"Tabelle: "+snip(b.rows.map(r=>r.find(c=>has(c))||"").filter(Boolean)[0]||b.cols.find(c=>has(c))||""), where, done:false}); }
      else if(b.type==="outline"){
        const walk = (items, path)=>items.forEach(n=>{
          if(has(n.text)) out.push({docId:doc.id, kind:"node", ref:n.id, icon:n.link?(n.link.kind==="goal"?"🎯":"☑"):"•", text:n.text||"(leer)", where:where+(path.length?" › "+path.join(" › "):""), done:!!n.done});
          (n.att||[]).forEach(a=>{
            const hay = (a.title||"")+" "+(a.text||"")+" "+(a.url||"")+" "+(a.name||"")+" "+(a.type==="table"?(a.cols||[]).join(" ")+" "+(a.rows||[]).map(r=>r.join(" ")).join(" "):"");
            if(has(hay)) out.push({docId:doc.id, kind:"att", ref:a.id, icon:"📎", text:snip(a.title||a.name||a.text||a.url||"Anhang"), where:where+" › "+(n.text||"(leer)").slice(0,40), done:!!a.done});
          });
          walk(n.children, path.concat((n.text||"").slice(0,30)));
        });
        walk(b.items, []);
      }
    }
  }
  return out.slice(0, max);
}

  const q = wsGQ.trim(); if(!q) return "";

/* Fünf Tage ab heute: Punkte des Arbeitsbereichs, ToDos und Tages-Ziele der ToDo-App sowie Termine ausgewählter Kalender */
const WK_MODES = {two:{n:2, step:2}, agenda:{n:14, step:7}, week:{n:5, step:5}, day:{n:1, step:1}};
let wsWk = (()=>{ try{ const o = JSON.parse(localStorage.getItem("wsWk")||"null")||{}; return {doc:String(o.doc||"all"), q:String(o.q||""), showDone:o.showDone!==false, ev:o.ev!==false, mode:WK_MODES[o.mode]?o.mode:"two", wide:o.wide!==false}; }catch(e){ return {doc:"all", q:"", showDone:true, ev:true, mode:"two", wide:true}; } })();
let wsWkStart = null, wsPoolAll = false, wsWkDrag = null;
let wsWkCals = (()=>{ try{ const r = localStorage.getItem("wsWkCals"); if(r===null) return null; const a = JSON.parse(r); return Array.isArray(a) ? a.map(String) : null; }catch(e){ return null; } })();

function wsWkSave(){ try{ localStorage.setItem("wsWk", JSON.stringify(wsWk)); }catch(e){} }
function wsWkFirst(){ return wsWkStart || todayKey(); }
function wsWkN(){ return WK_MODES[wsWk.mode].n; }
function wsWkDays(){ const f = wsWkFirst(), a = []; for(let i=0;i<wsWkN();i++) a.push(wsAddDays(f, i)); return a; }
function wsWkCalList(){ return (allCalendars && allCalendars.length) ? allCalendars : calendars; }
/* Ohne eigene Auswahl: Kalender, deren Name nach Stundenplan klingt */
function wsWkCalIds(){

function wsWkOwnEvents(){
  const s = new Set();
  tasks.forEach(t=>{ if(t.calendarEventId) s.add(t.calendarEventId); });

function wsWkData(){
  const days = wsWkDays(), today = todayKey(), tag = wsF.tag;
  const D = wsWeekTasks(wsDocs, {start:days[0], n:wsWkN(), overFrom:today, today, doc:wsWk.doc, tag, q:wsWk.q, showDone:wsWk.showDone});
  const goals = new Map(); allOpenGoals.concat(goalTasks).forEach(g=>{ if(g && g.id && !goals.has(g.id)) goals.set(g.id, g); });
  const X = wsWeekExternal(tasks, Array.from(goals.values()), {days, start:days[0], today, overFrom:today, linked:wsWkLinkedSet(), isDone:isEverDone, showDone:wsWk.showDone, tag, q:wsWk.q, docAll:wsWk.doc==="all"});

/* ---- Kalendertermine laden ---- */
function wsWkEvKey(){ return wsWkFirst()+"|"+wsWkN()+"|"+wsWkCalIds().join(","); }
async function wsWkLoadEvents(force){
  if(wsWkEv.busy) return;
  const key = wsWkEvKey(); if(!force && wsWkEv.key===key) return;
  const ids = wsWkCalIds(), days = wsWkDays(), list = [], bad = [];
  const L = k=>new Date(+k.slice(0,4), +k.slice(5,7)-1, +k.slice(8,10));
  const hm = d=>String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  wsWkEv.busy = true;
  try{
    const tMin = L(days[0]).toISOString(), tMax = L(wsAddDays(days[days.length-1], 1)).toISOString();
    for(const id of ids){
      const cal = wsWkCalList().find(c=>c.id===id); if(!cal) continue;
      try{
        const res = await api(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(id)}/events?timeMin=${encodeURIComponent(tMin)}&timeMax=${encodeURIComponent(tMax)}&singleEvents=true&orderBy=startTime&maxResults=250`);
        ((res && res.items) || []).forEach(e=>{
          if(!e || e.status==="cancelled" || !e.start) return;
          if((e.attendees||[]).some(a=>a.self && a.responseStatus==="declined")) return;
          const allDay = !e.start.dateTime;
          const o = {id:e.id, title:e.summary||"(ohne Titel)", calId:id, calendarName:cal.summary||"", allDay, sd:"", ed:"", st:"", et:""};
          if(allDay){ o.sd = e.start.date; o.ed = (e.end && e.end.date) || wsAddDays(o.sd, 1); }
          else{
            const s = new Date(e.start.dateTime), t = new Date((e.end && e.end.dateTime) || e.start.dateTime);
            o.sd = dateKey(s); o.ed = dateKey(t); o.st = hm(s); o.et = hm(t);
          }
          list.push(o);
        });
      }catch(err){ bad.push(cal.summary||id); }
    }
  }catch(err){ bad.push("?"); }
  wsWkEv.list = list; wsWkEv.key = key; wsWkEv.err = bad.length ? "Nicht lesbar: "+bad.join(", ") : ""; wsWkEv.busy = false;
  if(view==="notes" && wsTab==="week") wsRenderIfSafe();
}

    h += `<div class="ws-daygrid"><div class="ws-wkcol ws-dayone${d===today?" today":""}" data-wkday="${d}">${dayHead(d)}<div class="ws-agbody">${wsWkDayInner(d, W, em, true)}</div></div>${wsWkPoolHtml(D, em, "")}</div>`;
  }else{
    h += `<div class="ws-wkgrid ${mode==="two"?"ws-two":(wsWk.wide?"ws-wide5":"")}">`;
    W.days.forEach(d=>{
      h += `<div class="ws-wkcol${d===today?" today":""}" data-wkday="${d}">${dayHead(d)}<div class="ws-agbody">${wsWkDayInner(d, W, em, mode==="two")}</div></div>`;
    });
    h += wsWkPoolHtml(D, em, "") + `</div>`;
  }
  const tgt = wsWeekTargetDoc();
  h += `<div class="ws-meta" style="margin-top:8px">Neue Aufgaben landen in: ${esc(tgt?tgt.title||"Ohne Titel":"neuem Dokument Aufgaben")}. Mit Tag angelegte Aufgaben werden als ToDo angelegt. Ziehen am ⠿ oder ⇄ verschiebt auf einen anderen Tag, in den Taskpool nur Punkte ohne ToDo/Ziel-Verknüpfung.</div>`;
  return h;
}
function wsWeekTargetDoc(){
  if(wsWk.doc!=="all"){ const d = wsGet(wsWk.doc); if(d) return d; }
  return wsPinned() || wsDocs[0] || null;
}
function wsWeekAdd(text, day){
  text = String(text||"").trim(); if(!text || !wsLoaded) return null;
  let doc = wsWeekTargetDoc();
  if(!doc){ doc = wsNewDoc("Aufgaben"); wsDocs.push(doc); }
  let block = doc.blocks.find(b=>b.type==="outline");
  if(!block){ block = wsNewBlock("outline"); block.items = []; doc.blocks.push(block); }
  const n = wsNewNode(text); n.date = day||"";
  if(wsF.tag && wsF.tag!=="!none"){
    const disp = wsAllTags(wsDocs).find(t=>wsTagKey(t)===wsF.tag);
    const beff = wsBlockTags(doc)[block.id] || "";
    if(disp && !wsTagMatch(beff, wsF.tag)) n.tag = disp;
  }
  block.items.push(n); wsTouch(doc);
  return {doc, node:n};
}
/* Punkt auf einen Tag setzen; ein neuer Termin wird standardmäßig ein ToDo (außer Meta-Projekt) */
async function wsMoveTask(docId, nid, day){
  const doc = wsGet(docId), r = doc && wsFindNode(doc, nid); if(!r) return;
  const n = r.node, L = n.link, today = todayKey();
  if(!day){
    if(L){ toast("Mit ToDo/Ziel verknüpft: braucht einen Tag. Erst die Verknüpfung lösen."); return; }
    n.date = ""; n.ld = ""; wsTouch(doc); render(); return;
  }
  if(L){
    if(L.kind==="goal" && day!==wsLinkDay(n)){
      if(day<today){ toast("Ein Tages-Ziel braucht ein heutiges oder späteres Datum"); return; }
      if(wsGoalCount(day)>=GOAL_MAX){ toast("Maximal "+GOAL_MAX+" Tages-Ziele pro Tag am "+wsShortDate(day)); return; }
    }
    if(n.ld || n.dl) n.ld = day; else n.date = day;
  }else{ n.date = day; n.ld = ""; }
  wsTouch(doc); render();
  if(L) wsLinkRun(()=>wsSyncItem(doc, n, L.cal));
  else if(!n.meta && wsTitleOf(n)) wsLinkRun(()=>wsCreateItem(doc, n, "todo", false));
}
/* ToDo oder Ziel ohne Punkt im Arbeitsbereich verschieben */
async function wsMoveExternal(kind, id, day){
  const today = todayKey();
  if(!day){ toast("Ein ToDo oder Ziel braucht einen Tag"); return; }
  if(kind==="todo"){
    const t = tasks.find(x=>x.id===id); if(!t) return;
    const wd = parseDate(day);
    await updateTask(id, {startDate:day, weekday: wd ? String(wd.getDay()) : ""});
    return;
  }
  const g = allOpenGoals.concat(goalTasks).find(x=>x.id===id); if(!g) return;
  if(day===g.due) return;
  if(day<today){ toast("Ein Tages-Ziel braucht ein heutiges oder späteres Datum"); return; }
  if(wsGoalCount(day)>=GOAL_MAX){ toast("Maximal "+GOAL_MAX+" Tages-Ziele pro Tag am "+wsShortDate(day)); return; }
  setSync("busy");
  try{
    await api(`${GTASKS}/lists/${encodeURIComponent(defaultGTaskListId||"@default")}/tasks/${encodeURIComponent(id)}`,
      {method:"PATCH", body:JSON.stringify({notes:GOAL_MARKER, due:day+"T12:00:00.000Z"})});
    await loadGTasks();
  }catch(e){ console.error("❌ Ziel verschieben:", e && e.message); toast("Verschieben fehlgeschlagen"); }
  setSync("on"); render();
}

/* ============ DATEIEN IN GOOGLE DRIVE (Bilder, PDF) ============ */
/* Eigener Ordner im Drive; die App sieht nur Dateien, die sie selbst angelegt hat (Berechtigung drive.file). */
const WS_FOLDER_NAME = "ToDo-App Arbeitsdateien";
const WS_MAXFILE = 15*1024*1024;
let wsFolderP = null;
async function wsDriveFolder(){
  if(!wsFolderP) wsFolderP = (async()=>{
    let id = ""; try{ id = localStorage.getItem("wsDriveFolder")||""; }catch(e){}
    if(id){
      try{ const f = await api("https://www.googleapis.com/drive/v3/files/"+encodeURIComponent(id)+"?fields=id,trashed"); if(f && f.id && !f.trashed) return id; }catch(e){}
    }
    const q = encodeURIComponent(`name='${WS_FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
    const res = await api(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`);
    id = (res && res.files && res.files.length) ? res.files[0].id : "";
    if(!id){
      const c = await api("https://www.googleapis.com/drive/v3/files?fields=id", {method:"POST", body:JSON.stringify({name:WS_FOLDER_NAME, mimeType:"application/vnd.google-apps.folder"})});
      id = c.id;
    }
    try{ localStorage.setItem("wsDriveFolder", id); }catch(e){}
    return id;
  })();
  const p = wsFolderP;
  try{ return await p; } finally { if(wsFolderP===p) wsFolderP = null; }
}
async function wsDriveUpload(file){
  const folder = await wsDriveFolder();
  const boundary = "wsb"+Math.random().toString(36).slice(2);
  const meta = JSON.stringify({name:file.name||"Datei", parents:[folder]});
  const body = new Blob([`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${boundary}\r\nContent-Type: ${file.type||"application/octet-stream"}\r\n\r\n`, file, `\r\n--${boundary}--`]);
  return api("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,mimeType,size",
    {method:"POST", headers:{"Content-Type":"multipart/related; boundary="+boundary}, body});
}
async function wsDriveFetch(fileId){
  const url = "https://www.googleapis.com/drive/v3/files/"+encodeURIComponent(fileId)+"?alt=media";
  let r = await fetch(url, {headers:{Authorization:"Bearer "+accessToken}});
  if(r.status===401){ try{ await requestToken(false); }catch(e){ await requestToken(true); } r = await fetch(url, {headers:{Authorization:"Bearer "+accessToken}}); }
  if(!r.ok) throw new Error("Drive "+r.status);
  return r.blob();
}
const wsBlobs = new Map(), wsUrls = new Map();
function wsFileBlob(fileId){
  if(!wsBlobs.has(fileId)){
    if(wsBlobs.size>=30) wsBlobs.delete(wsBlobs.keys().next().value);
    const p = wsDriveFetch(fileId); wsBlobs.set(fileId, p);
    p.catch(()=>{ if(wsBlobs.get(fileId)===p) wsBlobs.delete(fileId); });
  }
  return wsBlobs.get(fileId);
}
async function wsFileUrl(fileId){
  if(wsUrls.has(fileId)) return wsUrls.get(fileId);
  const u = URL.createObjectURL(await wsFileBlob(fileId)); wsUrls.set(fileId, u); return u;
}
/* Vorschaubilder: Bilder direkt, PDFs über pdf.js (wird erst bei Bedarf aus dem Internet geladen); Ergebnis wird im Browser zwischengespeichert */
const WS_PDFJS = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js";
const WS_PDFJS_WORKER = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
let wsPdfP = null;
function wsPdfLib(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(!wsPdfP) wsPdfP = new Promise((res, rej)=>{
    const sc = document.createElement("script"); sc.src = WS_PDFJS;
    sc.onload = ()=>{ if(window.pdfjsLib){ window.pdfjsLib.GlobalWorkerOptions.workerSrc = WS_PDFJS_WORKER; res(window.pdfjsLib); } else { wsPdfP = null; rej(new Error("pdf.js fehlt")); } };
    sc.onerror = ()=>{ wsPdfP = null; rej(new Error("pdf.js konnte nicht geladen werden")); };
    document.head.appendChild(sc);
  });
  return wsPdfP;
}
const WS_THMAX = 220, WS_THKEEP = 40;
const wsThumbDone = new Map();       // fileId -> {c: Canvas, url: dataURL} oder "err"
const wsThumbProm = new Map(), wsThumbQ = []; let wsThumbActive = 0;
function wsThumbSet(id, c){
  const url = c.toDataURL("image/jpeg", 0.78);
  wsThumbDone.set(id, {c, url});
  try{
    localStorage.setItem("wsTh:"+id, url);
    let idx = []; try{ idx = JSON.parse(localStorage.getItem("wsThIdx")||"[]")||[]; }catch(e){}
    idx = idx.filter(x=>x!==id); idx.push(id);
    while(idx.length>WS_THKEEP){ localStorage.removeItem("wsTh:"+idx.shift()); }
    localStorage.setItem("wsThIdx", JSON.stringify(idx));
  }catch(e){}
  return wsThumbDone.get(id);
}
function wsThumbFromUrl(id){
  let url = null; try{ url = localStorage.getItem("wsTh:"+id); }catch(e){}
  if(!url) return Promise.resolve(null);
  return new Promise(res=>{
    const im = new Image();
    im.onload = ()=>{ const c = document.createElement("canvas"); c.width = im.naturalWidth; c.height = im.naturalHeight; c.getContext("2d").drawImage(im,0,0); const r = {c, url}; wsThumbDone.set(id, r); res(r); };
    im.onerror = ()=>res(null); im.src = url;
  });
}
function wsThumbScaled(w, h){
  const k = Math.min(1, WS_THMAX/Math.max(w, h)), c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(w*k)); c.height = Math.max(1, Math.round(h*k));
  const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0,0,c.width,c.height);
  return {c, x, k};
}
async function wsThumbMake(a){
  const cached = await wsThumbFromUrl(a.fileId); if(cached) return cached;
  const blob = await wsFileBlob(a.fileId);
  if(wsIsImg(a)){
    const bm = await createImageBitmap(blob), t = wsThumbScaled(bm.width, bm.height);
    t.x.drawImage(bm, 0, 0, t.c.width, t.c.height); if(bm.close) bm.close();
    return wsThumbSet(a.fileId, t.c);
  }
  if(wsIsPdf(a)){
    const lib = await wsPdfLib();
    const pdf = await lib.getDocument({data:new Uint8Array(await blob.arrayBuffer())}).promise;
    try{
      const page = await pdf.getPage(1), v1 = page.getViewport({scale:1}), t = wsThumbScaled(v1.width, v1.height);
      await page.render({canvasContext:t.x, viewport:page.getViewport({scale:t.k})}).promise;
      return wsThumbSet(a.fileId, t.c);
    }finally{ try{ pdf.destroy(); }catch(e){} }
  }
  return null;
}
function wsThumbPump(){
  while(wsThumbActive<2 && wsThumbQ.length){
    const j = wsThumbQ.shift(); wsThumbActive++;
    wsThumbMake(j.a).then(r=>{ if(!r) wsThumbDone.set(j.a.fileId, "err"); j.res(r||null); })
      .catch(()=>{ wsThumbDone.set(j.a.fileId, "err"); j.res(null); })
      .finally(()=>{ wsThumbActive--; wsThumbPump(); });
  }
}
/* a: {fileId, mime, name}; liefert {c,url} oder null */
function wsThumb(a){
  const id = a && a.fileId; if(!id || !(wsIsImg(a) || wsIsPdf(a))) return Promise.resolve(null);
  const d = wsThumbDone.get(id); if(d) return Promise.resolve(d==="err" ? null : d);
  if(!wsThumbProm.has(id)){ wsThumbProm.set(id, new Promise(res=>{ wsThumbQ.push({a:{fileId:id, mime:a.mime, name:a.name}, res}); wsThumbPump(); }).then(r=>{ wsThumbProm.delete(id); return r; })); }
  return wsThumbProm.get(id);
}
function wsThumbHtml(a, ico){
  if(!a.fileId || !(wsIsImg(a) || wsIsPdf(a))) return ico;
  return `<span class="ws-thwrap"><img class="ws-thumb" data-wsth="${esc(a.fileId)}" data-mime="${esc(a.mime||"")}" data-name="${esc(a.name||"")}" alt=""><span class="ws-thico">${ico}</span></span>`;
}
function wsHydrateThumbs(){
  document.querySelectorAll("img[data-wsth]:not([data-h])").forEach(im=>{
    im.dataset.h = "1";
    const d = wsThumbDone.get(im.dataset.wsth);
    if(d && d!=="err"){ im.src = d.url; im.classList.add("on"); return; }
    wsThumb({fileId:im.dataset.wsth, mime:im.dataset.mime, name:im.dataset.name}).then(r=>{
      if(r) document.querySelectorAll('img[data-wsth="'+im.dataset.wsth+'"]').forEach(x=>{ x.src = r.url; x.classList.add("on"); });
    });
  });
}
function wsHydrateFiles(){
  wsHydrateThumbs();
  document.querySelectorAll("img[data-wsfid]:not([data-h])").forEach(img=>{
    img.dataset.h = "1";
    wsFileUrl(img.dataset.wsfid).then(u=>{ img.src = u; }).catch(()=>{ img.dataset.h = "err"; img.alt = "Bild konnte nicht geladen werden"; });
  });
}
if(document.body) new MutationObserver(wsHydrateFiles).observe(document.body, {childList:true, subtree:true});
function wsSizeText(b){ return b>=1048576 ? (b/1048576).toFixed(1).replace(".",",")+" MB" : Math.max(1,Math.round(b/1024))+" KB"; }
function wsIsImg(a){ return /^image\//.test(a.mime||""); }
function wsIsPdf(a){ return a.mime==="application/pdf" || /\.pdf$/i.test(a.name||""); }
function wsDriveLink(id){ return "https://drive.google.com/file/d/"+encodeURIComponent(id)+"/view"; }
function wsFileBodyHtml(a){
  const meta = `${esc(a.name)}${a.size?" · "+wsSizeText(a.size):""}`;
  const links = `<button class="ws-addbtn" data-wsact="file-view">Ansehen</button><a class="ws-lnkgo" target="_blank" rel="noopener noreferrer" href="${esc(wsDriveLink(a.fileId))}">In Drive ↗</a>`;
  if(!a.fileId) return `<div class="ws-fp ws-fpv">(keine Datei)</div>`;
  if(wsIsImg(a)) return `<img class="ws-fimg" data-wsfid="${esc(a.fileId)}" data-wsact="file-view" alt="${esc(a.name)}"><div class="ws-frow2"><span class="muted">${meta}</span>${links}</div>`;
  if(wsIsPdf(a)) return `<div class="ws-frow2"><span data-wsact="file-view" style="cursor:zoom-in">${wsThumbHtml(a, '<span class="ws-ficon pdf">PDF</span>')}</span><span>${meta}</span>${links}</div>`;
  return `<div class="ws-frow2"><span class="ws-ficon">DATEI</span><span>${meta}</span>${links}</div>`;
}
async function wsAddFiles(doc, owner){
  const inp = document.createElement("input"); inp.type = "file"; inp.multiple = true; inp.accept = "image/*,application/pdf";
  inp.onchange = async ()=>{
    const files = [...inp.files]; if(!files.length) return;
    for(const f of files){
      if(f.size>WS_MAXFILE){ alert(`„${f.name}“ ist größer als ${WS_MAXFILE/1048576} MB und wird nicht hochgeladen.`); continue; }
      toast("Lade „"+f.name+"“ in Google Drive hoch …");
      try{
        const r = await wsDriveUpload(f);
        const at = wsNewAtt("file");
        at.fileId = r.id; at.name = r.name||f.name; at.mime = r.mimeType||f.type||""; at.size = +r.size||f.size;
        wsOpenMap.set(at.id, true);
        owner.att.push(at); owner.aopen = true; wsTouch(doc);
        wsFocusSel = null; wsRerender(doc.id);
        toast("Hochgeladen: "+at.name);
      }catch(e){ alert("Hochladen fehlgeschlagen:\n"+e.message); }
    }
  };
  inp.click();
}
function wsCloseFileView(){ const o = document.getElementById("wsFv"); if(o) o.remove(); }
async function wsOpenFileView(a){
  if(!a || !a.fileId) return;
  wsCloseFileView();
  document.body.insertAdjacentHTML("beforeend", `<div class="ws-fv" id="wsFv"><div class="ws-fvbar"><span class="ws-fvname">${esc(a.name)}</span>
    <a class="ws-lnkgo" id="wsFvTab" target="_blank" rel="noopener noreferrer" href="#" style="display:none">Neuer Tab ↗</a>
    <a class="ws-lnkgo" target="_blank" rel="noopener noreferrer" href="${esc(wsDriveLink(a.fileId))}">In Drive ↗</a>
    <button class="ws-addbtn" id="wsFvX">Schließen</button></div><div class="ws-fvbody" id="wsFvBody"><div class="muted center">Lädt …</div></div></div>`);
  document.getElementById("wsFvX").onclick = wsCloseFileView;
  try{
    const u = await wsFileUrl(a.fileId), body = document.getElementById("wsFvBody"); if(!body) return;
    const tab = document.getElementById("wsFvTab"); tab.href = u; tab.style.display = "";
    if(wsIsImg(a)) body.innerHTML = `<img class="ws-fvimg" src="${u}" alt="${esc(a.name)}">`;
    else if(wsIsPdf(a)) body.innerHTML = `<iframe class="ws-fvpdf" src="${u}" title="${esc(a.name)}"></iframe><div class="muted center" style="font-size:12px;padding:6px">Wird das PDF hier nicht angezeigt (manche Handys), nutze „Neuer Tab“ oder „In Drive“.</div>`;
    else body.innerHTML = `<div class="muted center">Für diesen Dateityp gibt es keine Vorschau. Nutze „Neuer Tab“ oder „In Drive“.</div>`;
  }catch(e){ const body = document.getElementById("wsFvBody"); if(body) body.innerHTML = `<div class="center" style="color:var(--red)">Datei konnte nicht geladen werden: ${esc(e.message)}</div>`; }
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ if(document.getElementById("wsFv")) e.__wsEsc = true; wsCloseFileView(); } });

/* ============ 3D-ANSICHT ============ */
/* Eigene kleine 3D-Darstellung auf Canvas (ohne Bibliothek, funktioniert offline): Kraft-Layout im Raum, Drehen/Zoomen/Verschieben. */
const ws3d = {
  cam:{yaw:0.6, pitch:0.4, dist:900, F:700, ox:0, oy:0, tx:0, ty:0, tz:0},
  pos:new Map(), sel:"", g:null, byId:new Map(), nb:new Map(), proj:new Map(),
  cv:null, ctx:null, w:0, h:0, alpha:1, raf:0, hits:[], ptr:new Map(), moved:false, thumbs:new Map(), loading:0, hover:"",
  opt:(()=>{ let o = {}; try{ o = JSON.parse(localStorage.getItem("ws3dOpt")||"{}")||{}; }catch(e){}
    return {doc:o.doc||"", showDone:!!o.showDone, tags:o.tags!==false, labels:o.labels!==false, layout:o.layout==="net"?"net":"tree", floor:o.floor!==false, spin:!!o.spin, edit:o.edit!==false, head:"", focus:false, q:""}; })()
};
function ws3dSaveOpt(){ try{ localStorage.setItem("ws3dOpt", JSON.stringify({doc:ws3d.opt.doc, showDone:ws3d.opt.showDone, tags:ws3d.opt.tags, labels:ws3d.opt.labels, layout:ws3d.opt.layout, floor:ws3d.opt.floor, spin:ws3d.opt.spin, edit:ws3d.opt.edit})); }catch(e){} }
function ws3dHeadOpts(){
  const o = ws3d.opt, out = []; let found = !o.head;
  wsDocs.forEach(d=>{
    if(o.doc && d.id!==o.doc) return;
    const dn = d.title||"(ohne Titel)";
    const lead = d.blocks.length && d.blocks[0].type!=="heading";
    const items = [];
    if(lead && d.blocks.some(b=>b.type==="heading")) items.push(["S:"+d.id, "(vor der ersten Überschrift)"]);
    d.blocks.forEach(b=>{ if(b.type==="heading") items.push(["H:"+b.id, (b.text||"").trim()||"(Überschrift ohne Text)"]); });
    items.forEach(([v,l])=>{ if(v===o.head) found = true; out.push(`<option value="${esc(v)}"${v===o.head?" selected":""}>${esc(wsDocs.length>1 && !o.doc ? dn+" › "+l : l)}</option>`); });
  });
  if(!found) o.head = "";
  return `<option value="">Alle Überschriften</option>`+out.join("");
}
