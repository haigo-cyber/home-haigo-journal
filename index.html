    $("modalBg").onclick = e=>{ if(e.target.id==="modalBg") done(null); };
  });
}
function wsApplyHeadDone(doc, block, all){
  const info = wsHeadOpenInfo(doc, block.id);
  block.done = true; wsFocusDrop(doc, block.id);
  if(all){
    info.list.forEach(n=>{ n.done = true; wsFocusDrop(doc, n.id); if(n.link){ const node = n; wsLinkRun(()=>wsPushDone(doc, node)); } });
    info.subs.forEach(h=>{ h.done = true; wsFocusDrop(doc, h.id); });
  }
  wsTouch(doc);
}
async function wsToggleHeadDone(doc, block){
  if(block.done){ block.done = false; wsTouch(doc); wsRerender(doc.id); return; }
  const info = wsHeadOpenInfo(doc, block.id);
  let all = false;
  if(info.nodes + info.heads > 0){
    const r = await wsAskHeadDone(block.text, info);
    if(!r) return;
    all = r==="all";
  }
  wsApplyHeadDone(doc, block, all);
  if(wsF.hideDone) toast("Erledigt und ausgeblendet. Mit „Erledigte einblenden“ wieder sichtbar.");
  if(view==="today") render(); else wsRerender(doc.id);
}
/* Überschrift samt Abschnitt in dasselbe oder ein anderes Dokument verschieben. tgt: {kind:"top"|"end"|"before"|"into", id} */
function wsMoveHeadTo(srcDoc, dstDoc, bid, tgt){
  const i = srcDoc.blocks.findIndex(b=>b.id===bid); if(i<0 || srcDoc.blocks[i].type!=="heading") return false;
  const end = wsSecEnd(srcDoc.blocks, i);
  if(srcDoc===dstDoc && tgt.id){ const ti = srcDoc.blocks.findIndex(b=>b.id===tgt.id); if(ti>=i && ti<end) return false; }
  if(tgt.id && !dstDoc.blocks.some(b=>b.id===tgt.id)) return false;
  const slice = srcDoc.blocks.splice(i, end-i);
  let at;
  if(tgt.kind==="top") at = 0;
  else if(tgt.kind==="end") at = dstDoc.blocks.length;
  else if(tgt.kind==="before") at = dstDoc.blocks.findIndex(b=>b.id===tgt.id);
  else { const hi = dstDoc.blocks.findIndex(b=>b.id===tgt.id); at = wsSecEnd(dstDoc.blocks, hi); }
  dstDoc.blocks.splice(at, 0, ...slice);
  if(tgt.kind==="before") wsSetHeadLvl(dstDoc, bid, wsHLvl(wsBlock(dstDoc, tgt.id)));
  else if(tgt.kind==="into") wsSetHeadLvl(dstDoc, bid, 2);
  if(srcDoc!==dstDoc && Array.isArray(srcDoc.focus)){
    if(!Array.isArray(dstDoc.focus)) dstDoc.focus = [];
    const mv = srcDoc.focus.filter(id=>!wsFocusKind(srcDoc, id) && wsFocusKind(dstDoc, id));
    if(mv.length){ srcDoc.focus = srcDoc.focus.filter(id=>!mv.includes(id)); dstDoc.focus.push(...mv); }
  }
  return true;
}

    d.blocks.forEach(b=>{ if(b.type==="outline") walk(b.items, 0); });
    return out.join("");
  };
  const fixedDoc = fixed ? wsGet(o.docId) : null;

           <label>Einfügen unter</label><select id="wsi_par" style="width:100%;padding:10px;background:#101216;border:1px solid #30343b;color:var(--text);border-radius:8px;margin-bottom:8px">${parOpts(o.docId||(wsCurrentDoc()||{}).id)}</select>`}

  const upBtn = ()=>{ $("wsi_ok").textContent = chosen.size ? "Einfügen ("+chosen.size+")" : "Einfügen"; };

  $("wsi_q").oninput = draw; draw();

  $("wsi_cancel").onclick = ()=>$("modalBg").remove();
  $("modalBg").onclick = e=>{ if(e.target.id==="modalBg") $("modalBg").remove(); };
  $("wsi_ok").onclick = ()=>{
    if(!chosen.size){ toast("Erst Einträge ankreuzen"); return; }

/* ---- Löschen: Rückfrage, was mit verknüpften Einträgen geschehen soll ---- */
function wsAskLinks(links, what){
  return new Promise(resolve=>{
    if(document.getElementById("modalBg")){ resolve(null); return; }
    const nt = links.filter(l=>l.kind==="todo").length, ng = links.length - nt, parts = [];
    if(nt) parts.push(nt+(nt>1?" ToDos":" ToDo"));
    if(ng) parts.push(ng+(ng>1?" Tages-Ziele":" Tages-Ziel"));
    document.body.insertAdjacentHTML("beforeend",
      `<div class="modal-bg" id="modalBg"><div class="modal">
        <h2>Verknüpfte Einträge</h2>
        <p style="font-size:14px;margin-bottom:12px">${esc(what)} ${/^Dokument|^Block/.test(what)?"enthält":"hat"} ${esc(parts.join(" und "))} verknüpft. Was soll damit geschehen?</p>
        <div class="modal-actions" style="flex-direction:column;align-items:stretch;gap:8px">
          <button class="btn-ghost" id="wsq_keep">Nur hier löschen, ${links.length>1?"die Einträge bleiben":"der Eintrag bleibt"} bestehen</button>
          <button class="btn-primary" id="wsq_del">Auch ${links.length>1?"die verknüpften Einträge":"den verknüpften Eintrag"} löschen</button>
          <button class="btn-ghost" id="wsq_cancel">Abbrechen</button>
        </div></div></div>`);
    const done = v=>{ const m = $("modalBg"); if(m) m.remove(); resolve(v); };
    $("wsq_keep").onclick = ()=>done("keep");
    $("wsq_del").onclick = ()=>done("delete");
    $("wsq_cancel").onclick = ()=>done(null);
    $("modalBg").onclick = e=>{ if(e.target.id==="modalBg") done(null); };
  });
}
async function wsReleaseLinks(links, del){
  let tasksChanged = false, goalsChanged = false;
  for(const L of links){
    if(L.kind==="todo"){
      if(!del) continue;
      const t = tasks.find(x=>x.id===L.ref); if(!t) continue;
      await deleteCalendar(t);
      tasks = tasks.filter(x=>x.id!==t.id); logs = logs.filter(l=>l.itemId!==t.id); tasksChanged = true;
    }else{
      if(L.evId){ try{ await api(`${calUrl(L.calId || defaultCalId || "primary")}/${L.evId}`, {method:"DELETE"}); }catch(e){} }
      if(del){
        try{ await api(`${GTASKS}/lists/${encodeURIComponent(defaultGTaskListId||"@default")}/tasks/${encodeURIComponent(L.ref)}`, {method:"DELETE"}); }
        catch(e){ if(!/404/.test(e.message||"")) throw e; }
        goalsChanged = true;
      }
    }
  }
  if(tasksChanged){ await saveTasks(); await saveLogs(); }
  if(goalsChanged) await loadGTasks();
  if(tasksChanged || goalsChanged) wsRenderIfSafe();
}
const wsLinkCopies = nodes=>wsCollectLinkedNodes(nodes).map(n=>Object.assign({}, n.link));
async function wsDeleteNodeFlow(doc, nid){
  const r = wsFindNode(doc, nid); if(!r) return;
  const c = wsCount(r.node), links = wsLinkCopies([r.node]);
  const nAtt = wsAllNodes({blocks:[{type:"outline", items:[r.node]}]}).reduce((k,x)=>k+x.att.length, 0);
  let mode = "keep";
  if(links.length){
    mode = await wsAskLinks(links, "Dieser Punkt"+(c.total?" samt "+c.total+" Unterpunkten":""));
    if(!mode) return;
  }else if((c.total>0 || nAtt>0) && !confirm("Diesen Punkt samt "+c.total+" Unterpunkten"+(nAtt?" und "+nAtt+" Anhängen":"")+" löschen?")) return;
  const r2 = wsFindNode(doc, nid); if(!r2) return;
  wsTrashPut(wsTrashItem("node", doc, r2.node, {blockId:r2.block.id, parentId:r2.parent?r2.parent.id:"", index:r2.index}));
  wsDeleteNode(doc, nid); wsTouch(doc); wsRerender(doc.id); toast("Im Papierkorb (3 Tage)");
  if(links.length) wsLinkRun(()=>wsReleaseLinks(links, mode==="delete"));
}
async function wsDeleteAttFlow(doc, att){
  const links = att.link ? [Object.assign({}, att.link)] : [];
  let mode = "keep";
  if(links.length){
    mode = await wsAskLinks(links, "Dieser Anhang");
    if(!mode) return;
  }else{
    const empty = att.type==="table" ? att.rows.every(r=>r.every(c=>!c)) : att.type==="link" ? !(att.url||"").trim() && !(att.title||"").trim() : att.type==="file" ? !att.fileId : !(att.text||"").trim();
    if(!empty && !confirm("Diesen Anhang mit Inhalt löschen?")) return;
  }
  const owner = wsAttOwner(doc, att.id); if(!owner) return;
  wsTrashPut(wsTrashItem("att", doc, att, {ownerId:owner.id, index:owner.att.findIndex(x=>x.id===att.id)}));
  owner.att = owner.att.filter(x=>x.id!==att.id); wsTouch(doc); wsRerender(doc.id); toast("Im Papierkorb (3 Tage)");
  if(links.length) wsLinkRun(()=>wsReleaseLinks(links, mode==="delete"));
}
async function wsDeleteBlockFlow(doc, block){
  const links = block.type==="outline" ? wsLinkCopies(block.items) : [];
  let mode = "keep";
  if(links.length){
    mode = await wsAskLinks(links, "Dieser Block");
    if(!mode) return;
  }else{
    const empty = block.type==="table" ? block.rows.every(r=>r.every(c=>!c)) : block.type==="outline" ? !wsOpenCount(doc) && !JSON.stringify(block.items).includes('"text":"') : !(block.text||"").trim();
    if(!empty && !confirm("Diesen Block mit Inhalt löschen?")) return;
  }
  wsTrashPut(wsTrashItem("block", doc, block, {index:doc.blocks.indexOf(block)}));
  doc.blocks = doc.blocks.filter(b=>b.id!==block.id); wsTouch(doc); wsRerender(doc.id); toast("Im Papierkorb (3 Tage)");
  if(links.length) wsLinkRun(()=>wsReleaseLinks(links, mode==="delete"));
}
async function wsDeleteDocFlow(doc){
  if(!confirm('Dokument "'+(doc.title||"Ohne Titel")+'" mit allen Blöcken löschen?')) return;
  const links = wsDocLinkedNodes(doc).map(n=>Object.assign({}, n.link));
  let mode = "keep";
  if(links.length){
    mode = await wsAskLinks(links, "Dokument");
    if(!mode) return;
  }
  wsTrashPut(wsTrashItem("doc", null, doc, {}));
  wsDocs = wsDocs.filter(d=>d.id!==doc.id); wsDirty.delete(doc.id); wsDeleted.set(doc.id, ++wsRev);
  if(wsOpenDocId===doc.id){ wsOpenDocId = null; localStorage.removeItem("wsOpenDoc"); }
  wsScheduleSave(); render();
  if(links.length) wsLinkRun(()=>wsReleaseLinks(links, mode==="delete"));
}

}

/* ---- Abgleich beim Start: der Eintrag gilt, wenn Punkt und Eintrag auseinanderlaufen ---- */
async function wsReconcileLinks(){
  try{
    if(!wsLoaded) return;
    const touched = new Set(), unresolved = [];
    const setN = (doc, n, key, val)=>{ if(n[key]!==val){ n[key] = val; touched.add(doc); } };
    wsDocs.forEach(doc=>{
      wsDocLinkedNodes(doc).forEach(n=>{
        const L = n.link;
        if(L.kind==="todo"){
          if(!tasks.length) return;                                    // Tasks nicht geladen: nichts verändern
          const t = tasks.find(x=>x.id===L.ref);
          if(!t || t.type!=="todo" || t.scheduleType==="weekly"){ n.link = null; touched.add(doc); return; }
          setN(doc, n, "done", isEverDone(t.id));
          if(t.title && wsTitleOf(n)!==t.title){ wsSetTitle(n, t.title); touched.add(doc); }
          { const d = t.startDate || ""; if(wsLinkDay(n)!==d){ wsSetLinkDay(n, d); touched.add(doc); } }
          const cal = !!t.syncCalendar && !!t.calendarEventId;
          if(L.cal!==cal){ L.cal = cal; touched.add(doc); }
        }else{
          const g = allOpenGoals.find(x=>x.id===L.ref) || goalTasks.find(x=>x.id===L.ref);
          if(g){
            setN(doc, n, "done", !!g.completed);
            if(g.title && g.title!=="(ohne Titel)" && wsTitleOf(n)!==g.title){ wsSetTitle(n, g.title); touched.add(doc); }
            if(g.due && wsLinkDay(n)!==g.due){ wsSetLinkDay(n, g.due); touched.add(doc); }
          }else unresolved.push({doc, n});
        }
      });
    });
    // Ziele, die nicht in den geladenen Listen stehen (früher erledigt oder gelöscht): einzeln nachfragen
    if(unresolved.length && defaultGTaskListId){
      for(const {doc, n} of unresolved.slice(0, 30)){
        try{
          const res = await api(`${GTASKS}/lists/${encodeURIComponent(defaultGTaskListId)}/tasks/${encodeURIComponent(n.link.ref)}`);
          if(!res || res.deleted){ n.link = null; touched.add(doc); }
          else if(res.status==="completed") setN(doc, n, "done", true);
        }catch(e){
          if(/404/.test(e.message||"")){ n.link = null; touched.add(doc); }
        }
      }
    }
    touched.forEach(d=>wsTouch(d));
    if(touched.size) console.log("  ✓ wsReconcileLinks: Dokumente angepasst:", touched.size);
  }catch(e){ console.error("wsReconcileLinks:", e.message); }
}


/* ============ HEUTE: Dienstliche Metaprojekte aus dem Arbeitsbereich ============ */
/* Alle als Meta-Projekt markierten, noch nicht abgehakten Punkte; Reihenfolge nach Deadline (oder Ende des Zeitraums), ohne Termin zuletzt. */
function wsMetaNodes(){
  const out = [];
  wsDocs.forEach(doc=>{
    wsAllNodes(doc).forEach(n=>{ if(n.meta && !n.done) out.push({doc, node:n}); });
    doc.blocks.forEach(b=>{ if(b.type==="heading" && b.meta && !b.done) out.push({doc, node:b}); });
  });
  return out;
}

/* ---- Deadlines: Anzeige (Heute und Ansicht Deadlines) ---- */
function wsDlLabel(days){ return days<0 ? "⚠️ überfällig "+Math.abs(days)+"d" : deadlineLabel(days); }
function wsDlCard(it, full){
  const n = it.node, color = deadlineColor(it.days);
  const url = esc(wsShortDate(it.dl));
  let style = `border-left:4px solid ${color}`, tc = "";
  if(full){
    if(it.days<=3){ style = `border-left:3px solid ${color};background:#ef4444;color:#fff`; tc = "color:#fff"; }
    else if(it.days<=7){ style = `border-left:2px solid ${color};background:#fff;color:#000`; tc = "color:#000"; }
    else { style = `border-left:1px solid ${color};background:#bbf7d0;color:#000`; tc = "color:#000"; }
  }
  return `<div class="card" style="${style}">
    <div class="check" data-wsact="dl-done" data-did="${it.doc.id}" data-nid="${n.id}" title="Als erledigt abhaken">${checkSvg()}</div>
    <div class="body" data-wsact="dl-open" data-did="${it.doc.id}" data-nid="${n.id}" style="cursor:pointer">

      <div style="font-size:${full?14:12}px;margin-top:6px;padding:${full?"6px 10px":"4px 8px"};background:${color};color:#fff;border-radius:4px;display:inline-block;font-weight:bold">${wsDlLabel(it.days)}</div>
    </div><button class="mini" data-wsact="dl-edit" data-did="${it.doc.id}" data-nid="${n.id}" title="Bearbeiten: Text, Tag, Termine, ToDo/Ziel" style="align-self:flex-start">✎</button></div>`;

function wsBriefSave(o){ try{ localStorage.setItem("wsBrief", JSON.stringify(o)); }catch(e){} }
function wsBriefClean(t){
  return String(t||"").replace(/[\u{1F000}-\u{1FFFF}☀-➿️]/gu, " ").replace(/[#*_`>|\[\]{}<~^]/g, " ").replace(/\s+/g, " ").trim();
}
function wsBriefDate(k){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(k||"")) return "";
  const [y,m,d] = k.split("-").map(Number);
  return new Date(y, m-1, d).toLocaleDateString("de-DE", {weekday:"long", day:"numeric", month:"long"});
}
function wsBriefWhen(days, k){
  if(days<0) return days===-1 ? "seit gestern überfällig" : "seit "+(-days)+" Tagen überfällig";
  if(days===0) return "heute fällig";
  if(days===1) return "morgen fällig";
  return "fällig am "+wsBriefDate(k);
}
function wsBriefClock(d){ const h = d.getHours(), m = d.getMinutes(); return h+" Uhr"+(m?" "+m:""); }
/* Liefert die Zeilen des Briefings: [{sec, text}]; rein lesend */
function wsBriefBuild(o, today){
  o = o || wsBriefOpts(); today = today || todayKey();
  const out = [], say = (sec, text)=>out.push({sec, text});
  const hr = new Date().getHours();
  say("intro", (hr<11?"Guten Morgen":hr<18?"Guten Tag":"Guten Abend")+". Heute ist "+wsBriefDate(today)+".");
  const cap = (arr, max, fn, sec)=>{ arr.slice(0, max).forEach(fn); if(arr.length>max) say(sec, "Und "+(arr.length-max)+" weitere."); };
  if(o.cal){
    const now = new Date();
    const ev = (typeof todayCalendarEvents!=="undefined" ? todayCalendarEvents : []).filter(e=>e.allDay || e.end>now);
    say("cal", ev.length ? (ev.length===1 ? "Ein Termin im Kalender." : ev.length+" Termine im Kalender.") : "Keine weiteren Kalendertermine heute.");
    cap(ev, 15, e=>say("cal", e.allDay ? "Ganztägig: "+wsBriefClean(e.title)+"." : wsBriefClean(e.title)+", "+(e.start<=now?"läuft bereits, ":"um "+wsBriefClock(e.start)+", ")+"bis "+wsBriefClock(e.end)+"."), "cal");
  }
  if(o.todos || o.duties){
    const key = today;
    const act = tasks.filter(t=>!t.archived && t.type!=="goal" && isDue(t, new Date()));
    const open = sortTasksForToday(act, key).filter(t=>!(t.type==="todo" ? isEverDone(t.id) : isDone(t.id, key)));
    const todos = open.filter(t=>t.type==="todo"), other = open.filter(t=>t.type!=="todo");
    if(o.todos){
      say("todos", todos.length ? (todos.length===1 ? "Ein ToDo für heute." : todos.length+" ToDos für heute.") : "Keine offenen ToDos für heute.");
      cap(todos, 15, t=>{
        let w = "";
        if(t.scheduleType!=="weekly" && wsIsDate(t.startDate||"")) w = ", "+wsBriefWhen(wsDayDiff(today, t.startDate), t.startDate)+(t.startTime?" um "+t.startTime+" Uhr":"");
        say("todos", wsBriefClean(t.title)+w+".");
      }, "todos");
    }
    if(o.duties && other.length){
      say("duties", other.length===1 ? "Eine Pflichtaufgabe oder Gewohnheit." : other.length+" Pflichtaufgaben und Gewohnheiten.");
      cap(other, 15, t=>say("duties", wsBriefClean(t.title)+"."), "duties");
    }
  }
  if(o.dl){
    const list = (typeof wsLoaded!=="undefined" && wsLoaded) ? wsDeadlineItems(wsDocs, today).filter(it=>it.days<=5 && !it.node.meta && !it.node.hid) : [];
    say("dl", list.length ? (list.length===1 ? "Eine dringende Deadline." : list.length+" dringende Deadlines.") : "Keine dringenden Deadlines.");
    cap(list, 10, it=>say("dl", wsBriefClean(wsTitleOf(it.node)||"Ohne Titel")+", Deadline "+(it.days<0?(it.days===-1?"seit gestern überschritten":"seit "+(-it.days)+" Tagen überschritten"):it.days===0?"heute":it.days===1?"morgen":"in "+it.days+" Tagen")+"."), "dl");
  }
  if(o.soon){
    const lim = 7, items = [];
    tasks.forEach(tk=>{
      if(tk.archived || tk.type!=="todo" || tk.scheduleType==="weekly" || !wsIsDate(tk.startDate||"") || isEverDone(tk.id)) return;
      const d = wsDayDiff(today, tk.startDate); if(d>=1 && d<=lim) items.push({d, k:tk.startDate, t:tk.title, tm:tk.startTime||""});
    });
    (typeof allOpenGoals!=="undefined" ? allOpenGoals : []).forEach(g=>{
      const k = (g.due||"").slice(0,10); if(g.completed || !wsIsDate(k)) return;
      const d = wsDayDiff(today, k); if(d>=1 && d<=lim) items.push({d, k, t:g.title, tm:"", goal:true});
    });
    items.sort((a,b)=>a.d-b.d);
    say("soon", items.length ? (items.length===1 ? "Ein Eintrag in den kommenden sieben Tagen." : items.length+" Einträge in den kommenden sieben Tagen.") : "Nichts Terminiertes in den kommenden sieben Tagen.");
    cap(items, 12, it=>say("soon", wsBriefClean(it.t)+(it.goal?" als Tages-Ziel":"")+", "+(it.d===1?"morgen":"am "+wsBriefDate(it.k))+(it.tm?" um "+it.tm+" Uhr":"")+"."), "soon");
  }
  if(o.goals){
    const open = goalTasks.filter(g=>!g.completed);
    say("goals", open.length ? (open.length===1 ? "Ein offenes Tages-Ziel." : open.length+" offene Tages-Ziele.") : (goalTasks.length ? "Alle Tages-Ziele sind erreicht." : "Keine Tages-Ziele für heute."));
    cap(open, 10, g=>say("goals", wsBriefClean(g.title)+"."), "goals");
  }
  if(o.focus && typeof wsLoaded!=="undefined" && wsLoaded){
    const items = wsFocusItems().map(it=>{
      let t = "";
      if(it.kind==="node"){ const r = wsFindNode(it.doc, it.id); t = r ? wsTitleOf(r.node) : ""; }
      else if(it.kind==="att"){ t = wsTitleOf(wsFindAny(it.doc, it.id)); }
      else if(it.kind==="heading"){ const b = wsBlock(it.doc, it.id); t = b ? (b.text||"") : ""; }
      else t = it.kind==="table" ? "Tabelle" : "Notiz";
      return wsBriefClean(t);
    }).filter(Boolean);
    if(items.length){ say("focus", items.length===1 ? "Ein Eintrag im Fokus." : items.length+" Einträge im Fokus."); cap(items, 10, t=>say("focus", t+"."), "focus"); }
  }
  if(o.meta && typeof wsLoaded!=="undefined" && wsLoaded){
    const list = wsMetaNodes().slice(0, 4);
    if(list.length){
      say("meta", list.length===1 ? "Ein Metaprojekt." : list.length+" Metaprojekte.");
      list.forEach(h=>{ const n = h.node, sp = wsSpan(n), k = n.dl || (sp ? sp.end : ""); say("meta", wsBriefClean(wsTitleOf(n)||"Ohne Titel")+(wsIsDate(k)?", "+wsBriefWhen(wsDayDiff(today, k), k).replace("fällig","Termin"):"")+"."); });
    }
  }
  say("outro", "Das war das Briefing.");
  return out;
}
function wsBriefBtnHtml(){
  return `<div style="margin:6px 0 10px"><button class="mini" data-brief="open" style="font-size:15px;padding:8px 14px" title="Anstehende Aufgaben, Ziele und Deadlines vorlesen lassen">🔊 Briefing anhören</button></div>`;

function wsBriefVoice(){
  try{ const v = speechSynthesis.getVoices(); return v.find(x=>/^de[-_]DE/i.test(x.lang)) || v.find(x=>/^de/i.test(x.lang)) || null; }catch(e){ return null; }
}
function wsBriefUi(){
  const m = document.getElementById("wsbrief"); if(!m) return;
  m.querySelectorAll("[data-bl]").forEach(el=>el.classList.toggle("cur", +el.dataset.bl===wsBriefI && (wsBriefOn || wsBriefI>0)));
  const cur = m.querySelector("[data-bl].cur"); if(cur && wsBriefOn) cur.scrollIntoView({block:"nearest"});
  const p = document.getElementById("wsb_play"); if(p) p.textContent = wsBriefOn ? "⏸ Pause" : (wsBriefI>0 ? "▶ Weiter" : "▶ Start");
}
async function wsBriefWake(on){
  try{
    if(on){ if(navigator.wakeLock && !wsBriefLock) wsBriefLock = await navigator.wakeLock.request("screen"); }
    else if(wsBriefLock){ await wsBriefLock.release(); wsBriefLock = null; }
  }catch(e){ wsBriefLock = null; }
}
function wsBriefSpeak(i){
  if(!("speechSynthesis" in window) || typeof SpeechSynthesisUtterance==="undefined"){ toast("Dieses Gerät bietet keine Sprachausgabe im Browser"); return; }
  const tok = ++wsBriefTok;
  speechSynthesis.cancel();
  if(i>=wsBriefQ.length){ wsBriefOn = false; wsBriefI = 0; wsBriefWake(false); wsBriefUi(); return; }
  wsBriefI = i; wsBriefOn = true; wsBriefWake(true); wsBriefUi();
  const u = new SpeechSynthesisUtterance(wsBriefQ[i].text);
  u.lang = "de-DE"; u.rate = wsBriefOpts().rate || 1;
  const v = wsBriefVoice(); if(v) u.voice = v;
  u.onend = ()=>{ if(tok===wsBriefTok && wsBriefOn) wsBriefSpeak(i+1); };
  u.onerror = e=>{
    if(tok!==wsBriefTok || e.error==="canceled" || e.error==="interrupted") return;
    wsBriefOn = false; wsBriefWake(false); wsBriefUi(); toast("Sprachausgabe nicht möglich ("+(e.error||"Fehler")+")");
  };
  setTimeout(()=>{ if(tok===wsBriefTok) speechSynthesis.speak(u); }, 60);
}
function wsBriefHalt(reset){
  wsBriefTok++; wsBriefOn = false;
  try{ speechSynthesis.cancel(); }catch(e){}
  wsBriefWake(false);
  if(reset) wsBriefI = 0;
  wsBriefUi();
}
function wsBriefOpen(){
  if(document.getElementById("modalBg")) return;
  const o = wsBriefOpts();
  wsBriefQ = wsBriefBuild(o); wsBriefI = 0; wsBriefOn = false;
  const lines = ()=>wsBriefQ.map((l,i)=>`<div data-bl="${i}" class="wsb-line">${esc(l.text)}</div>`).join("");
  const voice = ("speechSynthesis" in window) ? "" : `<p class="muted" style="font-size:13px">Dieses Gerät bietet keine Sprachausgabe im Browser. Der Text steht trotzdem unten zum Lesen.</p>`;
  document.body.insertAdjacentHTML("beforeend", `<div class="modal-bg" id="modalBg"><div class="modal" id="wsbrief">
    <h2>🔊 Briefing</h2>${voice}
    <div style="display:flex;flex-wrap:wrap;gap:6px 12px;margin-bottom:8px;font-size:14px">${WS_BRIEF_SECS.map(([k,l])=>`<label style="display:flex;align-items:center;gap:4px"><input type="checkbox" data-bopt="${k}"${o[k]?" checked":""}>${l}</label>`).join("")}</div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:14px">Tempo <select id="wsb_rate" style="padding:4px">${[[0.8,"langsam"],[1,"normal"],[1.2,"schnell"],[1.5,"sehr schnell"]].map(([v,l])=>`<option value="${v}"${(o.rate||1)===v?" selected":""}>${l}</option>`).join("")}</select></div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px"><button class="btn-primary" id="wsb_play">▶ Start</button><button class="btn-ghost" id="wsb_prev">⏮</button><button class="btn-ghost" id="wsb_next">⏭</button><button class="btn-ghost" id="wsb_stop">⏹ Stopp</button></div>
    <div id="wsb_text" style="max-height:38vh;overflow:auto;font-size:14px;line-height:1.5;border:1px solid #30343b;border-radius:8px;padding:8px">${lines()}</div>
    <div class="modal-actions"><button class="btn-ghost" id="wsb_close">Schließen</button></div>
  </div></div>`);
  const close = ()=>{ wsBriefHalt(true); const m = document.getElementById("modalBg"); if(m) m.remove(); };
  const rebuild = ()=>{
    wsBriefHalt(true);
    const o2 = wsBriefOpts(); document.querySelectorAll("[data-bopt]").forEach(c=>{ o2[c.dataset.bopt] = c.checked ? 1 : 0; });
    o2.rate = +document.getElementById("wsb_rate").value || 1; wsBriefSave(o2);
    wsBriefQ = wsBriefBuild(o2); document.getElementById("wsb_text").innerHTML = lines(); wsBriefUi();
  };
  document.getElementById("wsb_close").onclick = close;
  document.getElementById("modalBg").onclick = e=>{ if(e.target.id==="modalBg") close(); };
  document.querySelectorAll("[data-bopt]").forEach(c=>c.onchange = rebuild);
  document.getElementById("wsb_rate").onchange = ()=>{ const o2 = wsBriefOpts(); o2.rate = +document.getElementById("wsb_rate").value || 1; wsBriefSave(o2); if(wsBriefOn) wsBriefSpeak(wsBriefI); };
  document.getElementById("wsb_play").onclick = ()=>{ if(wsBriefOn) wsBriefHalt(false); else wsBriefSpeak(wsBriefI); };
  document.getElementById("wsb_stop").onclick = ()=>wsBriefHalt(true);
  document.getElementById("wsb_prev").onclick = ()=>{ wsBriefSpeak(Math.max(0, wsBriefI-1)); };
  document.getElementById("wsb_next").onclick = ()=>{ wsBriefSpeak(Math.min(wsBriefQ.length-1, wsBriefI+1)); };
  document.getElementById("wsbrief").addEventListener("click", e=>{ const l = e.target.closest("[data-bl]"); if(l) wsBriefSpeak(+l.dataset.bl); });
  try{ speechSynthesis.getVoices(); }catch(e){}
}

function doBackupSilentTodo(){
  const data = {
    type: "todo-app-backup",
    version: 1,
    created: new Date().toISOString(),
    tasks, logs, projects, notes, links, distractions,
    workspace: wsDocs
  };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "todo-app-backup-"+new Date().toISOString().slice(0,10)+".json";
  a.click();
  URL.revokeObjectURL(url);
  console.log("✅ ToDo-App Auto-Backup heruntergeladen");
}
function doBackupTodo(){
  doBackupSilentTodo();
  toast("Backup heruntergeladen");
}
function autoBackupTodo(){
  const lastBackup = localStorage.getItem("todoLastAutoBackup");
  const now = Date.now();
  const sevenDaysMs = 7 * 24 * 60 * 60 * 1000;
  if(!lastBackup || (now - parseInt(lastBackup)) > sevenDaysMs){
    console.log("🔄 ToDo-App Auto-Backup läuft...");
    doBackupSilentTodo();
    localStorage.setItem("todoLastAutoBackup", now.toString());
  }
}
async function doRestoreTodo(){
  const input = document.getElementById("restoreFileTodo");
  if(!input.files || !input.files[0]){ toast("Keine Datei gewählt"); return; }
  const text = await input.files[0].text();
  let data;
  try{ data = JSON.parse(text); }catch(e){ toast("Ungültige Datei"); return; }
  if(!data || (!data.tasks && !data.logs && !data.projects && !data.notes && !data.workspace)){ toast("Ungültiges Format"); return; }

  let addedTasks=0, addedLogs=0, addedProjects=0, addedNotes=0, addedLinks=0, addedDistractions=0;

  if(Array.isArray(data.tasks)){
    const existingIds = new Set(tasks.map(t=>t.id));
    data.tasks.forEach(t=>{ if(t.id && !existingIds.has(t.id)){ tasks.push(t); existingIds.add(t.id); addedTasks++; } });
  }
  if(Array.isArray(data.logs)){
    const existingKeys = new Set(logs.map(l=>l.itemId+"|"+l.date));
    data.logs.forEach(l=>{ const k=l.itemId+"|"+l.date; if(l.itemId && l.date && !existingKeys.has(k)){ logs.push(l); existingKeys.add(k); addedLogs++; } });
  }
  if(Array.isArray(data.projects)){
    const existingIds = new Set(projects.map(p=>p.id));
    data.projects.forEach(p=>{ if(p.id && !existingIds.has(p.id)){ projects.push(p); existingIds.add(p.id); addedProjects++; } });
  }
  if(Array.isArray(data.notes)){
    const existingIds = new Set(notes.map(n=>n.id));
    data.notes.forEach(n=>{ if(n.id && !existingIds.has(n.id)){ notes.push(n); existingIds.add(n.id); addedNotes++; } });
  }
  if(Array.isArray(data.links)){
    const existingIds = new Set(links.map(l=>l.id));
    data.links.forEach(l=>{ if(l.id && !existingIds.has(l.id)){ links.push(l); existingIds.add(l.id); addedLinks++; } });
  }
  if(Array.isArray(data.distractions)){
    const existingIds = new Set(distractions.map(d=>d.id));
    data.distractions.forEach(d=>{ if(d.id && !existingIds.has(d.id)){ distractions.push(d); existingIds.add(d.id); addedDistractions++; } });
  }

  let addedDocs=0;
  if(Array.isArray(data.workspace)){
    if(!wsLoaded){ toast("Arbeitsbereich nicht geladen: Dokumente nicht wiederhergestellt"); }
    else{
      const existingIds = new Set(wsDocs.map(d=>d.id));
      wsNormalizeDocs(data.workspace).forEach(d=>{ if(d.id && !existingIds.has(d.id)){ wsDocs.push(d); wsDirty.set(d.id, ++wsRev); existingIds.add(d.id); addedDocs++; } });
    }
  }

  if(addedTasks) await saveTasks();
  if(addedLogs) await saveLogs();
  if(addedProjects) await saveProjects();
  if(addedNotes) await saveNotes();
  if(addedLinks) await saveLinks();
  if(addedDistractions) await saveDistractions();
  if(addedDocs) await wsFlush();

  render();
  toast(`Wiederhergestellt: ${addedTasks} Aufgaben, ${addedLogs} Log-Einträge, ${addedProjects} Projekte, ${addedNotes} Notizen, ${addedDocs} Dokumente`);
}

    console.log("  ✓ loadAll ok, tasks:",tasks.length,"projects:",projects.length,"notes:",notes.length,"logs:",logs.length);
    
    console.log("3️⃣ purgeStaleGoals...");
    await purgeStaleGoals();
    console.log("  ✓ purgeStaleGoals ok");
    
    console.log("4️⃣ loadCalendars...");
    await loadCalendars();
    console.log("  ✓ loadCalendars ok, calendars:",calendars.length);
    
    console.log("5️⃣ loadGTasks...");
    await loadGTasks();
    console.log("  ✓ loadGTasks ok");
    
    console.log("6️⃣ loadTodayCalendarEvents...");
    await loadTodayCalendarEvents();
    console.log("  ✓ loadTodayCalendarEvents ok, events:",todayCalendarEvents.length);
    
    console.log("  ✓ checkGoalsPenalty...");
    checkGoalsPenalty();
    await wsReconcileLinks();
    
    setSync("on");
    $("acctBtn").textContent="Verbunden";
    $("nav").style.display="flex";
    render();
    autoBackupTodo();
    console.log("✅ bootData FERTIG");
  }catch(e){
    console.error("❌ bootData FEHLER:",e.message);
    alert("Anmeldung fehlgeschlagen:\n"+e.message);
    setSync("off");
  }
}
async function signIn(){
  try{
    await requestToken(true);
    await bootData();
  }catch(e){ console.error(e); toast("Anmeldung abgebrochen"); showSignin(); }
}
function signOut(){
  if(accessToken){ try{ google.accounts.oauth2.revoke(accessToken,()=>{}); }catch(e){} }
  tpReset(); accessToken=null; wsDocs=[]; wsLoaded=false; wsTabOk=false; wsDirty.clear(); wsDeleted.clear(); tasks=[]; logs=[]; gtasks=[]; goalTasks=[]; allOpenGoals=[]; allGTasks=[]; todayCalendarEvents=[];
  localStorage.removeItem("ssid"); spreadsheetId=null;
  $("nav").style.display="none"; $("fab").style.display="none";
  $("acctBtn").textContent="Anmelden"; setSync("");
  showSignin();
}
function showSignin(){
  $("hTitle").textContent="ToDo";
  main.innerHTML=`<div class="signin">
    <div style="font-size:48px">📋</div>
    <h2 style="margin:0">Mit Google verbinden</h2>
    <p>Aufgaben, Gewohnheiten und Termine werden in deiner eigenen Google-Tabelle gespeichert und – optional – mit Google Calendar synchronisiert.</p>
    <button class="btn-primary" id="signinBtn">Mit Google anmelden</button>
  </div>`;
  $("signinBtn").onclick=signIn;
}

$("acctBtn").addEventListener("click",()=>{ if(accessToken) view="settings",render(); else signIn(); });

// Auf GIS-Skript warten
(function waitGIS(){
  if(window.google && google.accounts && google.accounts.oauth2){
    console.log("✅ Google Library geladen");
    try{
      initTokenClient(); 
      console.log("✅ tokenClient initialized");
      showSignin();
    }catch(e){
      console.error("❌ Init-Fehler:", e);
      showSignin();
    }
  }else{
    console.log("⏳ Warte auf Google Library...", {google: !!window.google, accounts: !!window.google?.accounts, oauth2: !!window.google?.accounts?.oauth2});
    setTimeout(waitGIS,50);
  }
})();

// Tageswechsel: Tages-Ziele um Mitternacht zurücksetzen (Ansicht bei laufender App)
let _curDay=todayKey();
setInterval(async()=>{ const k=todayKey(); if(k!==_curDay){ _curDay=k; if(accessToken){ await purgeStaleGoals(); render(); } } },60000);

// Service Worker
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
